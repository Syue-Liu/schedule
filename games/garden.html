<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFCF6">
<title>記憶小森林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css?v=vs-20261031">
<!-- 3D 花園和雲端資料要用的檔案，跟頁面同時開始下載（不用等程式跑到那裡才抓） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<style>
body{min-height:100%;background:#F4F8EC;}
.gd{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 74px) 14px calc(env(safe-area-inset-bottom) + 30px);}
/* 另一半在不在、今天澆了多少 */
.here{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--t2);}
.here b{font-weight:400;padding:3px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);}
.here b.on{background:#E7F2DF;}
.wx{margin:-4px 0 10px;text-align:center;font-size:12px;color:var(--t2);}
.party{margin:0 auto 8px;max-width:440px;padding:6px 12px;border:var(--lw2) solid var(--ink);border-radius:14px;background:linear-gradient(90deg,#FDEEEA,#FDF2D2,#E7F2DF);font-size:14px;color:var(--t);box-shadow:0 2px 0 var(--ink);}
.days-f{display:flex;flex-direction:column;gap:8px;margin-top:4px;text-align:left;}
.days-f label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;}
.days-f input,.days-f select{padding:4px 6px;border:var(--lw2) solid var(--ink);border-radius:10px;background:var(--paper);font:inherit;font-size:16px;}
.wx b{font-weight:400;display:inline-block;padding:2px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#FFFFFFAA;}
.here b.syue{background:#EEF6E8;}.here b.ling{background:#FDEEEA;}
/* 今日問題 */
.qcard{position:relative;padding:14px 14px 12px;border:var(--lw2) solid var(--ink);border-radius:20px;background:linear-gradient(#FFFDF7,#FDF2D2);box-shadow:0 3px 0 var(--ink);}
.q-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#96714D;}
.q-q{font-size:18px;margin:6px 0 10px;line-height:1.5;}
.q-opts{display:flex;gap:8px;flex-wrap:wrap;}
.q-opts button{flex:1;min-width:84px;height:44px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-size:15px;box-shadow:0 2px 0 var(--ink);}
.q-opts button:active{transform:translateY(2px);box-shadow:none;}
.q-text{display:flex;gap:8px;}
.q-text textarea{flex:1;height:64px;padding:8px 10px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font:inherit;font-size:16px;resize:none;}
.q-text button{width:64px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--yellow);font-size:15px;box-shadow:0 2px 0 var(--ink);}
.q-a{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:7px 10px;border-radius:12px;background:#FFFFFFAA;font-size:15px;line-height:1.5;}
.q-a b{flex-shrink:0;font-weight:400;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;}
.q-a.syue b{background:#EEF6E8;}.q-a.ling b{background:#FDEEEA;}
.q-a.wait{color:var(--t3);font-size:13px;}
.q-tip{margin-top:8px;font-size:12px;color:var(--t2);}
.q-match{margin-top:8px;padding:5px 10px;border-radius:12px;background:#FCE6E1;font-size:13px;text-align:center;}
.q-more{display:block;margin:8px 0 0 auto;border:0;background:none;font-size:12px;color:#96714D;}
/* 花園：三排兩列的土，三隻在旁邊看 */
.garden{position:relative;margin-top:14px;padding:12px 10px 14px;border:var(--lw2) solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#CFE8F2 0,#E4F2F8 70px,#C9E3B4 71px,#B5D69C 100%);box-shadow:0 3px 0 var(--ink);}
.garden::before{content:'';position:absolute;right:18px;top:12px;width:40px;height:40px;border-radius:50%;background:#F6D27A;border:var(--lw2) solid var(--ink);}
.fence{position:absolute;left:0;right:0;top:50px;height:24px;background:repeating-linear-gradient(90deg,transparent 0 10px,#E2C9A6 10px 22px,transparent 22px 34px);border-bottom:4px solid #C9A884;opacity:.9;}
.g-pets{position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:64px;margin:0 6px 4px;}
.g-pets img{height:58px;width:auto;transition:transform .2s;}
.g-pets img.hop{animation:gHop .5s var(--pop);}
@keyframes gHop{40%{transform:translateY(-16px) rotate(-5deg);}}
.plots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.plot{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border:2px dashed #8C6A5566;border-radius:16px;background:#FFFFFF33;min-height:150px;}
.plot.has{border-style:solid;border-color:#8C6A5544;background:#FFFFFF4D;}
.plot .art{width:100%;height:104px;display:flex;align-items:flex-end;justify-content:center;}
.plot .art svg{height:100%;width:auto;overflow:visible;}
.plot .pn{font-size:12px;margin-top:2px;white-space:nowrap;}
.bar{width:84%;height:8px;margin-top:3px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B9DAA5,#7FB36E);}
.plot .pw{display:flex;gap:3px;margin-top:4px;font-size:10px;}
.plot .pw span{padding:0 5px;border-radius:999px;background:#FFFFFF99;color:var(--t3);}
.plot .pw span.on.syue{background:#D7ECCB;color:var(--t);}.plot .pw span.on.ling{background:#F8D1CB;color:var(--t);}
.plot .empty{margin:auto;font-size:13px;color:#8C6A55;}
.plot .empty i{display:block;font-style:normal;font-size:26px;text-align:center;}
.plot.ready::after{content:'✨';position:absolute;right:6px;top:4px;font-size:18px;animation:sparkle 1s ease-in-out infinite alternate;}
@keyframes sparkle{to{transform:scale(1.3) rotate(20deg);}}
.plot.thirsty .art svg{filter:saturate(.4) brightness(.97);transform:rotate(-5deg);transform-origin:50% 100%;}
.plot.thirsty::before{content:'口渴了';position:absolute;left:6px;top:6px;padding:0 6px;border-radius:999px;background:#E4F2F8;font-size:10px;}
/* 澆水：水滴掉下來 */
.drop{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7FC4E4;border:1.5px solid #3E7FA0;pointer-events:none;animation:drip .7s ease-in forwards;}
@keyframes drip{from{transform:translateY(-30px);opacity:0;}20%{opacity:1;}to{transform:translateY(60px);opacity:0;}}
.can{position:absolute;font-size:30px;pointer-events:none;animation:can .8s ease-in-out forwards;}
@keyframes can{0%{transform:rotate(0) translateY(-6px);opacity:0;}20%{opacity:1;}50%{transform:rotate(-35deg);}100%{transform:rotate(0);opacity:0;}}
/* 森林：長大的樹 */
.forest{margin-top:16px;}
.forest h3{display:flex;justify-content:space-between;align-items:baseline;font-weight:400;font-size:16px;margin:0 4px 8px;}
.forest h3 small{font-size:12px;color:var(--t3);}
.ftrees{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ftree{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:var(--lw2) solid var(--ink);border-radius:16px;background:var(--paper);font-size:11px;}
.ftree svg{width:100%;height:70px;}
.ftree b{font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ftree span{color:var(--t3);}
.ftabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px;}
.ftabs button{padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;color:var(--t);}
.ftabs button.on{background:#E7F2DF;box-shadow:0 2px 0 var(--ink);}
.ftabs .fx{background:#FDF2D2;}
.ftabs .fsort{margin-left:auto;background:transparent;border-style:dashed;}
.ftabs .ffind{background:#FDEEEA;}
.ftree.none svg{filter:grayscale(1);opacity:.3;}.ftree.none b{color:var(--t3);}
.ftree:disabled{opacity:.75;}
.sh-nav{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 2px;}
.sh-nav button{width:40px;height:34px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);font-size:20px;line-height:1;}
.sh-nav span{font-size:12px;color:var(--t3);}
.fempty{grid-column:1/-1;padding:16px 10px;border:2px dashed #C5AA83;border-radius:16px;font-size:13px;color:var(--t3);text-align:center;}
.gnote{margin-top:16px;text-align:center;}
.gnote button{padding:8px 18px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 2px 0 var(--ink);font-family:inherit;font-size:14px;color:var(--t);cursor:pointer;}
.g-rules h4{margin:12px 0 4px;font-size:14px;font-weight:400;color:var(--t);}.g-rules h4:first-child{margin-top:0;}
.g-rules ul{margin:0;padding-left:18px;}.g-rules li{margin:3px 0;}
.g-rules .next{margin-top:12px;padding:8px 10px;border-radius:12px;background:#F4F8EC;font-size:13px;}
/* 卡片（澆水、種子、回憶） */
.sh-art{height:170px;display:flex;justify-content:center;}
.sh-art svg{height:100%;width:auto;}
.sh-sp{font-size:13px;color:var(--t2);margin-top:-6px;}
.bar.big{width:100%;height:14px;margin:10px 0 4px;}
.sh-num{font-size:12px;color:var(--t3);}
.sh-today{margin-top:8px;font-size:14px;}
.sh-warn{margin-top:8px;padding:5px 10px;border-radius:12px;background:#E4F2F8;font-size:13px;}
.sh-name{display:flex;gap:6px;margin-top:10px;}
.sh-name input{flex:1;height:40px;padding:0 10px;border:var(--lw2) solid var(--ink);border-radius:12px;font:inherit;font-size:16px;}
.sh-name button{padding:0 14px;border:var(--lw2) solid var(--ink);border-radius:12px;background:var(--yellow);font-size:14px;}
.seeds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
.seeds button{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-size:13px;}
.seeds button svg{width:64px;height:70px;}
.seeds button small{font-size:10px;color:var(--t3);}
.seeds button[disabled]{opacity:.45;border-style:dashed;}
.seeds.newsp{max-height:46vh;overflow:auto;}.seeds.newsp div{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-size:13px;}
.seeds.newsp div svg{width:64px;height:70px;}.seeds.newsp div small{font-size:10px;color:var(--t3);}
.mem,.mem-notes,.mem-qa{text-align:left;}
.mem-row{margin-top:6px;font-size:13px;color:var(--t2);text-align:center;}
.mem-notes{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.mem-note{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:12px;background:#F7F1E6;font-size:14px;line-height:1.5;}
.mem-note b{flex-shrink:0;font-weight:400;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;font-size:12px;}
.mem-note.syue b{background:#EEF6E8;}.mem-note.ling b{background:#FDEEEA;}
.mem-note button{border:0;background:none;color:#96714D;font-size:13px;padding:0;}
.mem-note textarea{flex:1;height:52px;border:1.5px solid var(--ink);border-radius:10px;padding:6px;font:inherit;font-size:16px;resize:none;}
.mem-qa{margin-top:12px;}
.mem-qa h3{font-weight:400;font-size:14px;margin-bottom:4px;}
.mem-q{padding:7px 10px;border-top:1px dashed #D2C3AD;font-size:13px;line-height:1.6;}
.mem-q i{font-style:normal;color:#96714D;}
/* 3D 花園（three.js）：拖曳轉、兩指縮放；載不到或手機不支援就用上面的平面花園 */
.g3{position:relative;margin-top:14px;height:min(62vh,560px);border:var(--lw2) solid var(--ink);border-radius:24px;overflow:hidden;background:#BFE3F2;box-shadow:0 3px 0 var(--ink);touch-action:none;}
.g3 canvas{display:block;width:100%;height:100%;}
.g3.full{position:fixed;inset:0;height:auto;margin:0;border:0;border-radius:0;z-index:40;}
/* 3D 花園右上角的工具列：四顆一樣大的方形按鈕，圖示下面一行小字，放在同一塊底板上 */
.g3-tools{position:absolute;right:10px;top:10px;z-index:3;display:flex;flex-direction:column;padding:5px;border:var(--lw2) solid var(--ink);border-radius:18px;background:rgba(255,252,246,.88);box-shadow:0 3px 0 var(--ink);}
.g3.full .g3-tools{top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);}
.g3-tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;padding:0;border:0;border-radius:13px;background:transparent;font-family:inherit;color:var(--t);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.g3-tool+.g3-tool{margin-top:5px;}
.g3-tool+.g3-tool::before{content:'';position:absolute;left:10px;right:10px;top:-3px;border-top:1.5px dashed #DCCFBF;}
.g3-tool i{font-style:normal;font-size:20px;line-height:24px;}
.g3-tool span{margin-top:1px;font-size:10px;line-height:12px;letter-spacing:.5px;color:var(--t2);white-space:nowrap;}
.g3-tool:active{background:#F1E7D6;}
.g3-tool.on{background:#FFE9A8;}.g3-tool.on span{color:var(--t);}
.fbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--ink);white-space:nowrap;}
.fbar[hidden]{display:none;}.fbar b{font-weight:400;font-size:15px;margin-right:4px;}.fbar img{height:26px;width:auto;vertical-align:-6px;}
.fbar button{min-width:38px;height:36px;padding:0 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-family:inherit;font-size:14px;color:var(--t);}
.who-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}.who-pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-family:inherit;font-size:14px;color:var(--t);}.who-pick button img{height:52px;width:auto;}.who-pick .ppl{font-size:30px;line-height:52px;}
.dec-e{display:block;font-size:30px;line-height:1.25;}
.dec-big{font-size:56px;text-align:center;line-height:1.2;}
.mailbtn{position:relative;padding:3px 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;}
.mailbtn.hot{background:#FDE3EA;animation:mailWig 1.1s ease-in-out infinite;}
@keyframes mailWig{0%,60%,100%{transform:rotate(0);}70%{transform:rotate(-12deg);}80%{transform:rotate(10deg);}90%{transform:rotate(-6deg);}}
.mail-bar{display:block;width:100%;margin:8px 0 2px;padding:10px 14px;border:var(--lw2) solid var(--ink);border-radius:16px;background:linear-gradient(#FFEFF3,#FBCFDB);box-shadow:0 3px 0 var(--ink);color:#7A3348;font-family:inherit;font-size:15px;text-align:center;cursor:pointer;animation:mailPulse 1.3s ease-in-out infinite alternate;}
.mail-bar[hidden],.g3-mail[hidden]{display:none;}
@keyframes mailPulse{to{transform:scale(1.025);box-shadow:0 3px 0 var(--ink),0 0 0 5px rgba(242,164,151,.35);}}
.g3-mail{position:absolute;left:10px;top:52px;z-index:3;padding:3px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:#FDE3EA;font-size:20px;box-shadow:0 2px 0 var(--ink);animation:mailWig 1.1s ease-in-out infinite;}
.g3-mail i{font-style:normal;font-size:13px;margin-left:4px;color:#7A3348;}
.g3.full .g3-mail{top:calc(env(safe-area-inset-top) + 56px);}
.mailcard .env-big{display:flex;justify-content:center;margin:8px 0 6px;}
.env{position:relative;width:132px;height:88px;border:var(--lw2) solid var(--ink);border-radius:10px;background:#FFF4EE;box-shadow:0 4px 0 var(--ink);overflow:hidden;animation:envBob 1.3s ease-in-out infinite alternate;}
.env i{position:absolute;left:50%;top:-46px;width:88px;height:88px;margin-left:-44px;border:var(--lw2) solid var(--ink);background:#F8C8D4;transform:rotate(45deg);}
.env b{position:absolute;left:50%;top:44px;transform:translate(-50%,-50%);font-size:26px;font-weight:400;}
@keyframes envBob{from{transform:translateY(0) rotate(-4deg);}to{transform:translateY(-8px) rotate(4deg);}}
.mail em{display:block;margin-top:4px;font-style:normal;font-size:11px;color:var(--t3);text-align:right;}
.mailbtn i{position:absolute;right:-6px;top:-7px;min-width:18px;height:18px;padding:0 4px;border:2px solid var(--ink);border-radius:999px;background:#F2A497;font-style:normal;font-size:11px;line-height:14px;}
.mail-new{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.mail-new textarea{height:70px;padding:8px 10px;border:var(--lw2) solid var(--ink);border-radius:12px;font:inherit;font-size:16px;resize:none;}
.mail-list{max-height:42vh;overflow:auto;margin-top:12px;text-align:left;}
.mail{margin-bottom:8px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;}
.mail.in{background:#FDEEEA;}.mail.out{background:#EEF6E8;}.mail.new{box-shadow:0 0 0 3px #F6D27A;}
.mail b{font-weight:400;font-size:12px;color:var(--t2);}.mail small{float:right;font-size:11px;color:var(--t3);}
.mail p{margin:4px 0 0;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.g3-drops{position:absolute;left:10px;top:10px;padding:4px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:14px;pointer-events:none;}
.g3.full .g3-drops{top:calc(env(safe-area-inset-top) + 12px);}
.g3-tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:4px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:#FFFCF6E6;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .6s;}
.g3.full .g3-tip{bottom:calc(env(safe-area-inset-bottom) + 16px);}
/* 讀取畫面：小芽在澆水、三隻寵物跳一跳；進度條跟著真的載入進度走（動畫只用 transform/opacity，載入卡住的時候也會動） */
.ld{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 36%,#FFFCF6 0,#F4F8EC 55%,#E2EFD8 100%);transition:opacity .45s ease;}
.ld.out{opacity:0;pointer-events:none;}
.ld-back{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);}
.ld-pot{position:relative;width:140px;height:132px;}
.ld-plant{position:absolute;left:10px;right:10px;bottom:14px;height:110px;transform-origin:50% 100%;animation:ldGrow 1.7s ease-in-out infinite alternate;}
.ld-plant svg{display:block;width:100%;height:100%;overflow:visible;}
.ld-soil{position:absolute;left:22px;right:22px;bottom:4px;height:24px;border:var(--lw2) solid var(--ink);border-radius:50%;background:#9C7258;}
.ld-drop{position:absolute;top:-6px;width:10px;height:14px;border:2.5px solid var(--ink);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:#A8D3E6;opacity:0;animation:ldDrop 1.5s ease-in infinite;}
.ld h1{margin:4px 0 0;font-size:25px;font-weight:400;letter-spacing:3px;color:var(--t);}
.ld-pets{display:flex;align-items:flex-end;gap:12px;height:52px;}
.ld-pets img{height:46px;width:auto;animation:ldHop 1s ease-in-out infinite;}

<script>
/* 記憶小森林：兩個人一起種。每天回答一題問答拿水滴，一起澆水，把種子種成樹；長大的樹放進森林，留著那段時間的問答和兩個人的話。
   資料：班表同一個 Firebase 的 banbiao/<同步代碼>_garden（沒有同步代碼就存在這支手機）
     plants.<id>＝{sp 種類, slot 第幾格, at 種下時間, by 誰種的, w:{syue:{日期:滴數}, ling:{…}}, done 長大放進森林的時間, name 名字, note:{syue,ling}, got:{syue,ling} 領過飼料,
                  pos:{x,z} 森林裡的位置（移植過或在 3D 種進森林才有）, mv:{by,at} 最後一次誰移植的}
     decor.<id>＝{k 哪一種裝飾, x, z, by, at, mv}（收起來＝null）；mail.<id>＝{from, to, text, at, read}
     days＝{date 交往那天, wed 結婚那天（YYYY-MM-DD）, syue, ling 生日（MM-DD）}
     qa.<日期>＝{syue:答案, ling:答案}（二選一存第幾個，問答題存文字）；here.<誰>＝最後在花園的時間
   水滴和長多大都是從這些「算」出來的（每個人只寫自己的那幾格），兩個人同時操作也不會互相蓋掉。 */
var BASE=3,ANSWER=2,MATCH=1,TOGETHER=2,BIRD=2,PEST_P=.22,PEST_MAX=3;
/* ── 裝飾品：升級解鎖，擺在 3D 花園裡（點草地選位置，跟移植一樣）；點裝飾可以移動、收起來。信箱可以寫信給對方 ── */
var DECOR={mailbox:{name:'小信箱',e:'📮',lv:1,max:1,tip:'寫信給對方，對方一打開花園就看得到'},lantern:{name:'小路燈',e:'🏮',lv:2,max:4,tip:'晚上會亮起來'},arch:{name:'花拱門',e:'🌸',lv:3,max:2,tip:'開滿小花的拱門'},windmill:{name:'小風車',e:'🎡',lv:4,max:2,tip:'會轉，下雨天轉得更快'},scarecrow:{name:'稻草人',e:'🧑‍🌾',lv:5,max:1,tip:'擺了之後害蟲比較少來'},birdhouse:{name:'鳥屋',e:'🐦',lv:6,max:2,tip:'小鳥比較常來，還會停在上面'},picnic:{name:'野餐墊',e:'🧺',lv:7,max:1,tip:'學和綾會來坐著野餐（放在中間的花園）'}};
function decorList(){var o=[];Object.keys(D.decor||{}).forEach(function(id){var d=D.decor[id];if(d&&DECOR[d.k]&&isFinite(d.x))o.push({id:id,k:d.k,x:+d.x,z:+d.z,rot:+d.rot||0});});return o;}
function decorCount(k){return decorList().filter(function(d){return d.k===k;}).length;}
// 稻草人：害蟲少一點（兩支手機看到的一樣）
function pestP(){return decorCount('scarecrow')?.14:PEST_P;}
/* ── 紀念日：交往、結婚、兩個人的生日、在一起第 100／200／…天，還有班表上每年重複的行程 ──
   那天花園會布置（氣球、彩帶、晚上放煙火、壽星戴派對帽），每個人多 SPECIAL 滴水，第一次打開跳一張卡片 */
var DAYS0={date:'2014-01-05',wed:'2020-01-12',syue:'09-18',ling:'03-26'},SPECIAL=3,yearly=[];
function days(){var d=D.days||{};return {date:d.date||DAYS0.date,wed:d.wed||DAYS0.wed,syue:d.syue||DAYS0.syue,ling:d.ling||DAYS0.ling};}
function together(day){var s=days();return s.date?dnum(day)-dnum(s.date)+1:0;}
/* ── 節日：聖誕節、跨年、過年（除夕～初三）、情人節、七夕、中秋、萬聖節；那天花園換上節日的布置，每個人多 SPECIAL 滴水
   農曆的日期先查好放在這裡（正月初一、七月初七、八月十五） ── */
var LUNAR={cny:{2026:'02-17',2027:'02-06',2028:'01-26',2029:'02-13',2030:'02-03',2031:'01-23',2032:'02-11',2033:'01-31',2034:'02-19',2035:'02-08'},
  qixi:{2026:'08-19',2027:'08-08',2028:'08-26',2029:'08-16',2030:'08-05',2031:'08-24',2032:'08-12',2033:'08-01',2034:'08-20',2035:'08-10'},
  moon:{2026:'09-25',2027:'09-15',2028:'10-03',2029:'09-22',2030:'09-12',2031:'10-01',2032:'09-19',2033:'09-08',2034:'09-27',2035:'09-16'}};
var HOL_NOTE={xmas:'花園下雪了，聖誕樹下有禮物，點聖誕樹拆拆看 🎁',nye:'晚上一起坐在樹屋上倒數、看煙火 🎆',ny:'新的一年也要一起好好種花 🌱',cny:'樹屋掛上紅燈籠、貼好春聯，晚上放鞭炮和煙火 🧨<br>🧧 紅包：今天每個人多 '+SPECIAL+' 滴水',val:'花園飄著愛心和玫瑰花瓣 🌹',qixi:'晚上抬頭看銀河，喜鵲在花園上空搭好鵲橋了 🌌',moon:'今晚月亮特別圓，傍晚學和綾會坐在野餐墊上吃月餅、賞月 🥮',hween:'南瓜燈亮起來了，小心蝙蝠 🦇 寵物都戴上巫師帽'};
function holidayOf(day){
  var m0=String(day).slice(5),y=+String(day).slice(0,4),c;
  if(m0==='12-24')return {h:'xmas',e:'🎄',t:'聖誕夜'};
  if(m0==='12-25')return {h:'xmas',e:'🎄',t:'聖誕快樂'};
  if(m0==='12-31')return {h:'nye',e:'🎆',t:'跨年夜'};
  if(m0==='01-01')return {h:'nye',n:'ny',e:'🎉',t:'新年快樂'};
  if((c=LUNAR.cny[y])){var i=dnum(day)-dnum(y+'-'+c);if(i>=-1&&i<=2)return {h:'cny',e:i<0?'🧨':'🧧',t:['除夕・圍爐','大年初一・新年快樂','初二・新年快樂','初三・新年快樂'][i+1]};}
  if(m0==='02-14')return {h:'val',e:'💝',t:'情人節快樂'};
  if(LUNAR.qixi[y]===m0)return {h:'qixi',e:'🌌',t:'七夕情人節'};
  if(LUNAR.moon[y]===m0)return {h:'moon',e:'🥮',t:'中秋節快樂'};
  if(m0==='10-31')return {h:'hween',e:'🎃',t:'萬聖節快樂'};
  return null;
}
var HOL_RE=/聖誕|耶誕|跨年|元旦|新年|過年|春節|除夕|初一|初二|初三|情人|七夕|中秋|萬聖/;
function special(day){
  var m0=String(day).slice(5),y=+String(day).slice(0,4),s=days(),out=[],hd=holidayOf(day);
  if(hd)out.push({k:'hol',h:hd.h,n:hd.n||hd.h,e:hd.e,t:hd.t});
  if(s.date&&s.date.slice(5)===m0){var n=y-(+s.date.slice(0,4));out.push({k:'date',e:'💞',t:n>0?'交往 '+n+' 週年':'交往紀念日'});}
  if(s.wed&&s.wed.slice(5)===m0){var n2=y-(+s.wed.slice(0,4));out.push({k:'wed',e:'💍',t:n2>0?'結婚 '+n2+' 週年':'結婚紀念日'});}
  ['syue','ling'].forEach(function(u){if(s[u]===m0)out.push({k:'bday',who:u,e:'🎂',t:NAMES[u]+' 生日快樂'});});
  var dn=together(day);if(dn>0&&dn%100===0)out.push({k:'days',e:'✨',t:'在一起第 '+dn+' 天'});
  yearly.forEach(function(e){if(e.md===m0&&!(hd&&HOL_RE.test(e.title))&&!out.some(function(o){return o.k!=='event'&&(e.title.indexOf('生日')>=0&&o.k==='bday'||e.title.indexOf('紀念')>=0&&(o.k==='date'||o.k==='wed'));}))out.push({k:'event',e:e.emoji||'🎉',t:e.title});});
  return out;
}
// 接下來的紀念日（卡片上列出來）
function upcoming(){var d=today(),list=[];for(var i=1;i<=400&&list.length<4;i++){var x=addDays(d,i),sp=special(x);sp.forEach(function(o){if(list.length<4)list.push({day:x,i:i,o:o});});}return list;}
function loadYearly(){if(!cloud||!VS.mainGet)return;VS.mainGet().then(function(raw){var ev=raw&&raw.events;if(!ev||typeof ev!=='object')return;yearly=Object.keys(ev).map(function(k){return ev[k];}).filter(function(e){return e&&e.yearly&&/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')&&e.title;}).map(function(e){return {md:e.date.slice(5),title:String(e.title).slice(0,20),emoji:e.emoji||'🎉'};});paint();partyCard();}).catch(function(e){console.warn('yearly',e);});}
function partyText(){return special(today()).map(function(o){return o.e+' '+o.t;}).join('・');}
// 今天第一次打開：跳一張慶祝卡片
function partyCard(){
  var d=today(),sp=special(d);if(!sp.length||sheet||typing())return;
  try{if(localStorage.getItem('gardenParty')===d)return;localStorage.setItem('gardenParty',d);}catch(e){}
  SND.sfx('fanfare',3);
  var hn=sp.filter(function(o){return o.k==='hol';}).map(function(o){return HOL_NOTE[o.n];})[0]||'',cnyRed=/紅包/.test(hn);
  var ov=card('<div class="dec-big">'+sp.map(function(o){return o.e;}).join('')+'</div><h2>'+esc(sp.map(function(o){return o.t;}).join('・'))+'</h2><p>'+(together(d)>0?'今天是在一起的第 '+together(d)+' 天 💗<br>':'')+(hn?hn+'<br>':'')+(cnyRed?'':'花園布置好了，今天每個人多 '+SPECIAL+' 滴水 🎁')+'</p><div class="g-btns"><button class="g-btn" data-close>🎉 好開心</button></div>');
  ov.querySelector('[data-close]').onclick=closeSheet;
}
// 設定紀念日：兩個人一起看到
function openDays(){
  var s=days(),M=function(v){return v?v.split('-'):['',''];},sb=M(s.syue),lb=M(s.ling);
  function md2(id,v){var mm='',dd='';for(var i=1;i<=12;i++)mm+='<option'+(+v[0]===i?' selected':'')+'>'+i+'</option>';for(var j=1;j<=31;j++)dd+='<option'+(+v[1]===j?' selected':'')+'>'+j+'</option>';return '<select id="'+id+'M">'+mm+'</select> 月 <select id="'+id+'D">'+dd+'</select> 日';}
  var up=upcoming().map(function(u){return '<div class="mem-row">'+u.o.e+' '+esc(u.o.t)+'・'+md(u.day)+'（還有 '+u.i+' 天）</div>';}).join('');

function closeSheet(){if(sheet&&sheet.ov)sheet.ov.remove();sheet=null;clearTimeout(wT);flush();if(lvPending)setTimeout(showLevelUp,350);else if(mailPend)setTimeout(mailCard,350);else if(started&&special(today()).length)setTimeout(partyCard,450);}
// 卡片最上面的 ‹ 3／8 ›：換到上一棵／下一棵（3D 裡也會標出來是哪一棵）
function navHtml(list,id){var i=list.indexOf(id);return list.length>1&&i>=0?'<div class="sh-nav"><button data-prev aria-label="上一棵">‹</button><span>'+(i+1)+' / '+list.length+'</span><button data-next aria-label="下一棵">›</button></div>':'';}
function wireNav(box,list,id,go){var i=list.indexOf(id),pv=box.querySelector('[data-prev]'),nx=box.querySelector('[data-next]');if(pv)pv.onclick=function(){SND.sfx('tap');go(list[(i-1+list.length)%list.length]);};if(nx)nx.onclick=function(){SND.sfx('tap');go(list[(i+1)%list.length]);};}
function plantNav(){var o=[];garden().forEach(function(p){if(p)o.push(p.id);});return o;}
function openPlant(id){
  var naming=false;
  card('','plant');
  sheet.paint=function(){
    var p=D.plants[id];if(!p||p.done){closeSheet();return;}
    var g=grow(p),a=+(((p.w||{}).syue||{})[today()])||0,b=+(((p.w||{}).ling||{})[today()])||0,box=sheet.ov.querySelector('.g-card'),pe=pestOf(p);
    var kept=keepVals(box);
    var nav=plantNav();
    box.innerHTML=navHtml(nav,id)+'<div class="sh-art">'+art(p.sp,g.stage)+'</div><h2>'+esc(p.name||SP[p.sp].name)+'</h2><div class="sh-sp">'+SP[p.sp].name+'・'+stageName(p,g)+'・'+md(dayOf(p.at))+' '+NAMES[p.by]+'種的</div>'+
      '<div class="bar big"><i style="width:'+Math.round(g.r*100)+'%"></i></div><div class="sh-num">'+Math.min(g.pts,g.need)+' / '+g.need+'</div>'+
      '<div class="sh-today">今天 學 💧'+a+'・綾 💧'+b+(a&&b?' ✨ 兩個人都澆了 +'+TOGETHER:'')+(wet(today())&&today()>=WX_START?'・'+(weatherOf(today())==='snow'?'❄️':'🌧️')+' +'+RAIN:'')+'</div>'+(g.rain?'<div class="g-small" style="margin:2px 0 0">淋雨自己長了 '+g.rain*RAIN+' 點</div>':'')+
      (g.stage<4&&thirsty(p)?'<div class="sh-warn">好幾天沒人澆水，口渴了…</div>':'')+
      (pe?'<div class="sh-pest">'+PESTS[pe.kind].e+' 有'+PESTS[pe.kind].name+'在啃葉子！先抓走才能澆水</div>':'')+
      (naming?'<div class="sh-name"><input id="nmIn" maxlength="10" placeholder="幫它取名字" value="'+esc(p.name||'')+'"><button data-save>好</button></div>':'')+
      '<div class="g-btns">'+(g.stage===4?'<button class="g-btn" data-harvest>🌳 種進森林</button>':pe?'<button class="g-btn" data-catch>'+PESTS[pe.kind].e+' 抓走'+PESTS[pe.kind].name+'</button>':'<button class="g-btn" data-water>💧 澆水（還有 '+left()+' 滴）</button>')+
      (naming?'':'<button class="g-btn ghost" data-name>✏️ 取名字</button>')+'<button class="g-btn ghost" data-move>🪴 移植</button>'+(g.stage>0?rotBtns():'')+'<button class="g-btn ghost" data-close>關閉</button></div>'+
      '<p class="g-small">同一天兩個人都有澆，這天多長 '+TOGETHER+' 點</p>';
    restoreVals(box,kept);
    wireNav(box,nav,id,function(nid){id=nid;naming=false;if(g3)Garden3D.mark('plant',nid);sheet.paint();});
    var w=box.querySelector('[data-water]');if(w)w.onclick=function(){water(id);};
    var ct=box.querySelector('[data-catch]');if(ct)ct.onclick=function(){catchPest(id);};
    var hv=box.querySelector('[data-harvest]');if(hv)hv.onclick=function(){harvest(id);};
    box.querySelector('[data-move]').onclick=function(){startMove('plot',id);};
    wireRot(box,'plant',id);
    var nm=box.querySelector('[data-name]');if(nm)nm.onclick=function(){naming=true;sheet.paint();var i=$('nmIn');if(i)i.focus();};
    var sv=box.querySelector('[data-save]');if(sv)sv.onclick=function(){var v=($('nmIn').value||'').trim().slice(0,10);naming=false;write({plants:obj(id,{name:v})});SND.sfx('tap');paint();};
    box.querySelector('[data-close]').onclick=closeSheet;
  };
  sheet.paint();
}
function openSeeds(slot){
  var L=level();
  var ov=card('<h2>🌱 要種什麼呢？</h2><div class="seeds">'+Object.keys(SP).map(function(k){var S=SP[k],lock=L<S.lv;return '<button data-sp="'+k+'"'+(lock?' disabled':'')+'>'+art(k,lock?0:4)+S.name+'<small>'+(lock?'Lv.'+S.lv+' 解鎖':(S.kind==='flower'?'花・':'樹・')+'要 '+S.need+' 點')+'</small></button>';}).join('')+'</div><p class="g-small">花長得快；樹長得慢，但長大很漂亮</p><div class="g-btns"><button class="g-btn ghost" data-close>取消</button></div>');
  ov.querySelectorAll('[data-sp]').forEach(function(b){b.onclick=function(){closeSheet();plantSeed(slot,b.getAttribute('data-sp'));};});
  ov.querySelector('[data-close]').onclick=closeSheet;
}
// 回憶：這棵樹的日子、兩個人澆了多少、留的話、那段時間的問答
function openMemory(id,list){
  var editing=false;list=list||forest().map(function(p){return p.id;});
  card('','memcard');
  sheet.paint=function(){
    var p=D.plants[id];if(!p){closeSheet();return;}
    var g=grow(p),d0=dayOf(p.at),d1=dayOf(p.done||Date.now()),days=dnum(d1)-dnum(d0)+1,box=sheet.ov.querySelector('.g-card'),qs='';
    Object.keys(D.qa).filter(function(d){return d>=d0&&d<=d1&&D.qa[d].syue!=null&&D.qa[d].ling!=null;}).sort().reverse().slice(0,7).forEach(function(d){var Q=qOf(d);qs+='<div class="mem-q"><i>'+md(d)+'・'+esc(Q.q)+'</i><br>學：'+esc(ansText(Q,D.qa[d].syue))+'<br>綾：'+esc(ansText(Q,D.qa[d].ling))+'</div>';});
    var notes=['syue','ling'].map(function(u){var t=(p.note||{})[u];
      if(u===me&&editing)return '<div class="mem-note '+u+'"><b>'+NAMES[u]+'</b><textarea id="ntIn" maxlength="60">'+esc(t||'')+'</textarea><button data-nsave>好</button></div>';
      return '<div class="mem-note '+u+'"><b>'+NAMES[u]+'</b>'+(t?esc(t):'')+(u===me?' <button data-nedit>'+(t?'改一下':'寫一句話給這棵樹')+'</button>':(t?'':'<span style="color:var(--t3)">還沒寫</span>'))+'</div>';}).join('');
    var kept=keepVals(box);
    box.innerHTML=navHtml(list,id)+'<div class="sh-art">'+art(p.sp,4)+'</div><h2>'+esc(p.name||SP[p.sp].name)+'</h2>'+(p.name?'<div class="sh-sp">'+SP[p.sp].name+'</div>':'')+
      '<div class="mem-row">🌱 '+md(d0)+' '+NAMES[p.by]+'種下 → 🌳 '+md(d1)+' 長大（'+days+' 天）</div>'+
      '<div class="mem-row">學 💧'+g.sn+'・綾 💧'+g.ln+'・一起澆水 '+g.both+' 天</div>'+
      '<div class="mem-notes">'+notes+'</div>'+(qs?'<div class="mem-qa"><h3>💬 這段時間的問答</h3>'+qs+'</div>':'')+
      '<div class="g-btns">'+(g3&&p.done?'<button class="g-btn ghost" data-move>🌳 移植</button>'+rotBtns():'')+'<button class="g-btn ghost" data-close>關閉</button></div>';
    restoreVals(box,kept);
    wireNav(box,list,id,function(nid){id=nid;editing=false;if(g3)Garden3D.mark('tree',nid);sheet.paint();});
    var mvb=box.querySelector('[data-move]');if(mvb)mvb.onclick=function(){startMove('tree',id);};
    wireRot(box,'plant',id);
    var ne=box.querySelector('[data-nedit]');if(ne)ne.onclick=function(){editing=true;sheet.paint();var t=$('ntIn');if(t)t.focus();};
    var ns=box.querySelector('[data-nsave]');if(ns)ns.onclick=function(){var v=($('ntIn').value||'').trim().slice(0,60);editing=false;write({plants:obj(id,{note:obj(me,v),nt:obj(me,Date.now())})});SND.sfx('tap');sheet.paint();};
    box.querySelector('[data-close]').onclick=closeSheet;
  };
  sheet.paint();
}
function openHist(){
  var days=Object.keys(D.qa).filter(function(d){return d<=today();}).sort().reverse().slice(0,30),h='';
  days.forEach(function(d){var Q=qOf(d),q=D.qa[d],both=q.syue!=null&&q.ling!=null;
    h+='<div class="mem-q"><i>'+md(d)+'・'+esc(Q.q)+'</i>'+['syue','ling'].map(function(u){return q[u]==null?'':'<br>'+NAMES[u]+'：'+(both||u===me||!cloud?esc(ansText(Q,q[u])):'（你回答後就看得到）');}).join('')+(both&&matched(d)?' 💞':'')+'</div>';});
  var ov=card('<h2>💬 以前的問答</h2><div class="mem" style="max-height:55vh;overflow:auto">'+(h||'<p>還沒有問答紀錄</p>')+'</div><div class="g-btns"><button class="g-btn ghost" data-close>關閉</button></div>');
  ov.querySelector('[data-close]').onclick=closeSheet;
}
function askWho(){
  ldDone();
  var ov=card('<h2>🌱 你是誰？</h2><p>選好之後，你們兩個人澆的水會分開記</p><div class="g-btns"><button class="g-btn" data-u="syue">學</button><button class="g-btn" data-u="ling">綾</button></div>');
  ov.querySelectorAll('[data-u]').forEach(function(b){b.onclick=function(){G.setWho(b.getAttribute('data-u'));location.reload();};});
}
// 第一次來：說明怎麼玩
function help(){
  var L=level(),nt=L<TOPLV?unlockText(L+1):'',first=false;try{first=!localStorage.getItem('gardenHelp');}catch(e){}
  card('<h2>🎮 遊戲操作</h2><div class="g-rules">'+
    '<h4>🖐️ 怎麼操作</h4><ul><li>拖曳轉一圈、兩指拉近拉遠；⤢ 全螢幕、↺ 回到原本的視角</li><li>點土種樹、點植物澆水；滑鼠移過去（手指按著）會亮起來，比較不會點錯</li><li>植物和森林的樹都可以「移植」，把花園排成你們喜歡的樣子</li><li>3D 花園右邊的 👀：選學、綾或一隻寵物，鏡頭就一直跟著他（拖曳繞著看、兩指拉近）</li><li>裝飾、植物、森林的樹都可以轉方向：點它，按「🔄 轉方向」，在花園裡邊看邊按 ↺ ↻</li></ul>'+
    '<h4>💧 水滴</h4><ul><li>每個人每天 '+BASE+' 滴水；回答今日問題 +'+ANSWER+' 滴，二選一兩個人選一樣再各多 '+MATCH+' 滴</li><li>同一天兩個人都澆同一棵，那天多長 '+TOGETHER+' 點</li><li>小鳥飛來的時候點牠，送一滴水（每天最多 '+BIRD+' 滴）；有害蟲要先抓走才能澆水</li><li>下雨、下雪那天，所有植物都會自己長一點</li></ul>'+
    '<h4>🌳 森林</h4><ul><li>長大的植物種進森林，會留下那段時間的問答和你們寫的話</li><li>種進森林兩個人各拿 1 包飼料（算在每天 '+G.CAP+' 包裡）</li><li>澆水、回答、抓害蟲都會加經驗；升級多幾塊土、開放新土地、解鎖新的花和樹</li></ul>'+
    '<h4>🛝 遊樂區（點它們叫學和綾過去）</h4><ul><li>白天溜滑梯、盪鞦韆；下雨、下雪天溜滑梯換成涼亭，喝咖啡吃甜點</li><li>傍晚長椅看夕陽，晚上營火烤棉花糖</li><li>樹屋旁的鞦韆隨時都能盪，兩個人的話一個坐、一個在後面推</li></ul>'+
    '<h4>🎀 裝飾・📮 信箱・🎉 紀念日</h4><ul><li>升級解鎖裝飾（3D 花園右上角 🎀）：路燈、花拱門、風車、稻草人、鳥屋、野餐墊</li><li>📮 寫信給對方，對方一打開班表或花園就會看到</li><li>紀念日（交往、結婚、生日、在一起每 100 天）花園會布置，每個人多 '+SPECIAL+' 滴水</li><li>節日也會布置：聖誕節（點聖誕樹拆禮物）、跨年、過年、情人節、七夕、中秋、萬聖節</li></ul>'+
    (nt?'<div class="next">⬆️ 升到 Lv.'+(L+1)+'：'+esc(nt)+'</div>':'')+
    '</div><div class="g-btns"><button class="g-btn" data-close>'+(first?'開始種':'知道了')+'</button></div>');
  sheet.ov.querySelector('[data-close]').onclick=function(){closeSheet();try{localStorage.setItem('gardenHelp','1');}catch(e){}};
}
// 環境音：白天鳥叫（夏天加蟬）、傍晚鳥少一點、晚上蟋蟀＋營火（鏡頭越靠近營火越大聲）、下雨天雨聲
function ambient(){
  var t=new Date(),h=t.getHours()+t.getMinutes()/60,d=today(),w=weatherOf(d),se=seasonOf(d),ph=h>=5.5&&h<16.5?'day':h>=16.5&&h<19?'eve':'night',wt=w==='rain'||w==='snow',near=g3&&Garden3D.fireNear?Garden3D.fireNear():.5;
  SND.amb({birds:wt?0:ph==='day'?(se==='winter'?.45:1):ph==='eve'?.3:0,cicada:se==='summer'&&ph==='day'&&!wt?.8:0,crickets:ph==='night'&&se!=='winter'&&w!=='rain'?(se==='summer'||se==='autumn'?1:.6):0,fire:ph==='night'?.3+.7*near:0,rain:w==='rain'?1:0});
}
function ready(){
  ldStep('data');loadYearly();setTimeout(partyCard,1200);setTimeout(mailEntry,300);setTimeout(newSpCard,2600);setInterval(ambient,2500);ambient();
  setTimeout(function(){var d=today();try{if(wet(d)&&d>=WX_START&&localStorage.getItem('gardenWx')!==d){localStorage.setItem('gardenWx',d);toast(weatherOf(d)==='snow'?'❄️ 今天下雪了，花園裡的植物都喝到水、自己長了一點；遊樂區搭起涼亭可以喝咖啡 ☕':'🌧️ 今天下雨，花園裡的植物都喝到水、自己長了一點；遊樂區搭起涼亭可以喝咖啡 ☕');}}catch(e){}},1600);
  started=true;
  $('gpets').innerHTML=['cat','pg','dg'].map(function(k){return '<img src="'+G.petImg(k,'happy')+'" alt="'+esc(G.petName(k))+'">';}).join('');
  paint();claim();SND.music('garden');pestSeen=pestsNow().map(function(x){return x.key;});setTimeout(visit2d,12000);
  try{if(!localStorage.getItem('gardenHelp'))help();}catch(e){}
}
// 跨過半夜：題目和水滴換新的一天
var lastDayShown=today(),pestSeen=null;
setInterval(function(){
  if(today()!==lastDayShown){lastDayShown=today();paint();return;}
  if(!started)return;paintHere();
  var now=pestsNow().map(function(x){return x.key;}),fresh=pestSeen?now.filter(function(k){return pestSeen.indexOf(k)<0;}):[];
  pestSeen=now;
  if(fresh.length){var pe=pestsNow().filter(function(x){return x.key===fresh[0];})[0],pl=D.plants[pe.id];toast(PESTS[pe.kind].e+' 有'+PESTS[pe.kind].name+'跑到'+label(pl)+'上了！快抓走');SND.sfx('bonk');paint();}
},15000);
document.addEventListener('focusout',function(e){var t=e.target;if(!t||(t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA'))return;setTimeout(function(){if(started&&!typing()){paint();showLevelUp();}},450);});
// 離開或切到背景：還沒存的水滴馬上存
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(wT);flush();}else if(started){beat();paint();}});
addEventListener('pagehide',function(){clearTimeout(wT);flush();});
start3d();
connect();
</script>
