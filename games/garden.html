<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFCF6">
<title>記憶小森林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">

<!-- 3D 花園和雲端資料要用的檔案，跟頁面同時開始下載（不用等程式跑到那裡才抓） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<style>
body{min-height:100%;background:#F4F8EC;}
.gd{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 74px) 14px calc(env(safe-area-inset-bottom) + 30px);}
/* 另一半在不在、今天澆了多少 */
.here{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--t2);}
.here b{font-weight:400;padding:3px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);}
.here b.on{background:#E7F2DF;}
.wx{margin:-4px 0 10px;text-align:center;font-size:12px;color:var(--t2);}
.party{margin:0 auto 8px;max-width:440px;padding:6px 12px;border:var(--lw2) solid var(--ink);border-radius:14px;background:linear-gradient(90deg,#FDEEEA,#FDF2D2,#E7F2DF);font-size:14px;color:var(--t);box-shadow:0 2px 0 var(--ink);}
.days-f{display:flex;flex-direction:column;gap:8px;margin-top:4px;text-align:left;}
.days-f label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;}
.days-f input,.days-f select{padding:4px 6px;border:var(--lw2) solid var(--ink);border-radius:10px;background:var(--paper);font:inherit;font-size:16px;}
.wx b{font-weight:400;display:inline-block;padding:2px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#FFFFFFAA;}
.here b.syue{background:#EEF6E8;}.here b.ling{background:#FDEEEA;}
/* 今日問題 */
.qcard{position:relative;padding:14px 14px 12px;border:var(--lw2) solid var(--ink);border-radius:20px;background:linear-gradient(#FFFDF7,#FDF2D2);box-shadow:0 3px 0 var(--ink);}
.q-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#96714D;}
.q-q{font-size:18px;margin:6px 0 10px;line-height:1.5;}
.q-opts{display:flex;gap:8px;flex-wrap:wrap;}
.q-opts button{flex:1;min-width:84px;height:44px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-size:15px;box-shadow:0 2px 0 var(--ink);}
.q-opts button:active{transform:translateY(2px);box-shadow:none;}
.q-text{display:flex;gap:8px;}
.q-text textarea{flex:1;height:64px;padding:8px 10px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font:inherit;font-size:16px;resize:none;}
.q-text button{width:64px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--yellow);font-size:15px;box-shadow:0 2px 0 var(--ink);}
.q-a{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:7px 10px;border-radius:12px;background:#FFFFFFAA;font-size:15px;line-height:1.5;}
.q-a b{flex-shrink:0;font-weight:400;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;}
.q-a.syue b{background:#EEF6E8;}.q-a.ling b{background:#FDEEEA;}
.q-a.wait{color:var(--t3);font-size:13px;}
.q-tip{margin-top:8px;font-size:12px;color:var(--t2);}
.q-match{margin-top:8px;padding:5px 10px;border-radius:12px;background:#FCE6E1;font-size:13px;text-align:center;}
.q-more{display:block;margin:8px 0 0 auto;border:0;background:none;font-size:12px;color:#96714D;}
/* 花園：三排兩列的土，三隻在旁邊看 */
.garden{position:relative;margin-top:14px;padding:12px 10px 14px;border:var(--lw2) solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#CFE8F2 0,#E4F2F8 70px,#C9E3B4 71px,#B5D69C 100%);box-shadow:0 3px 0 var(--ink);}
.garden::before{content:'';position:absolute;right:18px;top:12px;width:40px;height:40px;border-radius:50%;background:#F6D27A;border:var(--lw2) solid var(--ink);}
.fence{position:absolute;left:0;right:0;top:50px;height:24px;background:repeating-linear-gradient(90deg,transparent 0 10px,#E2C9A6 10px 22px,transparent 22px 34px);border-bottom:4px solid #C9A884;opacity:.9;}
.g-pets{position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:64px;margin:0 6px 4px;}
.g-pets img{height:58px;width:auto;transition:transform .2s;}
.g-pets img.hop{animation:gHop .5s var(--pop);}
@keyframes gHop{40%{transform:translateY(-16px) rotate(-5deg);}}
.plots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.plot{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border:2px dashed #8C6A5566;border-radius:16px;background:#FFFFFF33;min-height:150px;}
.plot.has{border-style:solid;border-color:#8C6A5544;background:#FFFFFF4D;}
.plot .art{width:100%;height:104px;display:flex;align-items:flex-end;justify-content:center;}
.plot .art svg{height:100%;width:auto;overflow:visible;}
.plot .pn{font-size:12px;margin-top:2px;white-space:nowrap;}
.bar{width:84%;height:8px;margin-top:3px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B9DAA5,#7FB36E);}
.plot .pw{display:flex;gap:3px;margin-top:4px;font-size:10px;}
.plot .pw span{padding:0 5px;border-radius:999px;background:#FFFFFF99;color:var(--t3);}
.plot .pw span.on.syue{background:#D7ECCB;color:var(--t);}.plot .pw span.on.ling{background:#F8D1CB;color:var(--t);}
.plot .empty{margin:auto;font-size:13px;color:#8C6A55;}
.plot .empty i{display:block;font-style:normal;font-size:26px;text-align:center;}
.plot.ready::after{content:'✨';position:absolute;right:6px;top:4px;font-size:18px;animation:sparkle 1s ease-in-out infinite alternate;}
@keyframes sparkle{to{transform:scale(1.3) rotate(20deg);}}
.plot.thirsty .art svg{filter:saturate(.4) brightness(.97);transform:rotate(-5deg);transform-origin:50% 100%;}
.plot.thirsty::before{content:'口渴了';position:absolute;left:6px;top:6px;padding:0 6px;border-radius:999px;background:#E4F2F8;font-size:10px;}
/* 澆水：水滴掉下來 */
.drop{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7FC4E4;border:1.5px solid #3E7FA0;pointer-events:none;animation:drip .7s ease-in forwards;}
@keyframes drip{from{transform:translateY(-30px);opacity:0;}20%{opacity:1;}to{transform:translateY(60px);opacity:0;}}
.can{position:absolute;font-size:30px;pointer-events:none;animation:can .8s ease-in-out forwards;}
@keyframes can{0%{transform:rotate(0) translateY(-6px);opacity:0;}20%{opacity:1;}50%{transform:rotate(-35deg);}100%{transform:rotate(0);opacity:0;}}
/* 森林：長大的樹 */
.forest{margin-top:16px;}
.forest h3{display:flex;justify-content:space-between;align-items:baseline;font-weight:400;font-size:16px;margin:0 4px 8px;}
.forest h3 small{font-size:12px;color:var(--t3);}
.ftrees{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ftree{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:var(--lw2) solid var(--ink);border-radius:16px;background:var(--paper);font-size:11px;}
.ftree svg{width:100%;height:70px;}
.ftree b{font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ftree span{color:var(--t3);}
.fempty{grid-column:1/-1;padding:16px 10px;border:2px dashed #C5AA83;border-radius:16px;font-size:13px;color:var(--t3);text-align:center;}
.gnote{margin-top:16px;font-size:12px;color:var(--t3);text-align:center;line-height:1.7;}
/* 卡片（澆水、種子、回憶） */
.sh-art{height:170px;display:flex;justify-content:center;}
.sh-art svg{height:100%;width:auto;}
.sh-sp{font-size:13px;color:var(--t2);margin-top:-6px;}
.bar.big{width:100%;height:14px;margin:10px 0 4px;}
.sh-num{font-size:12px;color:var(--t3);}
.sh-today{margin-top:8px;font-size:14px;}
.sh-warn{margin-top:8px;padding:5px 10px;border-radius:12px;background:#E4F2F8;font-size:13px;}
.sh-name{display:flex;gap:6px;margin-top:10px;}
.sh-name input{flex:1;height:40px;padding:0 10px;border:var(--lw2) solid var(--ink);border-radius:12px;font:inherit;font-size:16px;}
.sh-name button{padding:0 14px;border:var(--lw2) solid var(--ink);border-radius:12px;background:var(--yellow);font-size:14px;}
.seeds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}
.seeds button{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-size:13px;}
.seeds button svg{width:64px;height:70px;}
.seeds button small{font-size:10px;color:var(--t3);}
.seeds button[disabled]{opacity:.45;border-style:dashed;}
.mem,.mem-notes,.mem-qa{text-align:left;}
.mem-row{margin-top:6px;font-size:13px;color:var(--t2);text-align:center;}
.mem-notes{margin-top:10px;display:flex;flex-direction:column;gap:6px;}
.mem-note{display:flex;gap:8px;align-items:flex-start;padding:7px 10px;border-radius:12px;background:#F7F1E6;font-size:14px;line-height:1.5;}
.mem-note b{flex-shrink:0;font-weight:400;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;font-size:12px;}
.mem-note.syue b{background:#EEF6E8;}.mem-note.ling b{background:#FDEEEA;}
.mem-note button{border:0;background:none;color:#96714D;font-size:13px;padding:0;}
.mem-note textarea{flex:1;height:52px;border:1.5px solid var(--ink);border-radius:10px;padding:6px;font:inherit;font-size:16px;resize:none;}
.mem-qa{margin-top:12px;}
.mem-qa h3{font-weight:400;font-size:14px;margin-bottom:4px;}
.mem-q{padding:7px 10px;border-top:1px dashed #D2C3AD;font-size:13px;line-height:1.6;}
.mem-q i{font-style:normal;color:#96714D;}
/* 3D 花園（three.js）：拖曳轉、兩指縮放；載不到或手機不支援就用上面的平面花園 */
.g3{position:relative;margin-top:14px;height:min(62vh,560px);border:var(--lw2) solid var(--ink);border-radius:24px;overflow:hidden;background:#BFE3F2;box-shadow:0 3px 0 var(--ink);touch-action:none;}
.g3 canvas{display:block;width:100%;height:100%;}
.g3.full{position:fixed;inset:0;height:auto;margin:0;border:0;border-radius:0;z-index:40;}
.g3-btn{position:absolute;right:10px;top:10px;width:40px;height:40px;border:var(--lw2) solid var(--ink);border-radius:12px;background:var(--paper);font-size:18px;box-shadow:0 2px 0 var(--ink);}
.g3-reset{top:60px;font-size:14px;width:auto;padding:0 10px;}
.g3.full .g3-btn.g3-reset{top:calc(env(safe-area-inset-top) + 62px);}
.g3-decor{top:110px;}
.g3.full .g3-btn.g3-decor{top:calc(env(safe-area-inset-top) + 112px);}
.dec-e{display:block;font-size:30px;line-height:1.25;}
.dec-big{font-size:56px;text-align:center;line-height:1.2;}
.mailbtn{position:relative;padding:3px 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;}
.mailbtn i{position:absolute;right:-6px;top:-7px;min-width:18px;height:18px;padding:0 4px;border:2px solid var(--ink);border-radius:999px;background:#F2A497;font-style:normal;font-size:11px;line-height:14px;}
.mail-new{display:flex;flex-direction:column;gap:6px;margin-top:6px;}
.mail-new textarea{height:70px;padding:8px 10px;border:var(--lw2) solid var(--ink);border-radius:12px;font:inherit;font-size:16px;resize:none;}
.mail-list{max-height:42vh;overflow:auto;margin-top:12px;text-align:left;}
.mail{margin-bottom:8px;padding:8px 10px;border:1.5px solid var(--ink);border-radius:12px;}
.mail.in{background:#FDEEEA;}.mail.out{background:#EEF6E8;}.mail.new{box-shadow:0 0 0 3px #F6D27A;}
.mail b{font-weight:400;font-size:12px;color:var(--t2);}.mail small{float:right;font-size:11px;color:var(--t3);}
.mail p{margin:4px 0 0;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word;}
.g3-drops{position:absolute;left:10px;top:10px;padding:4px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:14px;pointer-events:none;}
.g3.full .g3-btn,.g3.full .g3-drops{top:calc(env(safe-area-inset-top) + 12px);}
.g3-tip{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);padding:4px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:#FFFCF6E6;font-size:12px;white-space:nowrap;pointer-events:none;transition:opacity .6s;}
.g3.full .g3-tip{bottom:calc(env(safe-area-inset-bottom) + 16px);}
/* 讀取畫面：小芽在澆水、三隻寵物跳一跳；進度條跟著真的載入進度走（動畫只用 transform/opacity，載入卡住的時候也會動） */
.ld{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 36%,#FFFCF6 0,#F4F8EC 55%,#E2EFD8 100%);transition:opacity .45s ease;}
.ld.out{opacity:0;pointer-events:none;}
.ld-back{position:absolute;left:12px;top:calc(env(safe-area-inset-top) + 10px);}
.ld-pot{position:relative;width:140px;height:132px;}
.ld-plant{position:absolute;left:10px;right:10px;bottom:14px;height:110px;transform-origin:50% 100%;animation:ldGrow 1.7s ease-in-out infinite alternate;}
.ld-plant svg{display:block;width:100%;height:100%;overflow:visible;}
.ld-soil{position:absolute;left:22px;right:22px;bottom:4px;height:24px;border:var(--lw2) solid var(--ink);border-radius:50%;background:#9C7258;}
.ld-drop{position:absolute;top:-6px;width:10px;height:14px;border:2.5px solid var(--ink);border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:#A8D3E6;opacity:0;animation:ldDrop 1.5s ease-in infinite;}
.ld h1{margin:4px 0 0;font-size:25px;font-weight:400;letter-spacing:3px;color:var(--t);}
.ld-pets{display:flex;align-items:flex-end;gap:12px;height:52px;}
.ld-pets img{height:46px;width:auto;animation:ldHop 1s ease-in-out infinite;}
.ld-pets img:nth-child(2){height:40px;animation-delay:.18s;}.ld-pets img:nth-child(3){animation-delay:.36s;}
.ld-bar{width:min(70vw,270px);height:16px;margin-top:4px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;box-shadow:0 2px 0 var(--ink);}
.ld-bar i{display:block;height:100%;background:linear-gradient(90deg,#B9DAA5,#7FB36E);transform-origin:0 50%;transform:scaleX(.04);transition:transform .35s ease;}
.ld-txt{margin:0;min-height:20px;font-size:14px;color:var(--t2);}
.ld-tip{margin:6px 0 0;max-width:270px;min-height:36px;text-align:center;font-size:12px;line-height:1.5;color:var(--t3);transition:opacity .3s;}
@keyframes ldGrow{from{transform:scale(.9,.84) rotate(-3deg);}to{transform:scale(1,1) rotate(3deg);}}
@keyframes ldDrop{0%{transform:translateY(0);opacity:0;}15%{opacity:1;}75%{opacity:1;}100%{transform:translateY(62px);opacity:0;}}
@keyframes ldHop{0%,60%,100%{transform:translateY(0);}30%{transform:translateY(-12px);}}
@media (prefers-reduced-motion:reduce){.ld *{animation:none!important;}}
.g3-load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--t2);}
.try3d .garden,.is3d .garden{display:none;}
.no3d .g3{display:none;}
.lvl{display:flex;align-items:center;gap:8px;width:100%;margin-bottom:10px;padding:7px 12px;border:var(--lw2) solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 2px 0 var(--ink);font-size:13px;text-align:left;}
.lvl b{font-weight:400;white-space:nowrap;}
.lvl .xpb{flex:1;height:10px;border:1.5px solid var(--ink);border-radius:999px;background:#F4F8EC;overflow:hidden;}
.lvl .xpb i{display:block;height:100%;background:linear-gradient(90deg,#F6D27A,#7FB36E);}
.lvl small{color:var(--t3);white-space:nowrap;}
.lv-row{display:flex;gap:8px;align-items:flex-start;padding:7px 4px;border-top:1px dashed #D2C3AD;font-size:13px;text-align:left;line-height:1.5;}
.lv-row b{flex-shrink:0;font-weight:400;width:46px;padding:0 6px;border:1.5px solid var(--ink);border-radius:999px;text-align:center;background:var(--paper);}
.lv-row.on b{background:var(--yellow);}.lv-row.done{color:var(--t3);}
.plot .pest{position:absolute;left:6px;bottom:46px;font-size:24px;animation:wiggle .6s ease-in-out infinite alternate;}
@keyframes wiggle{to{transform:translateX(6px) rotate(8deg);}}
.plot.lock{border-style:dashed;opacity:.55;}
.plot-land{grid-column:1/-1;margin-top:4px;font-size:13px;color:#6B5A4E;}
.plot.target{border:2px dashed #6FA35E;background:#E9F5E1CC;}
.plot.swap{border-color:#6FA35E;}
.plot.moving{border:3px solid #F6D27A;background:#FDF2D2CC;}
.lv-list{max-height:46vh;overflow:auto;}
.mvbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:50;width:min(92vw,420px);box-sizing:border-box;padding:10px 14px;border:var(--lw2) solid var(--ink);border-radius:18px;background:var(--paper);box-shadow:0 3px 0 var(--ink);text-align:center;font-size:15px;}
.mvbar[hidden]{display:none;}
.mvbar span{display:block;margin-top:2px;font-size:12px;color:var(--t2);}
.mvbar span.bad{color:#C2553F;}
.mvbar .g-btns{margin-top:8px;}
.mv-lands{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:8px;}
.mv-lands button{padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:#FFFFFF;font-size:12px;}
.sh-pest{margin-top:8px;padding:6px 10px;border-radius:12px;background:#FCE6E1;font-size:13px;}
.visitor{position:absolute;z-index:3;top:30%;font-size:28px;border:0;background:none;padding:4px;animation:fly 10s linear forwards;}
@keyframes fly{from{left:-14%;}to{left:108%;}}
.toasts{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:max-content;max-width:92vw;}
.toasts div{padding:6px 14px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;box-shadow:0 3px 0 var(--ink);animation:tIn .3s var(--pop),tOut .4s ease-in 2.8s forwards;}
@keyframes tIn{from{transform:translateY(-10px) scale(.9);opacity:0;}}
@keyframes tOut{to{opacity:0;transform:translateY(-8px);}}
</style>

<body data-game="garden" class="try3d">
<div class="ld" id="ld" role="status" aria-live="polite">
  <button class="g-back ld-back" onclick="location.href='./'">‹ 大廳</button>

function allow(u,day){var q=D.qa[day]||{};return BASE+(q[u]!=null?ANSWER:0)+(matched(day)?MATCH:0)+gifts(u,day)+(special(day).length?SPECIAL:0);}

function garden(){
  var os=openSlots(level()),on={},slots=[];os.forEach(function(i){on[i]=1;});
  all().filter(function(p){return !p.done;}).sort(function(a,b){return a.at-b.at;}).forEach(function(p){var k=+p.slot||0;if(!on[k]||slots[k]){k=-1;for(var j=0;j<os.length;j++)if(!slots[os[j]]){k=os[j];break;}}if(k>=0)slots[k]=p;});

/* ── 季節、天氣：照日期算（兩支手機一樣）；3～5 月春、6～8 夏、9～11 秋、12～2 冬；冬天的雨變成雪 ──
   下雨（下雪）那天，花園裡每一棵還在長的植物都自己長 RAIN 點，也算有喝到水（不會口渴）；從 WX_START 這天開始算 */
var RAIN=1,WX_START='2026-11-05',wxMemo={};

// 澆一滴：馬上長、畫面先動；連點的話 0.35 秒後一次存
function water(id){
  var p=D.plants[id];if(!p||p.done)return;
  var g0=grow(p);if(g0.stage===4){toast('長大了！種進森林吧');return;}
  var pe=pestOf(p);if(pe){toast('先把'+PESTS[pe.kind].name+'抓走才能澆水 '+PESTS[pe.kind].e);SND.sfx('swish');return;}
  if(left()<=0){toast(((D.qa[today()]||{})[me]==null?'今天的水用完了，回答今日問題可以多拿 '+ANSWER+' 滴':'今天的水用完了，明天再來澆吧'));SND.sfx('swish');return;}
  var day=today(),w=p.w||(p.w={}),mw=w[me]||(w[me]={});mw[day]=(+mw[day]||0)+1;pendW[id]=mw[day];
  clearTimeout(wT);wT=setTimeout(flush,350);
  SND.sfx('water');paint();splash(id);
  var g1=grow(p);if(g1.stage>g0.stage){setTimeout(function(){SND.sfx('grow');toast(g1.stage===4?label(p)+(SP[p.sp].kind==='flower'?'開花了！🌸':'長大了！🌳'):label(p)+stageName(p,g1)+'！');},300);}
}
// 抓走害蟲：記在 pests.<植物_日期>，另一半那邊也會不見

  if(g3)Garden3D.shoo(id);

}
// 小鳥：點牠送一滴水（每個人每天最多 2 滴）；回傳有沒有送
function birdGift(){
  var day=today(),n=+((D.bonus[me]||{})[day])||0;

/* ── 移植：森林的樹搬到新位置（3D）；長大中的植物搬到別塊土（點有植物的土就交換） ── */
function setFull(on){var box=$('g3');box.classList.toggle('full',on);$('g3full').textContent=on?'✕':'⤢';document.body.style.overflow=on?'hidden':'';}
function startMove(kind,id){

  if(g3&&!Garden3D.move(kind,id)){toast('找不到這棵，等一下再試');return;}
  moving={kind:kind,id:id,sel:null,full:g3&&!$('g3').classList.contains('full')};

function endMove(){

}
function paintMove(){

      '<div class="g-btns">'+(s&&s.ok?'<button class="g-btn" data-ok>放在這裡</button>':'')+'<button class="g-btn ghost" data-cancel>取消</button></div>';

function movePlotTo(slot){

}
function openSeeds(slot){
  var L=level();
  var ov=card('<h2>🌱 要種什麼呢？</h2><div class="seeds">'+Object.keys(SP).map(function(k){var S=SP[k],lock=L<S.lv;return '<button data-sp="'+k+'"'+(lock?' disabled':'')+'>'+art(k,lock?0:4)+S.name+'<small>'+(lock?'Lv.'+S.lv+' 解鎖':(S.kind==='flower'?'花・':'樹・')+'要 '+S.need+' 點')+'</small></button>';}).join('')+'</div><p class="g-small">花長得快；樹長得慢，但長大很漂亮</p><div class="g-btns"><button class="g-btn ghost" data-close>取消</button></div>');
  ov.querySelectorAll('[data-sp]').forEach(function(b){b.onclick=function(){closeSheet();plantSeed(slot,b.getAttribute('data-sp'));};});
  ov.querySelector('[data-close]').onclick=closeSheet;
}
// 回憶：這棵樹的日子、兩個人澆了多少、留的話、那段時間的問答
function openMemory(id){
  var editing=false;
  card('','memcard');
  sheet.paint=function(){
    var p=D.plants[id];if(!p){closeSheet();return;}
    var g=grow(p),d0=dayOf(p.at),d1=dayOf(p.done||Date.now()),days=dnum(d1)-dnum(d0)+1,box=sheet.ov.querySelector('.g-card'),qs='';
    Object.keys(D.qa).filter(function(d){return d>=d0&&d<=d1&&D.qa[d].syue!=null&&D.qa[d].ling!=null;}).sort().reverse().slice(0,7).forEach(function(d){var Q=qOf(d);qs+='<div class="mem-q"><i>'+md(d)+'・'+esc(Q.q)+'</i><br>學：'+esc(ansText(Q,D.qa[d].syue))+'<br>綾：'+esc(ansText(Q,D.qa[d].ling))+'</div>';});
    var notes=['syue','ling'].map(function(u){var t=(p.note||{})[u];
      if(u===me&&editing)return '<div class="mem-note '+u+'"><b>'+NAMES[u]+'</b><textarea id="ntIn" maxlength="60">'+esc(t||'')+'</textarea><button data-nsave>好</button></div>';
      return '<div class="mem-note '+u+'"><b>'+NAMES[u]+'</b>'+(t?esc(t):'')+(u===me?' <button data-nedit>'+(t?'改一下':'寫一句話給這棵樹')+'</button>':(t?'':'<span style="color:var(--t3)">還沒寫</span>'))+'</div>';}).join('');
    var kept=keepVals(box);
    box.innerHTML='<div class="sh-art">'+art(p.sp,4)+'</div><h2>'+esc(p.name||SP[p.sp].name)+'</h2>'+(p.name?'<div class="sh-sp">'+SP[p.sp].name+'</div>':'')+
      '<div class="mem-row">🌱 '+md(d0)+' '+NAMES[p.by]+'種下 → 🌳 '+md(d1)+' 長大（'+days+' 天）</div>'+
      '<div class="mem-row">學 💧'+g.sn+'・綾 💧'+g.ln+'・一起澆水 '+g.both+' 天</div>'+
      '<div class="mem-notes">'+notes+'</div>'+(qs?'<div class="mem-qa"><h3>💬 這段時間的問答</h3>'+qs+'</div>':'')+
      '<div class="g-btns">'+(g3&&p.done?'<button class="g-btn ghost" data-move>🌳 移植</button>':'')+'<button class="g-btn ghost" data-close>關閉</button></div>';
    restoreVals(box,kept);
    var mvb=box.querySelector('[data-move]');if(mvb)mvb.onclick=function(){startMove('tree',id);};
    var ne=box.querySelector('[data-nedit]');if(ne)ne.onclick=function(){editing=true;sheet.paint();var t=$('ntIn');if(t)t.focus();};
    var ns=box.querySelector('[data-nsave]');if(ns)ns.onclick=function(){var v=($('ntIn').value||'').trim().slice(0,60);editing=false;write({plants:obj(id,{note:obj(me,v)})});SND.sfx('tap');sheet.paint();};
    box.querySelector('[data-close]').onclick=closeSheet;
  };
  sheet.paint();
}
function openHist(){
  var days=Object.keys(D.qa).filter(function(d){return d<=today();}).sort().reverse().slice(0,30),h='';
  days.forEach(function(d){var Q=qOf(d),q=D.qa[d],both=q.syue!=null&&q.ling!=null;
    h+='<div class="mem-q"><i>'+md(d)+'・'+esc(Q.q)+'</i>'+['syue','ling'].map(function(u){return q[u]==null?'':'<br>'+NAMES[u]+'：'+(both||u===me||!cloud?esc(ansText(Q,q[u])):'（你回答後就看得到）');}).join('')+(both&&matched(d)?' 💞':'')+'</div>';});
  var ov=card('<h2>💬 以前的問答</h2><div class="mem" style="max-height:55vh;overflow:auto">'+(h||'<p>還沒有問答紀錄</p>')+'</div><div class="g-btns"><button class="g-btn ghost" data-close>關閉</button></div>');
  ov.querySelector('[data-close]').onclick=closeSheet;
}
function askWho(){
  ldDone();
  var ov=card('<h2>🌱 你是誰？</h2><p>選好之後，你們兩個人澆的水會分開記</p><div class="g-btns"><button class="g-btn" data-u="syue">學</button><button class="g-btn" data-u="ling">綾</button></div>');
  ov.querySelectorAll('[data-u]').forEach(function(b){b.onclick=function(){G.setWho(b.getAttribute('data-u'));location.reload();};});
}
// 第一次來：說明怎麼玩
function help(){
  card('<h2>🌳 記憶小森林</h2><ol class="g-rules"><li>每天有一題「今日問題」，回答拿 '+ANSWER+' 滴水；二選一兩個人選一樣，再各多 '+MATCH+' 滴</li><li>每個人每天有 '+BASE+' 滴水，點植物就能澆</li><li>同一天兩個人都澆同一棵，那天多長 '+TOGETHER+' 點</li><li>長大的植物種進森林，會留下那段時間的問答和你們寫的話</li><li>種進森林兩個人各拿 1 包飼料</li><li>澆水、回答、抓害蟲都會加經驗；花園升級會多幾塊土、解鎖新的花和樹</li><li>小鳥來的時候點牠，會送一滴水；害蟲跑來要抓走才能澆水</li><li>升級會開放新土地；植物和森林的樹都可以移植，一起把花園排成喜歡的樣子</li><li>花園跟著季節和天氣變；下雨、下雪那天，所有植物都會自己長一點</li><li>🎉 紀念日（交往、結婚、生日、在一起每 100 天）花園會布置，每個人多 3 滴水</li><li>升級會解鎖裝飾品（3D 花園右上角 🎀）：路燈、花拱門、風車、稻草人、鳥屋、野餐墊；📮 信箱可以寫信給對方</li><li>花園左後方的遊樂區跟著時間變：白天溜滑梯、盪鞦韆，傍晚長椅看夕陽，晚上營火烤棉花糖；點它們，學和綾就會過去</li></ol><div class="g-btns"><button class="g-btn" data-close>開始種</button></div>');
  sheet.ov.querySelector('[data-close]').onclick=function(){closeSheet();try{localStorage.setItem('gardenHelp','1');}catch(e){}};
}
// 環境音：白天鳥叫（夏天加蟬）、傍晚鳥少一點、晚上蟋蟀＋營火（鏡頭越靠近營火越大聲）、下雨天雨聲
function ambient(){
  var t=new Date(),h=t.getHours()+t.getMinutes()/60,d=today(),w=weatherOf(d),se=seasonOf(d),ph=h>=5.5&&h<16.5?'day':h>=16.5&&h<19?'eve':'night',wt=w==='rain'||w==='snow',near=g3&&Garden3D.fireNear?Garden3D.fireNear():.5;
  SND.amb({birds:wt?0:ph==='day'?(se==='winter'?.45:1):ph==='eve'?.3:0,cicada:se==='summer'&&ph==='day'&&!wt?.8:0,crickets:ph==='night'&&se!=='winter'&&w!=='rain'?(se==='summer'||se==='autumn'?1:.6):0,fire:ph==='night'?.3+.7*near:0,rain:w==='rain'?1:0});
}
function ready(){
  ldStep('data');loadYearly();setTimeout(partyCard,1200);setInterval(ambient,2500);ambient();
  setTimeout(function(){var d=today();try{if(wet(d)&&d>=WX_START&&localStorage.getItem('gardenWx')!==d){localStorage.setItem('gardenWx',d);toast(weatherOf(d)==='snow'?'❄️ 今天下雪了，花園裡的植物都喝到水、自己長了一點':'🌧️ 今天下雨，花園裡的植物都喝到水、自己長了一點');}}catch(e){}},1600);
  started=true;
  $('gpets').innerHTML=['cat','pg','dg'].map(function(k){return '<img src="'+G.petImg(k,'happy')+'" alt="'+esc(G.petName(k))+'">';}).join('');
  paint();claim();SND.music('garden');pestSeen=pestsNow().map(function(x){return x.key;});setTimeout(visit2d,12000);
  try{if(!localStorage.getItem('gardenHelp'))help();}catch(e){}
}
// 跨過半夜：題目和水滴換新的一天
var lastDayShown=today(),pestSeen=null;
setInterval(function(){
  if(today()!==lastDayShown){lastDayShown=today();paint();return;}
  if(!started)return;paintHere();
  var now=pestsNow().map(function(x){return x.key;}),fresh=pestSeen?now.filter(function(k){return pestSeen.indexOf(k)<0;}):[];
  pestSeen=now;
  if(fresh.length){var pe=pestsNow().filter(function(x){return x.key===fresh[0];})[0],pl=D.plants[pe.id];toast(PESTS[pe.kind].e+' 有'+PESTS[pe.kind].name+'跑到'+label(pl)+'上了！快抓走');SND.sfx('bonk');paint();}
},15000);
document.addEventListener('focusout',function(e){var t=e.target;if(!t||(t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA'))return;setTimeout(function(){if(started&&!typing()){paint();showLevelUp();}},450);});
// 離開或切到背景：還沒存的水滴馬上存
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(wT);flush();}else if(started){beat();paint();}});
addEventListener('pagehide',function(){clearTimeout(wT);flush();});
start3d();
connect();
</script>
