<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFCF6">
<title>記憶小森林</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">

<!-- 3D 花園和雲端資料要用的檔案，跟頁面同時開始下載（不用等程式跑到那裡才抓） -->
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js">
<style>
body{min-height:100%;background:#F4F8EC;}
.gd{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 74px) 14px calc(env(safe-area-inset-bottom) + 30px);}
/* 另一半在不在、今天澆了多少 */
.here{display:flex;align-items:center;justify-content:center;gap:6px;margin-bottom:10px;font-size:13px;color:var(--t2);}
.here b{font-weight:400;padding:3px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);}
.here b.on{background:#E7F2DF;}
.wx{margin:-4px 0 10px;text-align:center;font-size:12px;color:var(--t2);}
.party{margin:0 auto 8px;max-width:440px;padding:6px 12px;border:var(--lw2) solid var(--ink);border-radius:14px;background:linear-gradient(90deg,#FDEEEA,#FDF2D2,#E7F2DF);font-size:14px;color:var(--t);box-shadow:0 2px 0 var(--ink);}
.days-f{display:flex;flex-direction:column;gap:8px;margin-top:4px;text-align:left;}
.days-f label{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;}
.days-f input,.days-f select{padding:4px 6px;border:var(--lw2) solid var(--ink);border-radius:10px;background:var(--paper);font:inherit;font-size:16px;}
.wx b{font-weight:400;display:inline-block;padding:2px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#FFFFFFAA;}
.here b.syue{background:#EEF6E8;}.here b.ling{background:#FDEEEA;}
/* 今日問題 */
.qcard{position:relative;padding:14px 14px 12px;border:var(--lw2) solid var(--ink);border-radius:20px;background:linear-gradient(#FFFDF7,#FDF2D2);box-shadow:0 3px 0 var(--ink);}
.q-h{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#96714D;}
.q-q{font-size:18px;margin:6px 0 10px;line-height:1.5;}
.q-opts{display:flex;gap:8px;flex-wrap:wrap;}
.q-opts button{flex:1;min-width:84px;height:44px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-size:15px;box-shadow:0 2px 0 var(--ink);}
.q-opts button:active{transform:translateY(2px);box-shadow:none;}
.q-text{display:flex;gap:8px;}
.q-text textarea{flex:1;height:64px;padding:8px 10px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font:inherit;font-size:16px;resize:none;}
.q-text button{width:64px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--yellow);font-size:15px;box-shadow:0 2px 0 var(--ink);}
.q-a{display:flex;gap:8px;align-items:flex-start;margin-top:6px;padding:7px 10px;border-radius:12px;background:#FFFFFFAA;font-size:15px;line-height:1.5;}
.q-a b{flex-shrink:0;font-weight:400;padding:0 8px;border:1.5px solid var(--ink);border-radius:999px;font-size:13px;}
.q-a.syue b{background:#EEF6E8;}.q-a.ling b{background:#FDEEEA;}
.q-a.wait{color:var(--t3);font-size:13px;}
.q-tip{margin-top:8px;font-size:12px;color:var(--t2);}
.q-match{margin-top:8px;padding:5px 10px;border-radius:12px;background:#FCE6E1;font-size:13px;text-align:center;}
.q-more{display:block;margin:8px 0 0 auto;border:0;background:none;font-size:12px;color:#96714D;}
.q-foot{display:flex;justify-content:space-between;}.q-foot .q-more{margin:8px 0 0;}
.q-by{margin-left:8px;padding:1px 8px;border:1.5px solid var(--ink);border-radius:999px;font-style:normal;font-size:11px;color:var(--t);background:#EEF6E8;}.q-by.ling{background:#FDEEEA;}
.q-back{margin-top:10px;padding:8px 10px;border-radius:12px;background:#FFFFFF99;font-size:13px;line-height:1.6;color:var(--t2);}.q-back i{font-style:normal;color:#96714D;}
.ask{display:flex;flex-direction:column;gap:8px;}.ask textarea,.ask input{padding:8px 10px;border:var(--lw2) solid var(--ink);border-radius:12px;font:inherit;font-size:16px;box-sizing:border-box;width:100%;}.ask textarea{height:64px;resize:none;}
.ask-t{display:flex;gap:8px;}.ask-t button{flex:1;padding:6px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-family:inherit;font-size:14px;color:var(--t);}.ask-t button.on{background:#FFE9A8;}
.ask-ab{display:flex;gap:8px;}.ask .g-btn{margin:0;}
.ask-list{margin-top:12px;text-align:left;font-size:13px;}.ask-list b{font-weight:400;color:var(--t2);}.ask-list div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1.5px dashed #E4D9CC;}.ask-list small{flex:none;width:40px;color:var(--t3);}.ask-list span{flex:1;}.ask-list button{flex:none;width:28px;height:28px;border:1.5px solid var(--ink);border-radius:50%;background:var(--paper);font-size:11px;}
.strk{margin-left:2px;padding:3px 10px;white-space:nowrap;border:var(--lw2) solid var(--ink);border-radius:999px;background:#FFE9C2;font-family:inherit;font-size:13px;color:var(--t);cursor:pointer;}.strk.warn{background:var(--paper);border-style:dashed;}
.ach-top{margin:0 0 8px;padding:10px;border:var(--lw2) solid var(--ink);border-radius:14px;background:linear-gradient(90deg,#FFE9C2,#FDEEEA);font-size:15px;}.ach-top small{display:block;margin-top:2px;font-size:12px;color:var(--t2);}
.ach-list{max-height:48vh;overflow:auto;text-align:left;}.ach{display:flex;gap:10px;align-items:center;padding:8px 2px;border-bottom:1.5px dashed #E4D9CC;}.ach.got{opacity:.55;}
.ach>i{flex:none;width:34px;font-style:normal;font-size:24px;text-align:center;}.ach>div{flex:1;min-width:0;font-size:14px;}.ach small{display:block;font-size:11px;color:var(--t2);}
.ach .bar{height:7px;margin-top:4px;border:1.5px solid var(--ink);border-radius:999px;background:#F4F8EC;overflow:hidden;}.ach .bar u{display:block;height:100%;background:linear-gradient(90deg,#F6D27A,#7FB36E);}
.ach button{flex:none;padding:6px 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:#FFE08A;font-family:inherit;font-size:13px;color:var(--t);box-shadow:0 2px 0 var(--ink);}.ach em{flex:none;font-style:normal;font-size:12px;color:var(--t3);}
.gnote button i{font-style:normal;margin-left:4px;padding:0 6px;border:1.5px solid var(--ink);border-radius:999px;background:#F2A497;font-size:11px;}
.gnote{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.g3.shoot .g3-tools,.g3.shoot .g3-full-control,.g3.shoot .g3-drops,.g3.shoot .g3-tip,.g3.shoot .g3-mail{display:none;}
body.shooting .fbar,body.shooting .toasts{display:none;}
.pbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:20px;}.pbar[hidden]{display:none;}
.pbar button{min-width:64px;height:40px;padding:0 12px;white-space:nowrap;border:var(--lw2) solid var(--ink);border-radius:999px;background:rgba(255,252,246,.92);font-family:inherit;font-size:14px;color:var(--t);box-shadow:0 2px 0 var(--ink);}
.pbar .shutter{width:68px;min-width:68px;height:68px;padding:0;border-radius:50%;border-width:4px;background:#FFFFFF;box-shadow:0 0 0 4px rgba(255,255,255,.55),0 3px 0 var(--ink);}.pbar .shutter:active{transform:scale(.92);}
.ptip{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:50;padding:4px 12px;border-radius:999px;background:rgba(62,58,57,.55);color:#fff;font-size:12px;white-space:nowrap;pointer-events:none;}.ptip[hidden]{display:none;}
.flash{position:fixed;inset:0;z-index:70;background:#fff;pointer-events:none;animation:flash .4s ease-out forwards;}@keyframes flash{from{opacity:.9;}to{opacity:0;}}
.shot{display:block;max-width:100%;max-height:46vh;margin:0 auto 4px;border:var(--lw2) solid var(--ink);border-radius:14px;box-shadow:0 3px 0 var(--ink);}
.alb{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-height:56vh;overflow:auto;padding:2px 2px 6px;}.alb button{padding:0;border:var(--lw2) solid var(--ink);border-radius:12px;overflow:hidden;background:var(--paper);font-family:inherit;box-shadow:0 2px 0 var(--ink);}.alb img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;}.alb small{display:block;padding:3px 0;font-size:11px;color:var(--t2);}
/* 花園：三排兩列的土，三隻在旁邊看 */
.garden{position:relative;margin-top:14px;padding:12px 10px 14px;border:var(--lw2) solid var(--ink);border-radius:24px;overflow:hidden;background:linear-gradient(#CFE8F2 0,#E4F2F8 70px,#C9E3B4 71px,#B5D69C 100%);box-shadow:0 3px 0 var(--ink);}
.garden::before{content:'';position:absolute;right:18px;top:12px;width:40px;height:40px;border-radius:50%;background:#F6D27A;border:var(--lw2) solid var(--ink);}
.fence{position:absolute;left:0;right:0;top:50px;height:24px;background:repeating-linear-gradient(90deg,transparent 0 10px,#E2C9A6 10px 22px,transparent 22px 34px);border-bottom:4px solid #C9A884;opacity:.9;}
.g-pets{position:relative;display:flex;justify-content:space-between;align-items:flex-end;height:64px;margin:0 6px 4px;}
.g-pets img{height:58px;width:auto;transition:transform .2s;}
.g-pets img.hop{animation:gHop .5s var(--pop);}
@keyframes gHop{40%{transform:translateY(-16px) rotate(-5deg);}}
.plots{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;}
.plot{position:relative;display:flex;flex-direction:column;align-items:center;padding:4px 2px 6px;border:2px dashed #8C6A5566;border-radius:16px;background:#FFFFFF33;min-height:150px;}
.plot.has{border-style:solid;border-color:#8C6A5544;background:#FFFFFF4D;}
.plot .art{width:100%;height:104px;display:flex;align-items:flex-end;justify-content:center;}
.plot .art svg{height:100%;width:auto;overflow:visible;}
.plot .pn{font-size:12px;margin-top:2px;white-space:nowrap;}
.bar{width:84%;height:8px;margin-top:3px;border:1.5px solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#B9DAA5,#7FB36E);}
.plot .pw{display:flex;gap:3px;margin-top:4px;font-size:10px;}
.plot .pw span{padding:0 5px;border-radius:999px;background:#FFFFFF99;color:var(--t3);}
.plot .pw span.on.syue{background:#D7ECCB;color:var(--t);}.plot .pw span.on.ling{background:#F8D1CB;color:var(--t);}
.plot .empty{margin:auto;font-size:13px;color:#8C6A55;}
.plot .empty i{display:block;font-style:normal;font-size:26px;text-align:center;}
.plot-ready-mark{pointer-events:none;position:absolute;right:6px;top:4px;font-size:18px;animation:sparkle 1s ease-in-out infinite alternate;}
@keyframes sparkle{to{transform:scale(1.3) rotate(20deg);}}
.plot.thirsty .art svg{filter:saturate(.4) brightness(.97);transform:rotate(-5deg);transform-origin:50% 100%;}
.plot.thirsty::before{content:'口渴了';position:absolute;left:6px;top:6px;padding:0 6px;border-radius:999px;background:#E4F2F8;font-size:10px;}
/* 澆水：水滴掉下來 */
.drop{position:absolute;width:10px;height:14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#7FC4E4;border:1.5px solid #3E7FA0;pointer-events:none;animation:drip .7s ease-in forwards;}
@keyframes drip{from{transform:translateY(-30px);opacity:0;}20%{opacity:1;}to{transform:translateY(60px);opacity:0;}}
.can{position:absolute;font-size:30px;pointer-events:none;animation:can .8s ease-in-out forwards;}
@keyframes can{0%{transform:rotate(0) translateY(-6px);opacity:0;}20%{opacity:1;}50%{transform:rotate(-35deg);}100%{transform:rotate(0);opacity:0;}}
/* 森林：長大的樹 */
.forest{margin-top:16px;}
.forest h3{display:flex;justify-content:space-between;align-items:baseline;font-weight:400;font-size:16px;margin:0 4px 8px;}
.forest h3 small{font-size:12px;color:var(--t3);}
.ftrees{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.ftree{display:flex;flex-direction:column;align-items:center;padding:6px 2px;border:var(--lw2) solid var(--ink);border-radius:16px;background:var(--paper);font-size:11px;}
.ftree svg:not(.garden-action-icon){width:100%;height:70px;}
.ftree b{font-weight:400;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.ftree span{color:var(--t3);}
.ftabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 2px 10px;}
.ftabs button{padding:3px 10px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-size:12px;color:var(--t);}
.ftabs button.on{background:#E7F2DF;box-shadow:0 2px 0 var(--ink);}
.ftabs .fx{background:#FDF2D2;}
.ftabs .fsort{margin-left:auto;background:transparent;border-style:dashed;}
.ftabs .ffind{background:#FDEEEA;}
.ftree.none svg{filter:grayscale(1);opacity:.3;}.ftree.none b{color:var(--t3);}
.ftree:disabled{opacity:.75;}
.ftree.bagged{background:#F6F1E7;border-style:dashed;}.ftree.bagged svg{opacity:.6;}
.bagl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-height:52vh;overflow:auto;margin:8px 0 2px;}
.bagi{display:flex;flex-direction:column;align-items:center;padding:6px 4px 8px;border:var(--lw2) dashed var(--ink);border-radius:14px;background:var(--paper);font-size:12px;}
.bagi>svg{width:60px;height:64px;}.bagi b{font-weight:400;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}.bagi span{color:var(--t3);font-size:11px;}
.bagi button{margin-top:5px;padding:3px 10px;border:1.5px solid #9FC48C;border-radius:999px;background:#EEF6E8;font:inherit;font-size:12px;color:#4D6A4D;}
.pcardx{padding-top:14px!important;}
.ps-who{display:flex;gap:6px;justify-content:center;margin-bottom:10px;}.ps-who button{padding:4px 14px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font:inherit;font-size:13px;color:var(--t2);}
.ps-who button.on{background:#FFF3C9;color:var(--t);box-shadow:0 2px 0 var(--ink);}
.ps-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;text-align:left;}
.ps-av{flex:none;display:flex;align-items:center;justify-content:center;width:48px;height:48px;border:var(--lw2) solid var(--ink);border-radius:50%;font-size:24px;}
.ps-av.syue{background:#EEF6E8;}.ps-av.ling{background:#FDEEEA;}
.ps-hm{flex:1;min-width:0;}.pcardx h2{margin:0;text-align:left;font-size:20px;}.pcardx h2 small{margin-left:6px;font-size:12px;color:var(--t3);font-weight:400;}
.ps-doing{display:flex;align-items:center;gap:6px;margin-top:2px;font-size:13px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.ps-doing i{flex:none;width:8px;height:8px;border-radius:50%;background:#7BC67E;box-shadow:0 0 0 3px #DDEFD3;animation:psb 1.6s ease-in-out infinite;}
@keyframes psb{50%{opacity:.4;}}
.ps-qk{display:flex;gap:6px;flex:none;}.ps-qk button{display:flex;flex-direction:column;align-items:center;gap:1px;width:56px;padding:6px 2px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 2px 0 #D8CBB8;font:inherit;font-size:18px;line-height:1;color:var(--t);}
.ps-qk button span{font-size:11px;}.ps-qk button[data-pc="stop"]{background:#FFF0C2;}.ps-qk button:disabled{opacity:.45;}
.ps-seg{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:4px;border-radius:16px;background:#F1E9DB;}
.ps-seg button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:5px 2px;border:0;border-radius:12px;background:none;font:inherit;font-size:12px;line-height:1.2;color:var(--t2);}.ps-seg button i{font-size:17px;}
.ps-seg button i{font-style:normal;}.ps-seg button.on{background:var(--paper);color:var(--t);box-shadow:0 1px 0 #D8CBB8,0 0 0 2px var(--ink) inset;}
.ps-body{min-height:310px;padding-top:10px;text-align:left;}
.ps-sec h5{margin:6px 2px 6px;font-weight:400;font-size:12px;color:var(--t3);}.ps-sec+.ps-sec{margin-top:6px;}
.ps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}.ps-grid.g3c{grid-template-columns:repeat(3,1fr);}
.ps-grid button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:62px;padding:6px 2px;border:2px solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 2px 0 #D8CBB8;font:inherit;color:var(--t);cursor:pointer;}
.ps-grid button i{font-style:normal;font-size:22px;line-height:1;}.ps-grid button span{font-size:12px;line-height:1.2;text-align:center;}
.ps-grid button.on{background:#FFF3C9;box-shadow:0 2px 0 var(--ink);}
.ps-grid button:active,.ps-clo button:active,.ps-qk button:active{transform:translateY(2px);box-shadow:none;}
.ps-note{margin:10px 2px 0;font-size:12px;color:var(--t3);line-height:1.5;}
.ps-tabs{display:flex;gap:5px;margin-bottom:8px;}.ps-tabs button{flex:1;min-width:0;padding:4px 2px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font:inherit;font-size:12px;color:var(--t);white-space:nowrap;}.ps-tabs button.on{background:#E7F2DF;box-shadow:0 2px 0 var(--ink);}
.ps-clo{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;}
.ps-clo button{display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 4px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);box-shadow:0 2px 0 #D8CBB8;font:inherit;font-size:12px;line-height:1.25;color:var(--t);}
.ps-clo button.on{background:#FFF3C9;box-shadow:0 2px 0 var(--ink);}
.ps-clo .sw{display:flex;}.ps-clo .sw i{width:16px;height:16px;margin-left:-4px;border:1.5px solid var(--ink);border-radius:50%;}.ps-clo .sw i:first-child{margin-left:0;}.ps-clo .sw i.dft{background:linear-gradient(135deg,#4A5F86 50%,#F6E7D8 50%);}
.pcardx>.g-btns:last-child{position:static;margin:12px 0 0;padding:0;background:none;}.pcardx>.g-btns:last-child .g-btn{height:42px;}
@media (max-width:360px){.ps-grid{grid-template-columns:repeat(3,1fr);}.ps-qk button{width:48px;}}
.qmenu{position:fixed;z-index:60;display:flex;flex-direction:column;min-width:150px;padding:8px;border:var(--lw2) solid var(--ink);border-radius:16px;background:var(--paper);box-shadow:0 4px 0 var(--ink),0 10px 24px #3E3A3922;animation:qIn .18s ease-out;}
@keyframes qIn{from{opacity:0;transform:translateY(6px) scale(.96);}}
.qmenu b{padding:2px 8px 6px;font-weight:400;font-size:13px;color:var(--t3);}
.qmenu button{display:flex;align-items:center;gap:8px;padding:8px 10px;border:0;border-radius:10px;background:none;font:inherit;font-size:14px;color:var(--t);text-align:left;cursor:pointer;}
.qmenu button:active{background:#F1E7D6;}.qmenu button i{font-style:normal;width:22px;text-align:center;}.qmenu button.sure{background:#FCE6E1;color:#9A4A3E;}
.sh-dig{margin-top:10px;padding:10px 12px 4px;border-radius:14px;background:#FCE6E1;font-size:13px;color:#8A4B40;}.sh-dig p{margin:0 0 4px;}
.sh-bag{margin-top:8px;padding:6px 12px;border-radius:12px;background:#F6F1E7;font-size:13px;color:#7A6A55;}
.sh-nav{display:flex;align-items:center;justify-content:space-between;margin:-6px -6px 2px;}
.sh-nav button{width:40px;height:34px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);font-size:20px;line-height:1;}
.sh-nav span{font-size:12px;color:var(--t3);}

/* 3D 花園（three.js）：拖曳轉、兩指縮放；載不到或手機不支援就用上面的平面花園 */
.g3{position:relative;margin-top:14px;height:min(62vh,560px);border:var(--lw2) solid var(--ink);border-radius:24px;overflow:hidden;background:#BFE3F2;box-shadow:0 3px 0 var(--ink);touch-action:none;}
.g3 canvas{display:block;width:100%;height:100%;}
.g3.full{position:fixed;inset:0;height:auto;margin:0;border:0;border-radius:0;z-index:40;}
/* 3D 花園右上角的工具列：四顆一樣大的方形按鈕，圖示下面一行小字，放在同一塊底板上 */
.g3-tools,.g3-full-control{position:absolute;right:10px;z-index:3;display:flex;flex-direction:column;padding:5px;border:var(--lw2) solid var(--ink);border-radius:18px;background:rgba(255,252,246,.92);box-shadow:0 3px 0 var(--ink);}
.g3-full-control{top:10px;}
.g3-tools{top:80px;}
.g3.full .g3-full-control{top:calc(env(safe-area-inset-top) + 12px);right:calc(env(safe-area-inset-right) + 12px);}
.g3.full .g3-tools{top:calc(env(safe-area-inset-top) + 82px);right:calc(env(safe-area-inset-right) + 12px);}
.g3-tool{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:50px;height:50px;padding:0;border:0;border-radius:13px;background:transparent;font-family:inherit;color:var(--t);cursor:pointer;-webkit-tap-highlight-color:transparent;}
.g3-tool-list{max-height:calc(min(62vh, 560px) - 152px);overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;scrollbar-width:thin;}
.g3.full .g3-tool-list{max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - 165px);}
.g3-tool-list[hidden],.g3-tool-state[hidden]{display:none;}
.g3-tool-state{font-size:9px;line-height:10px;color:#806734;}
#g3names.on{height:60px;}
.g3-tool-list .g3-tool{margin-top:5px;}
.g3-tool-list .g3-tool::before{content:'';position:absolute;left:10px;right:10px;top:-3px;border-top:1.5px dashed #DCCFBF;}
.g3-tool svg{display:block;width:24px;height:24px;flex:none;fill:none;stroke:#665347;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.g3-tool svg[hidden]{display:none;}
.g3-tool svg .accent{fill:#DDEBCF;stroke:#799268;}
.g3-tool svg .warm{fill:#F6DDA4;stroke:#A18455;}
.garden-action-icon{pointer-events:none;flex:none;display:inline-block;width:1.2em;height:1.2em;vertical-align:-.22em;fill:none;stroke:#665347;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
.g3-tool span{margin-top:1px;font-size:10px;line-height:12px;letter-spacing:.5px;color:var(--t2);white-space:nowrap;}
.g3-tool:active{background:#F1E7D6;}
.g3-tool.on{background:#FFE9A8;}.g3-tool.on span{color:var(--t);}
.fbar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 14px);transform:translateX(-50%);z-index:50;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 14px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);box-shadow:0 3px 0 var(--ink);white-space:nowrap;}
.fbar[hidden]{display:none;}.fbar b{font-weight:400;font-size:15px;margin-right:4px;}.fbar img{height:26px;width:auto;vertical-align:-6px;}
.fbar button{min-width:38px;height:36px;padding:0 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-family:inherit;font-size:14px;color:var(--t);}
.who-pick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px;}.who-pick button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:var(--lw2) solid var(--ink);border-radius:14px;background:var(--paper);font-family:inherit;font-size:14px;color:var(--t);}.who-pick button img{height:52px;width:auto;}.who-pick .ppl{font-size:30px;line-height:52px;}
.dec-e{display:block;font-size:30px;line-height:1.25;}
/* 裝飾選單的圖片由實際 3D 模型製作，鎖住的項目也能看清楚外觀。 */
.decor-options{max-height:min(58vh,530px);overflow-y:auto;overscroll-behavior:contain;padding:2px 3px 8px;}
.decor-options button{padding:7px 5px 9px;gap:3px;line-height:1.35;}
.decor-options button[disabled]{opacity:1;color:#8E877D;background:#F7F3EB;border-color:#BEB3A2;}
.decor-options .dec-preview{display:flex;align-items:center;justify-content:center;width:100%;height:82px;border-radius:10px;background:#F0F5E9;}
.decor-options button[disabled] .dec-preview{background:#EFEFE9;}
.decor-options .dec-preview img{display:block;width:80px;height:80px;object-fit:contain;}
.decor-options .dec-name{font-size:13px;}

.dec-big{font-size:56px;text-align:center;line-height:1.2;}
.dec-big img{display:block;width:112px;height:112px;object-fit:contain;margin:0 auto;}
.mailbtn{position:relative;padding:3px 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:13px;}
.mailbtn.hot{background:#FDE3EA;animation:mailWig 1.1s ease-in-out infinite;}
@keyframes mailWig{0%,60%,100%{transform:rotate(0);}70%{transform:rotate(-12deg);}80%{transform:rotate(10deg);}90%{transform:rotate(-6deg);}}
.mail-bar{display:block;width:100%;margin:8px 0 2px;padding:10px 14px;border:var(--lw2) solid var(--ink);border-radius:16px;background:linear-gradient(#FFEFF3,#FBCFDB);box-shadow:0 3px 0 var(--ink);color:#7A3348;font-family:inherit;font-size:15px;text-align:center;cursor:pointer;animation:mailPulse 1.3s ease-in-out infinite alternate;}
.mail-bar[hidden],.g3-mail[hidden]{display:none;}
@keyframes mailPulse{to{transform:scale(1.025);box-shadow:0 3px 0 var(--ink),0 0 0 5px rgba(242,164,151,.35);}}
.g3-mail{position:absolute;left:10px;top:52px;z-index:3;padding:3px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:#FDE3EA;font-size:20px;box-shadow:0 2px 0 var(--ink);animation:mailWig 1.1s ease-in-out infinite;}
.g3-mail i{font-style:normal;font-size:13px;margin-left:4px;color:#7A3348;}

/* 讀取畫面：小芽在澆水、三隻寵物跳一跳；進度條跟著真的載入進度走（動畫只用 transform/opacity，載入卡住的時候也會動） */
.ld{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;background:radial-gradient(circle at 50% 36%,#FFFCF6 0,#F4F8EC 55%,#E2EFD8 100%);transition:opacity .45s ease;}

.ld h1{margin:4px 0 0;font-size:25px;font-weight:400;letter-spacing:3px;color:var(--t);}

.ld-bar{width:min(70vw,270px);height:16px;margin-top:4px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);overflow:hidden;box-shadow:0 2px 0 var(--ink);}
.ld-bar i{display:block;height:100%;background:linear-gradient(90deg,#B9DAA5,#7FB36E);transform-origin:0 50%;transform:scaleX(.04);transition:transform .35s ease;}
.ld-today{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:92px;text-align:center;}
.ld-date{font-size:15px;color:var(--t2);letter-spacing:1px;}
.ld-wx{padding:4px 16px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:17px;color:var(--t);box-shadow:0 2px 0 var(--ink);}

@keyframes ldDrop{0%{transform:translateY(0);opacity:0;}15%{opacity:1;}75%{opacity:1;}100%{transform:translateY(62px);opacity:0;}}

var HOL_NOTE={xmas:'花園下雪了，聖誕樹下有禮物，點聖誕樹拆拆看 🎁',nye:'晚上一起坐在樹屋上倒數、看煙火 🎆',ny:'新的一年也要一起好好種花 🌱',cny:'樹屋掛上紅燈籠、貼好春聯，晚上放鞭炮和煙火 🧨<br>🧧 紅包：今天每個人多 '+SPECIAL+' 滴水',val:'花園飄著愛心和玫瑰花瓣 🌹',qixi:'晚上抬頭看銀河，喜鵲在花園上空搭好鵲橋了 🌌',moon:'今晚月亮特別圓，傍晚學和綾會坐在野餐墊上吃月餅、賞月 🥮',hween:'南瓜燈亮起來了，小心蝙蝠 🦇 寵物都戴上巫師帽'};
function holidayOf(day){
  var m0=String(day).slice(5),y=+String(day).slice(0,4),c;

  if(hd)out.push({k:'hol',h:hd.h,n:hd.n||hd.h,e:hd.e,t:hd.t});

  var dn=together(day);if(dn>0&&dn%100===0)out.push({k:'days',e:'✨',t:'在一起第 '+dn+' 天'});

  var a=parseInt(base.slice(1),16), b=parseInt(tint.slice(1),16);

  look.stem=tone.stem;
  if(source.kind==='flower'){
    var inBloom=FLOWER_PEAK[season].includes(sp);
    look.flowerScale=inBloom?1:season==='winter'?.72:.87;
    var mix=inBloom?0:season==='winter'?.38:.23;
    look.c=plantTint(source.c,tone.tint,mix);
    if(source.c2)look.c2=plantTint(source.c2,tone.tint,mix);
  }else{
    var green=cycle.bare?tone.leaf:plantTint('#75A96D',season==='autumn'?'#AAB879':tone.leaf,.46);
    look.leaf=green;
    look.c=green;
    if(['pine','palm','bamboo','cactus'].includes(source.shape)){
      look.c=plantTint(source.c,green,season==='winter'?.3:.22);
    }
    if(season==='autumn'&&sp==='maple')look.c='#CE6547';
    if(sp==='baldcypress')look.c=season==='autumn'?'#C9703A':season==='summer'?'#5E9466':'#7FAF74';
    if(season==='autumn'&&sp==='ginkgo')look.c='#EFBD45';
    look.dormant=season==='winter'&&cycle.bare&&!blooming;
    if(look.dormant)look.shape='branch';
    else if(source.shape==='branch'&&!blooming)look.shape='round';
    var floweringCrown=source.shape!=='drape'&&!['osmanthus','tung','cactus'].includes(sp);
    if(blooming&&floweringCrown)look.c=source.c;
    if((cycle.bloom&&!blooming)||(cycle.fruit&&!cycle.fruit.includes(season)))look.dot=null;
    if(season==='spring'&&['apple','orange','lemon'].includes(sp)){
      look.florets=true;look.dot=sp==='apple'?'#FFE0E5':'#FFFAEA';
    }
    if((sp==='maple'||sp==='ginkgo')&&season!=='autumn')look.dot=null;
    if(source.shape==='pine')look.plain=source.plain||season!=='winter';
  }
  return plantLooks[key]=look;
}

  forgetmenot:{lang:'不要忘記我・真愛',intro:'紫草科的小花，五片淡藍色的花瓣、中間一點黃色，喜歡涼爽潮濕的地方。',fact:'傳說一位騎士替戀人摘河邊的小藍花時掉進河裡，被沖走前把花丟給她，喊著「不要忘記我」，花名就是這樣來的。'},

  bougain:{lang:'熱情・堅韌',intro:'紫茉莉科的蔓性灌木，原產南美洲，天氣溫暖時幾乎整年都會開花，顏色有桃紅、紫、橘、白。',fact:'九重葛鮮豔的「花瓣」其實是苞片，真正的花是中間那幾朵白色的小花。'},

  azalea:{lang:'節制・愛的喜悅',intro:'杜鵑花科的灌木，春天開滿粉紅、桃紅、白色的花，是台北市的市花。',fact:'台大校園每年三月都有杜鵑花節；杜鵑花也叫「映山紅」，開起來整片山坡都紅了。'},
  fringe:{lang:'思念・純潔',intro:'木犀科的落葉樹，春天開滿細細長長的白色小花，遠看像樹上積了一層雪，所以又叫「四月雪」。',fact:'花瓣細長得像衣服上的流蘇，因此得名；台灣野生的流蘇樹已經很少見了。'},

  zinnia:{lang:'思念遠方的朋友・天長地久',intro:'菊科的一年生草本，從夏天一直開到秋天，顏色有紅、橘、黃、粉。',fact:'一朵花可以開很久、整株的花期將近一百天，所以叫做「百日草」。'},

  narcissus:{lang:'自戀・自尊',intro:'石蒜科的球根植物，冬天到早春開花，白色花瓣中間有一個黃色的小杯子，香味很濃。',fact:'希臘神話裡的美少年愛上自己在水裡的倒影，變成了水仙花；過年擺水仙也象徵吉祥。'},

  holly:{lab:'寓意',lang:'祝福・守護',intro:'冬青科的常綠樹，葉子邊緣有尖刺，冬天結出一串串紅色的小果子。',fact:'西方聖誕節常用冬青的綠葉和紅果做花圈；果子是小鳥的冬天食物，人吃了會不舒服，不能吃喔。'},
  cypress:{lab:'寓意',lang:'長壽・守護',intro:'柏科的常綠大樹，是台灣特有的珍貴樹種，長在中高海拔的山區，可以活上千年。',fact:'阿里山、拉拉山的「神木」很多都是紅檜，有的已經超過兩千歲。檜木有一股好聞的香味，也是很好的木材。'}

function comboR(k){return COMBO.filter(function(c){return c.k===k;})[0];}

function cphPut(o){Object.keys(o).forEach(function(k){if(o[k]===null)delete CPH[k];else CPH[k]=o[k];});
  if(cloud)VS.docPut('comboph',{c:o}).catch(function(e){console.warn(e);});else try{localStorage.setItem('gardenComboPh',JSON.stringify(CPH));}catch(e){}}

        toast('📸 幫「'+comboName(k)+'」拍了一張紀念照，放在組合圖鑑和相簿',function(){openComboPhoto(k);},4500);});}
    if(keys.length>1)comboPhotos(keys.slice(1));});},1500);}

// 森林的「✨ 組合」：特別組合（還沒湊到的只看得到提示）＋湊過的花海、樹林

/* ── 背包：長大的植物不想放在花園裡，可以先收進背包（還是算在森林、圖鑑、成就裡）；拿出來的時候放回原本的位置，
   那裡被佔了就找一塊空地 ── */
function bagIn(id){var p=D.plants[id];if(!p||!p.done||p.bag)return;write({plants:obj(id,{bag:Date.now()})});SND.sfx('pop');toast('🎒 '+label(p)+'收進背包了');paint();}
function bagOut(id,quiet){var p=D.plants[id];if(!p||!p.bag)return false;var o={bag:0},moved=false;
  if(g3){var ok=p.pos&&Garden3D.canPlace(p.pos.x,p.pos.z,id)==='';if(!ok){var fp=Garden3D.freeSpot(p.sp);if(fp){o.pos=fp;moved=!!p.pos;}}}
  write({plants:obj(id,o)});if(!quiet){SND.sfx('plant');toast('🌱 '+label(p)+'種回森林了'+(moved?'（原本的位置被佔了，換到空地；可以用「移植」再搬）':''));}paint();return true;}
// 右邊工具列的「背包」：看收起來的植物、拿出來；「點花園裡的植物收進來」：點一下森林裡的植物就收進背包，再按一次背包結束
var bagPick=false;
function setBagPick(v){bagPick=!!v;var b=$('g3bag');if(b)b.classList.toggle('on',bagPick);if(bagPick)toast('🎒 點森林裡想收起來的植物，就會收進背包；好了再按一次「背包」',null,4500);}

  var L=forest().filter(function(p){return p.bag;});

    '<div class="g-btns">'+(L.length>1?'<button class="g-btn" data-all>🌱 全部拿出來</button>':'')+'<button class="g-btn'+(L.length?' ghost':'')+'" data-pick>🎒 點花園裡的植物收進來</button><button class="g-btn ghost" data-close>關閉</button></div>','bagcard');
  ov.querySelectorAll('[data-out]').forEach(function(b){b.onclick=function(){var id=b.getAttribute('data-out');bagOut(id);if(g3)Garden3D.flashTrees([id]);openBag();};});

function bagAll(){var L=forest().filter(function(p){return p.bag;});L.forEach(function(p){bagOut(p.id,true);});if(L.length){SND.sfx('plant');toast('🌱 背包裡的 '+L.length+' 株都種回森林了');}}
/* ── 澆水提醒：對方種的植物兩天以上沒人澆，打開花園時提醒一下（同一株一天提醒一次），點了直接打開那株 ── */
function thirstTip(){
  if(!op||!cloud||!started)return;var day=today(),seen={};try{seen=JSON.parse(localStorage.getItem('gardenThirst')||'{}')||{};}catch(e){}if(seen.d!==day)seen={d:day,ids:[]};
  var L=garden().filter(function(p){return p&&p.by===op&&!p.done&&grow(p).stage<4&&dnum(day)-dnum(lastDay(p))>=2&&seen.ids.indexOf(p.id)<0&&!pestOf(p);});
  if(!L.length)return;L.sort(function(a,b){return lastDay(a)<lastDay(b)?-1:1;});var p=L[0],n=dnum(day)-dnum(lastDay(p));
  seen.ids=seen.ids.concat(L.map(function(x){return x.id;}));try{localStorage.setItem('gardenThirst',JSON.stringify(seen));}catch(e){}
  toast('💧 '+NAMES[op]+'種的'+label(p)+(n>=3?'口渴了':'兩天沒喝水了')+(L.length>1?'（還有 '+(L.length-1)+' 株）':'')+'，幫'+NAMES[op]+'澆一下？',function(){if(g3){Garden3D.mark('plant',p.id);}openPlant(p.id);},7000);
}
function harvest(id){
  var p=D.plants[id];if(!p||p.done||grow(p).stage<4)return;
  var o={done:Date.now(),doneBy:me};if(g3){var fp=Garden3D.freeSpot(p.sp);if(fp)o.pos=fp;}
  write({plants:obj(id,o)});SND.sfx('fanfare',3);closeSheet();paint();
  claim();setTimeout(function(){openMemory(id);},400);
}
// 長大的樹：兩個人各領 1 包飼料（算在每天的上限裡），領過就記下來
function claim(){
  if(!me)return;
  forest().forEach(function(p){
    if((p.got||{})[me])return;
    var got=G.record('garden',forest().length,1);
    write({plants:obj(p.id,{got:obj(me,1)})});
    toast(got?'🌳 '+label(p)+'長大了！飼料 ×1，回班表就會收到':'🌳 '+label(p)+'長大了！（今天的飼料拿完了）');
  });
}

/* ── 移植：森林的樹搬到新位置（3D）；長大中的植物搬到別塊土（點有植物的土就交換） ── */
function setFull(on){var box=$('g3'),btn=$('g3full');box.classList.toggle('full',on);btn.querySelector('.icon-expand').toggleAttribute('hidden',on);btn.querySelector('.icon-close').toggleAttribute('hidden',!on);btn.querySelector('span').textContent=on?'關閉':'全螢幕';btn.setAttribute('aria-label',on?'關閉全螢幕':'全螢幕');document.body.style.overflow=on?'hidden':'';}
function startMove(kind,id){
  var p=D.plants[id];if(!p)return;
  closeSheet();
  if(kind==='tree'&&!g3){toast('森林的樹要在 3D 花園裡移植');return;}
  if(g3&&!Garden3D.move(kind,id)){toast('找不到這棵，等一下再試');return;}
  endPhoto();stopFollow();moving={kind:kind,id:id,sel:null,full:g3&&!$('g3').classList.contains('full')};
  if(moving.full)setFull(true);
  $('g3tip').style.opacity=0;SND.sfx('tap');paintMove();if(!g3)paintPlots();
}
function endMove(){
  if(!moving)return;var m=moving;moving=null;
  if(g3)Garden3D.moveEnd();
  document.body.classList.remove('placing-decor');
  if(m.full)setFull(false);
  paintMove();if(!g3)paintPlots();
}
function paintMove(){
  var bar=$('mvbar');
  if(!moving){bar.hidden=true;bar.classList.remove('decor-mode');bar.innerHTML='';paintSoilBar();return;}
  bar.classList.toggle('decor-mode',moving.kind==='decor'||moving.kind==='decorNew');
  var s=moving.sel,h,ls=LANDS.filter(function(l){return level()>=l.lv;}),chips=ls.length?'<div class="mv-lands"><button data-land="">🌳 '+esc(areaName('center'))+'</button>'+ls.map(function(l){return '<button data-land="'+l.id+'">🏡 '+esc(areaName(l.id))+'</button>';}).join('')+'</div>':'';
  if(moving.kind==='decor'||moving.kind==='decorNew'){
    if(moving.kind==='decor'&&!D.decor[moving.id]){endMove();return;}
    var dk=DECOR[moving.k];
    h='<div class="mv-head"><img src="../assets/games/garden/decor/'+moving.k+'.png" alt=""><div class="mv-copy"><b>'+(moving.kind==='decor'?'移動':'擺放')+dk.name+'</b>'+(s?(s.ok?'<span>預覽位置，可點草地更換</span>':'<span class="bad">'+esc(s.why)+'，換個地方</span>'):'<span>點草地選位置・拖曳轉動・兩指縮放</span>')+'</div></div>'+chips+
      '<div class="g-btns"><button class="g-btn ghost" data-cancel>取消</button><button class="g-btn" data-ok'+(s&&s.ok?'':' disabled')+'>放在這裡</button></div>';
    bar.innerHTML=h;bar.hidden=false;
    bar.querySelector('[data-cancel]').onclick=function(){SND.sfx('tap');endMove();};
    var okb=bar.querySelector('[data-ok]');if(okb)okb.onclick=placeDecor;
    bar.querySelectorAll('[data-land]').forEach(function(b){b.onclick=function(){SND.sfx('tap');Garden3D.focusLand(b.getAttribute('data-land'));};});
    return;
  }
  if(moving.kind==='soil'||moving.kind==='fill'){
    var dig=moving.kind==='soil',nf=freeSoil().length;
    h='<b>'+(dig?'🪏 翻土':'⛏️ 填土')+'</b>'+(s?(s.ok?'<span>'+(dig?'在這裡翻一塊新的土嗎？也可以再點別的地方':'把這塊空的土填平嗎？')+'</span>':'<span class="bad">'+esc(s.why)+(dig?'，換個地方':'')+'</span>'):'<span>'+(dig?'點草地選位置（還可以翻 '+nf+' 塊）':'點一塊空的土，把它填平')+'</span>')+chips+
      '<div class="g-btns">'+(s&&s.ok?'<button class="g-btn" data-ok>'+(dig?'🪏 在這裡翻土':'⛏️ 填平')+'</button>':'')+'<button class="g-btn ghost" data-cancel>'+(s&&s.ok?'取消':'不用了')+'</button></div>';
    bar.innerHTML=h;bar.hidden=false;
    bar.querySelector('[data-cancel]').onclick=function(){SND.sfx('tap');endMove();};
    var ob=bar.querySelector('[data-ok]');if(ob)ob.onclick=dig?digSoil:fillSoil;
    bar.querySelectorAll('[data-land]').forEach(function(b){b.onclick=function(){SND.sfx('tap');Garden3D.focusLand(b.getAttribute('data-land'));};});
    paintSoilBar();return;
  }
  var p=D.plants[moving.id];if(!p||(moving.kind==='plot'&&p.done)){endMove();return;}
  if(moving.kind==='tree'){
    var sw=s&&s.swap&&D.plants[s.swap];
    h='<b>🌳 移植'+esc(label(p))+'</b>'+(sw?'<span>和'+esc(label(sw))+'交換位置嗎？</span>':s?(s.ok?'<span>種在這裡嗎？也可以再點別的地方</span>':'<span class="bad">'+esc(s.why)+'，換個地方</span>'):'<span>點草地選新位置；點別的植物可以直接交換位置</span>')+
      chips+
      '<div class="g-btns">'+(s&&s.ok?'<button class="g-btn" data-ok>'+(sw?'🔄 交換位置':'種在這裡')+'</button>':'')+'<button class="g-btn ghost" data-cancel>取消</button></div>';
  }else h='<b>🪴 移植'+esc(label(p))+'</b><span>點一塊空的土搬過去；點有植物的土會交換位置</span><div class="g-btns"><button class="g-btn ghost" data-cancel>取消</button></div>';
  bar.innerHTML=h;bar.hidden=false;
  bar.querySelector('[data-cancel]').onclick=function(){SND.sfx('tap');endMove();};
  var ok=bar.querySelector('[data-ok]');if(ok)ok.onclick=moveTreeTo;
  bar.querySelectorAll('[data-land]').forEach(function(b){b.onclick=function(){SND.sfx('tap');Garden3D.focusLand(b.getAttribute('data-land'));};});
}
// 「澆澆水」打開的時候，下面多「翻土」「填土」
function paintSoilBar(){var b=$('g3soil');if(!b)return;var on=$('g3names').getAttribute('aria-pressed')==='true'&&!moving;b.hidden=!on;if(on)$('g3tip').style.opacity=0;
  var n=freeSoil().length;b.querySelector('[data-soil="soil"]').textContent='🪏 翻土'+(n?' '+n:'');}
function startSoil(kind){
  if(!g3)return;if(kind==='soil'&&!freeSoil().length){SND.sfx('bonk');toast('🪏 土都用完了：先「填土」填掉一塊空的土，或升級多幾塊土',null,4500);return;}
  closeSheet();if(!Garden3D.move(kind))return;endPhoto();stopFollow();
  moving={kind:kind,id:null,sel:null,full:!$('g3').classList.contains('full')};if(moving.full)setFull(true);SND.sfx('tap');paintMove();
}
function digSoil(){var s=moving&&moving.sel,i=freeSoil()[0];if(!s||!s.ok)return;if(i==null){toast('🪏 土都用完了');endMove();return;}
  write({soil:obj(i,{x:s.x,z:s.z,off:0})});SND.sfx('plant');toast('🪏 翻好一塊新的土，點它就能種');endMove();paint();}
function fillSoil(){var s=moving&&moving.sel;if(!s||!s.ok)return;if(garden()[s.slot]){toast('上面種了植物，先移植或拔掉');return;}
  write({soil:obj(s.slot,{off:1,x:null,z:null})});SND.sfx('swish');toast('⛏️ 填好了，可以用「翻土」翻到別的地方');endMove();paint();}
function movePlotTo(slot){
  if(!moving||moving.kind!=='plot')return;
  var slots=garden(),id=moving.id,me0=D.plants[id],from=slots.indexOf(me0),other=slots[slot];
  if(from<0){endMove();return;}if(other===me0)return;
  var o={plants:{}},mk={by:me,at:Date.now()};o.plants[id]={slot:slot,mv:mk};if(other)o.plants[other.id]={slot:from,mv:mk};
  write(o);SND.sfx('plant');toast(other?label(me0)+'和'+label(other)+'交換位置了 🪴':'把'+label(me0)+'移植到新的土 🪴');
  endMove();paint();
}
function moveTreeTo(){
  var s=moving&&moving.sel;if(!s||!s.ok)return;
  var id=moving.id,o={plants:{}},pos=Garden3D.forestPos();
  // 第一次移植：先把森林每棵樹現在的位置存起來，之後別棵就不會跟著跑
  Object.keys(pos).forEach(function(k){if(D.plants[k]&&!D.plants[k].pos)o.plants[k]={pos:pos[k]};});
  var mk={by:me,at:Date.now()};o.plants[id]={pos:{x:s.x,z:s.z},mv:mk};
  // 交換：點的那棵搬到這棵原來的位置
  if(s.swap&&D.plants[s.swap]&&pos[id]){o.plants[s.swap]={pos:pos[id],mv:mk};write(o);SND.sfx('plant');toast(label(D.plants[id])+'和'+label(D.plants[s.swap])+'交換位置了 🌳');endMove();paint();return;}
  write(o);toast('把'+label(D.plants[id])+'移植到新的地方了 🌳');
  endMove();paint();
}

function openFollow(){

    '<h4>🖐️ 怎麼操作</h4><ul><li>拖曳轉一圈、兩指拉近拉遠；用「全螢幕」放大，用「視角」回到原本的角度</li><li>點土種樹、點植物澆水；需要時按「澆澆水」顯示植物名稱、成長進度和今天的澆水狀態，再按一次隱藏</li><li>植物和森林的樹都可以「移植」，把花園排成你們喜歡的樣子</li><li>按「澆澆水」以後左下角的「🏷️ 區域名字」，可以幫中間的花園和每塊新土地取名字（會寫在木牌上）</li><li>按「澆澆水」以後，下面有「⛏️ 填土」和「🪏 翻土」：空的土可以填平，再翻到花園裡想要的地方（土的數量還是照等級）</li><li>右側工具列可以收合，按「展開」再打開；工具列裡有視角、澆澆水、裝飾、背包、拍照、跟著看</li><li>樹屋旁停著學的紅色街車和綾的小電動車：點它們可以叫兩個人一起去兜風（下雨、下雪不騎）</li><li>3D 花園右邊的「跟著看」：選學、綾或一隻寵物，鏡頭就一直跟著他（拖曳繞著看、兩指拉近）</li><li>裝飾、植物、森林的樹都可以轉方向：點它，按「🔄 轉方向」，在花園裡邊看邊按 ↺ ↻</li></ul>'+
    '<h4>💧 水滴</h4><ul><li>每個人每天 '+BASE+' 滴水；回答今日問題 +'+ANSWER+' 滴，二選一兩個人選一樣再各多 '+MATCH+' 滴</li><li>同一天兩個人都澆同一棵，那天多長 '+TOGETHER+' 點</li><li>小鳥飛來的時候點牠，送一滴水（每天最多 '+BIRD+' 滴）；有害蟲要先抓走才能澆水</li><li>下雨、下雪那天，所有植物都會自己長一點</li></ul>'+
    '<h4>🌳 森林</h4><ul><li>植物依月份換季。春天賞櫻，秋天看楓紅和金黃銀杏，冬天梅花會在枝頭開放。四季都可以繼續澆水。<a href="../assets/games/garden/plant-seasons.webp" target="_blank" rel="noopener">看植物的四季對照圖</a></li><li>長大的植物種進森林，會留下那段時間的問答和你們寫的話</li><li>種進森林兩個人各拿 1 包飼料（算在每天 '+G.CAP+' 包裡）</li><li>澆水、回答、抓害蟲都會加經驗；升級多幾塊土、開放新土地、解鎖新的花和樹</li><li>🎒 不想放在花園裡的植物可以先收起來（還是算在森林和圖鑑裡）：右邊工具列的「背包」按「點花園裡的植物收進來」再點植物，或在回憶卡片按「收進背包」；背包裡的隨時可以拿出來</li><li>👫 長按學或綾打開狀態欄：上面看他現在在做什麼、停下來、跟著看；下面五頁「做什麼、衣服（春夏秋冬＋特別）、帽子（可以不戴）、髮型、表情」，上面的按鈕可以切換學和綾</li><li>🖐️ 長按植物或森林的樹：跳出小選單，直接澆水、移植、轉方向、拔掉或收進背包</li><li>🌸 植物照春、夏、秋、冬分好了：選種子時上面可以切換季節，標「當季」的這個季節開花結果最漂亮；森林圖鑑也能照季節看</li><li>🧺 學和綾會自己去樹下坐坐、接花瓣、搖果樹撿果子、在落葉上跳、抱抱大樹；森林回憶卡片的「一起來樹下坐坐」可以叫他們過去</li><li>✨ 種在一起：同一種植物 3 株以上種在一起（相鄰的土，或森林裡種在旁邊）會變成花海、樹林；特別的三種種在一起還有隱藏組合，像松、竹、梅是「歲寒三友」；組合湊成後，旁邊再種同一類的會一起加入，越大片效果越熱鬧。森林的「✨ 組合」看得到提示</li></ul>'+
    '<h4>🛝 遊樂區（點它們叫學和綾過去）</h4><ul><li>白天溜滑梯、盪鞦韆；下雨、下雪天溜滑梯換成涼亭，喝咖啡吃甜點</li><li>傍晚長椅看夕陽，晚上營火烤棉花糖；下雨的晚上會搭起天幕</li><li>樹屋旁的鞦韆隨時都能盪，兩個人的話一個坐、一個在後面推</li></ul>'+
    '<h4>🔥 連續紀錄・🏅 成就・📸 拍照</h4><ul><li>兩個人同一天都有澆水或回答問題，連續紀錄就多一天（最上面的 🔥）</li><li>下面的 🏅 成就：達成後每個人各領一次獎勵水滴，有的還會解鎖限定裝飾</li><li>3D 花園右邊的「拍照」：按鈕和名字會收起來，選好角度按快門，可以存到手機或放進兩個人的相簿</li><li>今日問題下面的「✍️ 我來出題」：自己寫題目排進之後的今日問題</li></ul>'+
    '<h4>🎀 裝飾・📮 信箱・🎉 紀念日</h4><ul><li>升級解鎖裝飾（3D 花園工具列的「裝飾」）：盆栽、路燈、柵欄、蘑菇燈、花拱門、花圃、名字木牌、風車、長椅、小花車、稻草人、石板路、愛心氣球、鳥屋、南瓜燈、野餐墊、燈串、噴水池、風鈴、吊床、雙人鞦韆椅、小池塘、蜂箱、帳篷、狗屋、鳥浴盆、石燈籠、日晷、陽傘野餐桌、小鋼琴；學和綾會去坐長椅、躺吊床、坐鞦韆椅和野餐桌</li><li>成就限定裝飾：幸福鐘、許願井、望遠鏡（晚上點它看流星）、熱氣球、雪人、愛心拍照框、天燈、彩虹拱門</li><li>📮 寫信給對方，對方一打開班表或花園就會看到</li><li>紀念日（交往、結婚、生日、在一起每 100 天）花園會布置，每個人多 '+SPECIAL+' 滴水</li><li>節日也會布置：聖誕節（點聖誕樹拆禮物）、跨年、過年、情人節、七夕、中秋、萬聖節</li></ul>'+

// 環境音：白天鳥叫（夏天加蟬）、傍晚鳥少一點、晚上蟋蟀＋營火（鏡頭越靠近營火越大聲）、下雨天雨聲

/* ── 兩支手機一起看（3D 花園）：兩個人同時在花園的時候，先進來的那支當主持，每 2 秒把學、綾、寵物、機車的狀況
   寫進 banbiao/<代碼>_live；另一支照著播（gone.<誰>＝那支手機離開花園的時間）。一個人的時候不寫 ── */
var LV={role:'solo',last:null,lastKey:'',recv:0,since:0,seq:0,next:0,sentAt:0,sig:'',cmdSeen:null,wait:0,gone:{},init:false};
function liveInit(){
  if(LV.init||!cloud||!me)return;LV.init=true;VS.docWatch('live',onLive);setInterval(liveTick,250);
  var bye=function(){if(cloud&&me)VS.docPut('live',{gone:obj(me,Date.now())}).catch(function(){});};
  document.addEventListener('visibilitychange',function(){if(document.hidden){bye();liveRole('solo');}});
  addEventListener('pagehide',bye);
}
function onLive(d){
  d=d||{};LV.gone=d.gone||{};if(LV.cmdSeen===null)LV.cmdSeen=d.cmd&&d.cmd.id||'';
  var key=d.since+':'+d.n;
  if(d.h&&d.h===op&&d.s&&key!==LV.lastKey){LV.lastKey=key;LV.last=d;LV.recv=Date.now();if(LV.role==='follow'&&g3)Garden3D.live.apply(d.s);}
  var c=d.cmd;if(c&&c.id&&c.id!==LV.cmdSeen){LV.cmdSeen=c.id;if(c.by===op&&LV.role==='host'&&g3)Garden3D.live.cmd(c);}
}
function liveOn(){var hb=+D.here[op]||0;return !document.hidden&&Date.now()-hb<45000&&!((+LV.gone[op]||0)>=hb);}
function liveTick(){
  if(!g3||!cloud||!op||!started){liveRole('solo');return;}
  var t=Date.now(),fresh=!!LV.last&&t-LV.recv<6000;
  if(!liveOn()){LV.wait=0;liveRole('solo');return;}
  if(LV.role==='follow'){if(!fresh)liveRole('host');return;}
  if(LV.role==='host'){if(fresh&&(LV.last.since<LV.since||LV.last.since===LV.since&&op<me)){liveRole('follow');return;}if(t>=LV.next||t-LV.sentAt>=900&&Garden3D.live.sig()!==LV.sig)liveSend();return;}
  if(fresh){liveRole('follow');return;}
  // 對方剛來：等一下看是不是已經有人在主持，沒有的話自己主持
  if(!LV.wait)LV.wait=t;if(t-LV.wait>2500){LV.wait=0;liveRole('host');}
}
function liveRole(r){
  if(LV.role===r)return;var was=LV.role;LV.role=r;
  if(g3)Garden3D.live.follow(r==='follow');
  if(r==='host'){LV.since=Date.now();LV.next=0;}
  if(r==='follow'&&LV.last&&g3)Garden3D.live.apply(LV.last.s);
  var b=$('g3live');if(b){b.hidden=r==='solo';b.textContent='👫 和'+(NAMES[op]||'對方')+'一起看';}
  if(r!=='solo'&&was==='solo')toast('👫 '+NAMES[op]+'也在花園裡，兩支手機看到的畫面會一樣');
}
function liveSend(){LV.sentAt=Date.now();LV.next=LV.sentAt+2500;LV.sig=Garden3D.live.sig();VS.docPut('live',{h:me,since:LV.since,n:++LV.seq,at:Date.now(),s:Garden3D.live.snap()}).catch(function(e){console.warn('live',e);});}
function liveCmdSend(c){if(LV.role!=='follow')return;c.id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);c.by=me;LV.cmdSeen=c.id;VS.docPut('live',{cmd:c}).catch(function(){});}
function ambient(){
  var t=new Date(),h=t.getHours()+t.getMinutes()/60,d=today(),w=weatherOf(d),se=seasonOf(d),ph=h>=5.5&&h<16.5?'day':h>=16.5&&h<19?'eve':'night',wt=w==='rain'||w==='snow',near=g3&&Garden3D.fireNear?Garden3D.fireNear():.5;
  SND.amb({birds:wt?0:ph==='day'?(se==='winter'?.45:1):ph==='eve'?.3:0,cicada:se==='summer'&&ph==='day'&&!wt?.8:0,crickets:ph==='night'&&se!=='winter'&&w!=='rain'?(se==='summer'||se==='autumn'?1:.6):0,fire:ph==='night'?.3+.7*near:0,rain:w==='rain'?1:0});
}
var gardenEnteredAt=0;
function ready(){
  gardenEnteredAt=Date.now();
  ldStep('data');loadYearly();albumLoad();cphLoad();setInterval(streakWarn,60000);setTimeout(partyCard,1200);setTimeout(mailEntry,300);setTimeout(newSpCard,2600);setTimeout(verCheck,6000);setTimeout(thirstTip,4200);setInterval(ambient,2500);ambient();

  started=true;
  $('gpets').innerHTML=['cat','pg','dg'].map(function(k){return '<img src="'+G.petImg(k,'happy')+'" alt="'+esc(G.petName(k))+'">';}).join('');
  paint();claim();SND.music('garden');pestSeen=pestsNow().map(function(x){return x.key;});setTimeout(visit2d,12000);
  try{if(!localStorage.getItem('gardenHelp'))help();}catch(e){}
}
// 跨過半夜：題目和水滴換新的一天
var lastDayShown=today(),pestSeen=null;
setInterval(function(){
  if(today()!==lastDayShown){lastDayShown=today();paint();return;}
  if(!started)return;paintHere();
  var now=pestsNow().map(function(x){return x.key;}),fresh=pestSeen?now.filter(function(k){return pestSeen.indexOf(k)<0;}):[];
  pestSeen=now;
  if(fresh.length){var pe=pestsNow().filter(function(x){return x.key===fresh[0];})[0],pl=D.plants[pe.id];toast(PESTS[pe.kind].e+' 有'+PESTS[pe.kind].name+'跑到'+label(pl)+'上了！快抓走');SND.sfx('bonk');paint();}
},15000);
document.addEventListener('focusout',function(e){var t=e.target;if(!t||(t.tagName!=='INPUT'&&t.tagName!=='TEXTAREA'))return;setTimeout(function(){if(started&&!typing()){paint();}},450);});
// 離開或切到背景：還沒存的水滴馬上存
document.addEventListener('visibilitychange',function(){if(document.hidden){clearTimeout(wT);flush();}else if(started){beat();paint();}});
addEventListener('pagehide',function(){clearTimeout(wT);flush();});
start3d();
connect();
</script>
