<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我們的班表">
<meta name="theme-color" content="#F5F3EE">
<title>我們的班表</title>
<style>
:root{--bg:#F5F3EE;--card:#FFF;--bd:rgba(0,0,0,0.09);--bd2:rgba(0,0,0,0.15);--t:#1C1B18;--t2:#6B6860;--t3:#A8A59E;--green:#639922;--blue:#378ADD;--pink:#C45B8A;--common:#E3654F;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);font-family:-apple-system,'PingFang TC',sans-serif;padding-bottom:24px;color:var(--t);}
.hdr{background:var(--card);border-bottom:0.5px solid var(--bd);padding:50px 14px 10px;position:sticky;top:0;z-index:10;}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.hdr-left{display:flex;align-items:center;gap:7px;min-width:84px;}
.aname{font-size:13px;font-weight:700;color:var(--t);}
.subname{font-size:11px;color:var(--t3);margin-top:2px;}
.mnav{display:flex;align-items:center;gap:2px;}
.nb{width:38px;height:38px;background:var(--bg);border:none;border-radius:10px;font-size:20px;color:var(--t2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.nb:active,.ib:active{background:#E5E3DE;}
.ml{min-width:112px;text-align:center;font-size:17px;font-weight:700;color:var(--t);}
.ib{width:34px;height:34px;background:var(--bg);border:0.5px solid var(--bd2);border-radius:9px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;}
.hdr-actions{display:flex;gap:6px;justify-content:flex-end;min-width:84px;}
.profilebar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;}
.profile{border:1px solid var(--bd2);background:var(--bg);border-radius:12px;padding:8px 10px;text-align:center;color:var(--t2);font-size:13px;font-weight:700;cursor:pointer;}
.profile.on{background:#1C1B18;color:#fff;border-color:#1C1B18;}
.sdot{width:8px;height:8px;border-radius:50%;background:#D0CEC8;transition:background .4s,box-shadow .4s;flex-shrink:0;}
.sdot.ok{background:var(--green);box-shadow:0 0 0 2px rgba(99,153,34,.2);}
.sdot.err{background:#D85A30;}
.sdot.spin{background:#BA7517;animation:blink 1.1s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.3;}}

/* ── Next common rest card ── */
.nxt-card{margin:10px 10px 0;padding:12px 16px;background:linear-gradient(135deg,#FFF5F5,#FFF0EB);border:1px solid rgba(227,101,79,.22);border-radius:14px;display:flex;align-items:center;gap:12px;}
.nxt-card.none{background:var(--bg);border-color:var(--bd2);}
.nxt-icon{font-size:26px;flex-shrink:0;}
.nxt-body{flex:1;min-width:0;}
.nxt-label{font-size:11px;color:var(--t3);margin-bottom:2px;}
.nxt-date{font-size:16px;font-weight:800;color:var(--common);}
.nxt-card.none .nxt-date{color:var(--t3);}
.nxt-countdown{font-size:12px;color:var(--t2);margin-top:1px;}
.nxt-actions{flex-shrink:0;display:flex;gap:6px;}
.ical-btn{padding:7px 10px;background:var(--card);border:1px solid var(--bd2);border-radius:9px;font-size:12px;font-weight:600;color:var(--t2);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:4px;}
.ical-btn:active{background:#E5E3DE;}

/* ── Expandable legend ── */
.lgd-wrap{background:var(--card);border-bottom:0.5px solid var(--bd);padding:6px 14px 8px;}
.lgd-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.lgd-row:last-child{margin-bottom:0;}
.lgd-toggle{display:flex;align-items:center;gap:6px;padding:7px 12px;border-radius:22px;border:1.5px solid var(--bd2);background:var(--bg);cursor:pointer;font-size:13px;font-weight:700;color:var(--t2);flex-shrink:0;transition:background .2s,border-color .2s;}
.lgd-toggle:active{opacity:.8;}
.lgd-toggle.syue{border-color:rgba(55,138,221,.4);color:#185FA5;}
.lgd-toggle.syue.open{background:rgba(55,138,221,.08);}
.lgd-toggle.ling{border-color:rgba(196,91,138,.4);color:#7A2449;}
.lgd-toggle.ling.open{background:rgba(196,91,138,.08);}
.lgd-chevron{display:inline-block;font-size:10px;transition:transform .35s cubic-bezier(.34,1.56,.64,1);margin-left:2px;}
.lgd-toggle.open .lgd-chevron{transform:rotate(180deg);}
.chip-common{flex-shrink:0;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;background:#FDEBE7;border:1px solid var(--common);color:#8A2A1D;white-space:nowrap;}
.cdot{width:7px;height:7px;border-radius:50%;}

.expand-panel{overflow:hidden;max-height:0;opacity:0;transition:max-height .4s cubic-bezier(.34,1.56,.64,1),opacity .3s ease,padding .3s ease;padding:0 0;}
.expand-panel.open{max-height:200px;opacity:1;padding:6px 0 2px;}
.expand-chips{display:flex;gap:6px;flex-wrap:wrap;}
.chip{flex-shrink:0;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:20px;border:1px solid var(--bd2);background:var(--bg);color:var(--t2);white-space:nowrap;
  animation:chipIn .35s cubic-bezier(.34,1.56,.64,1) both;}
@keyframes chipIn{from{opacity:0;transform:scale(.7) translateY(-6px);}to{opacity:1;transform:scale(1) translateY(0);}}

.cw{padding:12px 10px 0;}
.wds{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px;}
.wl{text-align:center;font-size:11px;font-weight:600;color:var(--t3);padding:2px 0;}
.wl.s{color:#D85A30;}.wl.sa{color:#185FA5;}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
.dc{border-radius:8px;min-height:68px;border:0.5px solid var(--bd);background:var(--card);text-align:center;cursor:pointer;padding:7px 2px 6px;position:relative;overflow:hidden;}
.dc:active{opacity:0.65;}
.dc.em{border-color:transparent!important;background:transparent!important;pointer-events:none;}
.dc.td{box-shadow:0 0 0 2.5px var(--green);}
.dc.common{background:#FDEBE7!important;border:1.5px solid var(--common)!important;}
.dn{font-size:13px;font-weight:700;color:var(--t);margin-bottom:5px;line-height:1;}
.badge-stack{display:flex;flex-direction:column;gap:2px;align-items:center;}
.bg2{font-size:10px;font-weight:700;border-radius:3px;padding:2px 3px;display:inline-block;line-height:1.25;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini{font-size:9px;padding:2px 3px;max-width:96%;}
.sm{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:10px 10px 0;}
.sc{background:var(--card);border-radius:14px;padding:14px 6px;text-align:center;border:0.5px solid var(--bd);cursor:pointer;transition:transform .15s;-webkit-user-select:none;}
.sc:active{transform:scale(0.92);}
.sc-dot{width:8px;height:8px;border-radius:50%;margin:0 auto 6px;}
.sn{font-size:22px;font-weight:800;line-height:1;}
.sl2{font-size:10px;color:var(--t3);margin-top:5px;}

/* iOS-style detail card */
.popup-ov{position:fixed;inset:0;background:rgba(0,0,0,0);z-index:60;display:none;align-items:flex-end;justify-content:center;padding:0 10px 12px;transition:background .28s ease;-webkit-backdrop-filter:blur(0px);backdrop-filter:blur(0px);}
.popup-ov.on{background:rgba(0,0,0,.34);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);}
.popup-card{background:rgba(255,255,255,.94);border:0.5px solid rgba(255,255,255,.55);box-shadow:0 18px 50px rgba(0,0,0,.24);border-radius:28px;width:100%;max-width:520px;max-height:82vh;display:flex;flex-direction:column;overflow:hidden;
  transform:translateY(110%);opacity:.98;
  transition:transform .42s cubic-bezier(.22,1,.36,1),opacity .25s ease;}
.popup-ov.on .popup-card{transform:translateY(0);opacity:1;}
.popup-grabber{width:42px;height:5px;border-radius:999px;background:rgba(60,60,67,.24);margin:9px auto 2px;flex-shrink:0;}
.popup-top{display:flex;align-items:center;gap:10px;padding:12px 18px 6px;}
.popup-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0;}
.popup-title{flex:1;font-size:18px;font-weight:800;color:var(--t);}
.popup-count{font-size:24px;font-weight:900;margin-right:2px;}
.popup-close{width:30px;height:30px;background:rgba(120,120,128,.14);border:none;border-radius:50%;font-size:14px;color:var(--t3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.popup-close:active{background:#E5E3DE;}
.popup-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:6px 14px 10px;}
.popup-action{height:46px;border:none;border-radius:15px;background:rgba(120,120,128,.14);color:var(--t);font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;}
.popup-action.primary{background:#007AFF;color:#fff;}
.popup-action:active{transform:scale(.97);opacity:.82;}
.popup-preview{margin:0 14px 10px;padding:10px 12px;border-radius:16px;background:rgba(120,120,128,.10);font-size:12px;line-height:1.65;color:var(--t2);white-space:pre-wrap;max-height:116px;overflow:auto;}
.popup-body{padding:0 14px 16px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.popup-list{display:flex;flex-direction:column;}
.popup-item{display:flex;align-items:center;gap:10px;padding:11px 12px;margin-bottom:6px;border-radius:16px;background:rgba(255,255,255,.72);border:0.5px solid rgba(0,0,0,.05);
  animation:popItem .35s cubic-bezier(.34,1.56,.64,1) both;}
.popup-item:last-child{margin-bottom:0;}
@keyframes popItem{from{opacity:0;transform:translateY(8px) scale(.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.popup-item-date{font-size:14px;font-weight:800;color:var(--t);min-width:58px;}
.popup-item-dow{font-size:12px;color:var(--t3);margin-left:-4px;}
.popup-item-badge{font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;}
.popup-empty{text-align:center;padding:24px 0;color:var(--t3);font-size:14px;}
.popup-empty-icon{font-size:32px;margin-bottom:8px;}
.ht{text-align:center;font-size:11px;color:var(--t3);padding:8px 16px 4px;line-height:1.7;}
.toast{position:fixed;bottom:98px;left:50%;transform:translateX(-50%) translateY(10px);background:rgba(28,27,24,.92);color:#fff;font-size:13px;padding:9px 18px;border-radius:20px;pointer-events:none;opacity:0;transition:opacity .2s,transform .2s;white-space:nowrap;z-index:200;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:none;align-items:flex-end;}
.ov.on{display:flex;}
.sh{background:var(--card);width:100%;border-radius:20px 20px 0 0;padding:0 0 32px;max-height:90vh;display:flex;flex-direction:column;}
.hdl{width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:10px auto 0;flex-shrink:0;}
.shd{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0;flex-shrink:0;}
.sht{font-size:16px;font-weight:700;color:var(--t);}
.shc{width:30px;height:30px;border:none;background:var(--bg);border-radius:50%;font-size:16px;color:var(--t2);cursor:pointer;}
.shb{padding:14px 18px 0;overflow-y:auto;}
.sr{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:0.5px solid var(--bd);}
.sr:last-child{border-bottom:none;}
.sw{width:28px;height:28px;border-radius:8px;flex-shrink:0;border:2px solid rgba(0,0,0,.12);position:relative;overflow:hidden;}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;}
.ni{flex:1;padding:8px 10px;font-size:14px;border:1px solid var(--bd2);border-radius:8px;background:var(--bg);color:var(--t);font-family:inherit;outline:none;}
.ei{width:42px;padding:8px 6px;font-size:16px;border:1px solid var(--bd2);border-radius:8px;background:var(--bg);text-align:center;font-family:inherit;outline:none;}
.ssb,.login-btn{width:100%;margin-top:14px;padding:13px;background:var(--green);color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;}
.sync-div{border-top:0.5px solid var(--bd);margin-top:18px;padding-top:16px;}
.sync-title{font-size:13px;font-weight:700;color:var(--t);margin-bottom:4px;}
.sync-sub{font-size:12px;color:var(--t3);margin-bottom:12px;line-height:1.6;}
.code-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--bd2);border-radius:10px;padding:10px 12px;margin-bottom:10px;}
.code-txt{flex:1;font-size:17px;font-weight:800;letter-spacing:2px;color:var(--t);font-family:'Menlo','SF Mono',monospace;}
.code-btn{padding:6px 10px;background:var(--card);border:0.5px solid var(--bd2);border-radius:8px;font-size:12px;color:var(--t2);cursor:pointer;white-space:nowrap;}
.sync-input-row{display:flex;gap:8px;margin-bottom:8px;}
.sync-inp,.fr-inp{flex:1;padding:10px 12px;font-size:14px;border:1px solid var(--bd2);border-radius:10px;background:var(--bg);color:var(--t);font-family:'Menlo','SF Mono',monospace;letter-spacing:1px;outline:none;text-transform:uppercase;}
.sync-join-btn{padding:10px 14px;background:var(--green);color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;}
.sync-warn{font-size:11px;color:#D85A30;margin-top:6px;line-height:1.5;}
.login-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.person-card{border:1.5px solid var(--bd2);background:var(--bg);border-radius:14px;padding:16px 10px;text-align:center;font-size:20px;font-weight:800;color:var(--t);cursor:pointer;}
.person-card.on{border-color:#1C1B18;background:#1C1B18;color:#fff;}
.login-copy{font-size:12px;line-height:1.7;color:var(--t3);margin:8px 0 12px;}
.frov{position:fixed;inset:0;background:rgba(245,243,238,.98);z-index:100;display:flex;align-items:center;justify-content:center;padding:28px;}
.frbox{max-width:350px;width:100%;text-align:center;}
.fr-icon{font-size:52px;margin-bottom:16px;}
.fr-t{font-size:20px;font-weight:800;color:var(--t);margin-bottom:8px;}
.fr-s{font-size:13px;color:var(--t2);line-height:1.8;margin-bottom:22px;}
.fr-btn{width:100%;padding:14px;background:var(--green);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:10px;}
.fr-btn2{width:100%;padding:13px;background:var(--card);color:var(--t2);border:0.5px solid var(--bd2);border-radius:14px;font-size:14px;cursor:pointer;}
</style>
</head>
<body>

<div class="hdr">
  <div class="top">
    <div class="hdr-left">
      <div>
        <div class="aname" id="appTitle">我們的班表</div>
        <div class="subname" id="loginName">未登入</div>
      </div>
      <div class="sdot" id="syncDot" title="同步狀態"></div>
    </div>
    <div class="mnav">
      <button class="nb" id="bp">‹</button>
      <div class="ml" id="ml">—</div>
      <button class="nb" id="bn">›</button>
    </div>
    <div class="hdr-actions">
      <div class="ib" id="bt">今</div>
      <div class="ib" id="bs">⚙️</div>
    </div>
  </div>
  <div class="profilebar">
    <button class="profile" id="pSyue">學</button>
    <button class="profile" id="pLing">綾</button>
  </div>
</div>

<!-- Next common rest day -->
<div class="nxt-card" id="nxtCard">
  <div class="nxt-icon" id="nxtIcon">💕</div>
  <div class="nxt-body">
    <div class="nxt-label">下次共同休假</div>
    <div class="nxt-date" id="nxtDate">—</div>
    <div class="nxt-countdown" id="nxtCountdown"></div>
  </div>
  <div class="nxt-actions">
    <button class="ical-btn" id="icalBtn" title="匯出到行事曆">📅 匯出</button>
  </div>
</div>

<!-- Expandable legend -->
<div class="lgd-wrap">
  <div class="lgd-row">
    <div class="chip-common"><div class="cdot" style="background:var(--common)"></div>共同休假</div>
    <div class="lgd-toggle syue" id="togSyue" onclick="togglePanel('syue')">學的班別 <span class="lgd-chevron">▼</span></div>
    <div class="lgd-toggle ling" id="togLing" onclick="togglePanel('ling')">綾的班別 <span class="lgd-chevron">▼</span></div>
  </div>
  <div class="expand-panel" id="panelSyue"><div class="expand-chips" id="chipsSyue"></div></div>
  <div class="expand-panel" id="panelLing"><div class="expand-chips" id="chipsLing"></div></div>
</div>

<div class="cw">
  <div class="wds">
    <div class="wl s">日</div><div class="wl">一</div><div class="wl">二</div>
    <div class="wl">三</div><div class="wl">四</div><div class="wl">五</div><div class="wl sa">六</div>
  </div>
  <div class="cg" id="cg"></div>
</div>
<div class="sm" id="sm"></div>
<div class="ht">目前編輯：<span id="hintUser">—</span>・點日期切換自己的班別・兩人同休會自動合併</div>

<div class="ov" id="ovS"><div class="sh"><div class="hdl"></div><div class="shd"><div class="sht">⚙️ 設定</div><button class="shc" id="csS">✕</button></div><div class="shb" id="sbS"></div></div></div>
<div class="popup-ov" id="popupOv"><div class="popup-card" id="popupCard"></div></div>
<div class="toast" id="toast"></div>
<div class="frov" id="frOv"><div class="frbox" id="frBox"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot, getDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCOrBO2bs1VmSCUd14bqNJJ2GBeieR2ELo",
  authDomain:        "syue-work-schedule.firebaseapp.com",
  projectId:         "syue-work-schedule",
  storageBucket:     "syue-work-schedule.firebasestorage.app",
  messagingSenderId: "785105764126",
  appId:             "1:785105764126:web:6ca5aa11e53a85f4bf930f"
};

const IS_CONFIGURED = !Object.values(FIREBASE_CONFIG).some(v => typeof v==='string' && v.startsWith('YOUR_'));
let db, unsub;
if (IS_CONFIGURED) {
  const app = initializeApp(FIREBASE_CONFIG);
  db = getFirestore(app);
}

var DOW = ['日','一','二','三','四','五','六'];
var USERS = {
  syue:{id:'syue',label:'學',title:'學的班表',color:'#378ADD',store:'xd7_syue',pin:'pin_syue'},
  ling:{id:'ling',label:'綾',title:'綾的班表',color:'#C45B8A',store:'xd7_ling',pin:'pin_ling'}
};
var DEF_SHIFTS = {
  syue:[
    {name:'學休',emoji:'🟢',bg:'#EAF3DE',border:'#639922',txt:'#2D5A11',bdg:'#C0DD97',off:true},
    {name:'休＋加班',emoji:'🟡',bg:'#FEF3E2',border:'#BA7517',txt:'#7A4700',bdg:'#FAC775',off:false},
    {name:'學巡檢',emoji:'🟣',bg:'#EEEDFE',border:'#7F77DD',txt:'#3C3489',bdg:'#AFA9EC',off:false},
    {name:'學晚班',emoji:'🔵',bg:'#E6F1FB',border:'#378ADD',txt:'#0C447C',bdg:'#B5D4F4',off:false}
  ],
  ling:[
    {name:'綾休',emoji:'🌸',bg:'#FCEBF3',border:'#C45B8A',txt:'#7A2449',bdg:'#F2B8D0',off:true},
    {name:'綾早班',emoji:'☀️',bg:'#FFF4D8',border:'#D59A18',txt:'#745000',bdg:'#F4D27B',off:false},
    {name:'綾晚班',emoji:'🌙',bg:'#E8EEF9',border:'#5577B9',txt:'#263F78',bdg:'#B8C7EA',off:false},
    {name:'綾特班',emoji:'⭐',bg:'#EAF4EA',border:'#57955C',txt:'#24572A',bdg:'#B8DDBA',off:false}
  ]
};

var now = new Date(), curY = now.getFullYear(), curM = now.getMonth()+1;
var scheduleData = {syue:{},ling:{}};
var shiftSets = JSON.parse(JSON.stringify(DEF_SHIFTS));
var currentUser = '';
var syncCode = '';
var profilePins = {};
var writeTimer = null;
var isRemoteUpdate = false;
var selectedLoginUser = 'syue';
var expandState = {syue:false, ling:false};

function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function mk(y,m){return y+'_'+(m<10?'0':'')+m;}
function userData(uid){uid=uid||currentUser;return scheduleData[uid]||(scheduleData[uid]={});}
function gd(uid){return userData(uid)[mk(curY,curM)]||{};}
function gdAt(uid,y,m){return userData(uid)[mk(y,m)]||{};}
function sd(d,uid){userData(uid)[mk(curY,curM)]=d;}
function shifts(uid){return shiftSets[uid||currentUser]||[];}
function otherUser(uid){return uid==='syue'?'ling':'syue';}
function defaultShiftIndex(uid,y,m,d){
  return uid==='ling'&&new Date(y,m-1,d).getDay()===0?1:0;
}
function shiftIndex(uid,d){return (gd(uid)[d]||defaultShiftIndex(uid,curY,curM,d));}
function shiftIndexAt(uid,y,m,d){return (gdAt(uid,y,m)[d]||defaultShiftIndex(uid,y,m,d));}
function isOff(uid,idx){var s=shifts(uid)[idx-1];return !!(s&&s.off);}
function isOffAt(uid,idx){var s=shiftSets[uid][idx-1];return !!(s&&s.off);}

var tT;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.className='toast on';clearTimeout(tT);tT=setTimeout(()=>{t.className='toast';},2400);}
function setDot(state){var d=document.getElementById('syncDot');d.className='sdot'+(state?' '+state:'');}
function genCode(){var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';var c='';for(var i=0;i<8;i++)c+=chars[Math.floor(Math.random()*chars.length)];return c;}
function safeHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function normalizeCode(code){return (code||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,20);}

function scheduleWrite(){if(!IS_CONFIGURED||!syncCode)return;clearTimeout(writeTimer);writeTimer=setTimeout(doWrite,600);}
async function doWrite(){
  if(!db||!syncCode)return;setDot('spin');
  try{
    await setDoc(doc(db,'banbiao',syncCode),{version:2,scheduleData:JSON.stringify(scheduleData),shiftSets:JSON.stringify(shiftSets),profilePins:profilePins,updatedAt:serverTimestamp()},{merge:true});
    setDot('ok');
  }catch(e){console.error('write error',e);setDot('err');}
}
function readRemoteDocData(raw){
  if(!raw)return;
  if(raw.scheduleData){try{var r=JSON.parse(raw.scheduleData);scheduleData={syue:r.syue||{},ling:r.ling||{}};}catch(e){}}
  else if(raw.allData){try{scheduleData.syue=JSON.parse(raw.allData||'{}');}catch(e){}}
  if(raw.shiftSets){try{var ss=JSON.parse(raw.shiftSets);shiftSets.syue=ss.syue||shiftSets.syue;shiftSets.ling=ss.ling||shiftSets.ling;}catch(e){}}
  else if(raw.shifts){try{var old=JSON.parse(raw.shifts||'null');if(old&&old.length)shiftSets.syue=old.map(s=>Object.assign({off:(s.name||'').includes('休')&&!(s.name||'').includes('加班')},s));}catch(e){}}
  profilePins=raw.profilePins||profilePins||{};
}
function startListener(code){
  if(unsub){unsub();unsub=null;}if(!db||!code)return;setDot('spin');
  unsub=onSnapshot(doc(db,'banbiao',code),snap=>{
    if(snap.exists()){isRemoteUpdate=true;readRemoteDocData(snap.data());saveLocalOnly();render();isRemoteUpdate=false;}
    setDot('ok');
  },err=>{console.error('listener error',err);setDot('err');});
}
function saveLocalOnly(){lsSet('scheduleDataV2',JSON.stringify(scheduleData));lsSet('shiftSetsV2',JSON.stringify(shiftSets));lsSet('profilePinsV2',JSON.stringify(profilePins));}
function saveAll(){saveLocalOnly();if(!isRemoteUpdate)scheduleWrite();}
function applySyncCode(code){code=normalizeCode(code);syncCode=code;lsSet('syncCode',code);startListener(code);}

  var msg='📅 '+curY+'年'+curM+'月 '+title+'\n────────────────\n';
  if(!arr.length)return msg+'（本月尚未設定）\n────────────────';
  for(var i=0;i<arr.length;i++){
    var it=arr[i], day=curM+'/'+it.d+'（'+it.dow+'）';
    msg+='  '+day+' '+(key==='common'?'共同休假':it.sh.name)+'\n';

/* ── Next common rest day ── */
function findNextCommonRest(){
  var today=new Date();today.setHours(0,0,0,0);
  for(var offset=0;offset<180;offset++){
    var check=new Date(today);check.setDate(check.getDate()+offset);
    var y=check.getFullYear(),m=check.getMonth()+1,d=check.getDate();
    var si=shiftIndexAt('syue',y,m,d), li=shiftIndexAt('ling',y,m,d);
    if(isOffAt('syue',si)&&isOffAt('ling',li)){
      return {date:check,y:y,m:m,d:d,daysAway:offset};
    }
  }
  return null;
}

function renderNextCard(){
  var nxt=findNextCommonRest();
  var card=document.getElementById('nxtCard');
  var icon=document.getElementById('nxtIcon');
  var dateEl=document.getElementById('nxtDate');
  var countEl=document.getElementById('nxtCountdown');
  if(!nxt){
    card.className='nxt-card none';icon.textContent='📅';
    dateEl.textContent='尚未發現共同休假';countEl.textContent='填好兩人班表即可顯示';
    return;
  }
  card.className='nxt-card';icon.textContent=nxt.daysAway===0?'🎉':'💕';
  var dow=DOW[nxt.date.getDay()];
  dateEl.textContent=nxt.m+'/'+nxt.d+'（'+dow+'）';
  if(nxt.daysAway===0)countEl.textContent='就是今天！好好享受 ❤️';
  else if(nxt.daysAway===1)countEl.textContent='就是明天！';
  else countEl.textContent='還有 '+nxt.daysAway+' 天';
}

/* ── iCal export ── */
function pad2(n){return n<10?'0'+n:''+n;}
function icsDateStr(y,m,d){return y+pad2(m)+pad2(d);}
function exportICal(){
  var fd=new Date(curY,curM-1,1).getDay(), dim=new Date(curY,curM,0).getDate();
  var events=[];
  for(var d=1;d<=dim;d++){
    var si=shiftIndex('syue',d), li=shiftIndex('ling',d);
    if(isOff('syue',si)&&isOff('ling',li)){
      var start=icsDateStr(curY,curM,d);
      var endD=new Date(curY,curM-1,d+1);
      var end=icsDateStr(endD.getFullYear(),endD.getMonth()+1,endD.getDate());
      events.push('BEGIN:VEVENT\r\nDTSTART;VALUE=DATE:'+start+'\r\nDTEND;VALUE=DATE:'+end+'\r\nSUMMARY:共同休假 ❤️\r\nDESCRIPTION:學和綾的共同休假日\r\nEND:VEVENT');
    }
  }
  if(!events.length){toast('本月沒有共同休假日');return;}
  var ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//OurSchedule//TW//\r\nCALSCALE:GREGORIAN\r\n'+events.join('\r\n')+'\r\nEND:VCALENDAR';
  var blob=new Blob([ics],{type:'text/calendar;charset=utf-8'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download=curY+'年'+curM+'月_共同休假.ics';
  document.body.appendChild(a);a.click();
  setTimeout(function(){document.body.removeChild(a);URL.revokeObjectURL(url);},200);
  toast('✓ 已匯出 '+events.length+' 天到行事曆');
}
document.getElementById('icalBtn').onclick=exportICal;

function dayHtmlFor(uid,d,dow,compact){
  var sidx=shiftIndex(uid,d), sh=sidx?shifts(uid)[sidx-1]:null;
  if(!sh)return '';
  return '<div class="bg2 '+(compact?'mini':'')+'" style="background:'+sh.bdg+';color:'+sh.txt+'">'+USERS[uid].label+' '+safeHtml(sh.name)+'</div>';
}
function render(){
  renderProfileUI();
  document.getElementById('ml').textContent=curY+'年'+curM+'月';
  renderLegendPanels();
  renderNextCard();
  var cg=document.getElementById('cg');cg.innerHTML='';
  var fd=new Date(curY,curM-1,1).getDay(),dim=new Date(curY,curM,0).getDate();
  var td=new Date(),ty=td.getFullYear(),tm=td.getMonth()+1,tdd=td.getDate();
  for(var i=0;i<fd;i++){var blank=document.createElement('div');blank.className='dc em';cg.appendChild(blank);}
  var cnt={syue:0,ling:0,common:0};
  for(var d=1;d<=dim;d++){
    var dow=(fd+d-1)%7;
    var myIdx=currentUser?shiftIndex(currentUser,d):0;
    var syueIdx=shiftIndex('syue',d), lingIdx=shiftIndex('ling',d);
    var common=isOff('syue',syueIdx)&&isOff('ling',lingIdx);
    if(syueIdx)cnt.syue++;if(lingIdx)cnt.ling++;if(common)cnt.common++;
    var div=document.createElement('div'), cls='dc';
    if(curY===ty&&curM===tm&&d===tdd)cls+=' td';
    if(common)cls+=' common';
    div.className=cls;
    if(!common&&myIdx){var msh=shifts(currentUser)[myIdx-1];if(msh){div.style.background=msh.bg;div.style.border='1.5px solid '+msh.border;}}
    var dnColor=common?'#8A2A1D':(myIdx&&shifts(currentUser)[myIdx-1]?shifts(currentUser)[myIdx-1].txt:(dow===0?'#D85A30':dow===6?'#185FA5':'var(--t)'));
    var html='<div class="dn" style="color:'+dnColor+'">'+d+'</div><div class="badge-stack">';
    if(common){html+='<div class="bg2" style="background:#F7B9AC;color:#8A2A1D">共同休假</div>';}
    else{html+=dayHtmlFor('syue',d,dow,true)+dayHtmlFor('ling',d,dow,true);}
    html+='</div>';div.innerHTML=html;
    (function(dd,dw){
      div.addEventListener('click',function(){
        if(!currentUser){showLogin();return;}
        var cd=gd(currentUser),max=shifts(currentUser).length,start=shiftIndex(currentUser,dd);
        cd[dd]=(start+1)%(max+1);if(cd[dd]===0)delete cd[dd];
        sd(cd,currentUser);saveAll();render();
        var ns=shiftIndex(currentUser,dd);
        if(ns>0)toast(USERS[currentUser].label+' '+curM+'/'+dd+'（'+DOW[dw]+'）→ '+shifts(currentUser)[ns-1].name);
      });
      var pt;
      div.addEventListener('touchstart',function(){pt=setTimeout(function(){
        if(!currentUser)return;var cd=gd(currentUser);
        if(cd[dd]){delete cd[dd];sd(cd,currentUser);saveAll();render();toast(USERS[currentUser].label+' '+curM+'/'+dd+' 已重設');}
      },550);});
      div.addEventListener('touchend',function(){clearTimeout(pt);});
      div.addEventListener('touchmove',function(){clearTimeout(pt);});
    })(d,dow);
    cg.appendChild(div);
  }
  // Build summary cards + popup data
  var smEl=document.getElementById('sm');
  var lists={syue:[],ling:[],common:[]};
  for(var d2=1;d2<=dim;d2++){
    var dw2=DOW[(fd+d2-1)%7];
    var si2=shiftIndex('syue',d2), li2=shiftIndex('ling',d2);
    var sh_s=si2?shifts('syue')[si2-1]:null;
    var sh_l=li2?shifts('ling')[li2-1]:null;
    if(isOff('syue',si2)&&isOff('ling',li2))lists.common.push({d:d2,dow:dw2});
    if(sh_s)lists.syue.push({d:d2,dow:dw2,sh:sh_s});
    if(sh_l)lists.ling.push({d:d2,dow:dw2,sh:sh_l});
  }
  window._popupLists=lists;
  window._popupCnt=cnt;
  smEl.innerHTML=
    '<div class="sc" onclick="showPopup(\'syue\')"><div class="sc-dot" style="background:#378ADD"></div><div class="sn" style="color:#378ADD">'+cnt.syue+'</div><div class="sl2">學的班別</div></div>'+
    '<div class="sc" onclick="showPopup(\'ling\')"><div class="sc-dot" style="background:#C45B8A"></div><div class="sn" style="color:#C45B8A">'+cnt.ling+'</div><div class="sl2">綾的班別</div></div>'+
    '<div class="sc" onclick="showPopup(\'common\')"><div class="sc-dot" style="background:var(--common)"></div><div class="sn" style="color:var(--common)">'+cnt.common+'</div><div class="sl2">共同休假</div></div>';
}

async function completeLogin(uid,pin,checkCloud){
  if(checkCloud&&IS_CONFIGURED&&syncCode){
    if(pin.length<2){toast('PIN 至少 2 碼');return;}
    setDot('spin');
    try{
      var ref=doc(db,'banbiao',syncCode);var snap=await getDoc(ref);var raw=snap.exists()?snap.data():{};
      readRemoteDocData(raw);
      if(profilePins[uid]&&profilePins[uid]!==pin){setDot('err');toast('PIN 不正確');return;}
      if(!profilePins[uid]){profilePins[uid]=pin;await setDoc(ref,{profilePins:profilePins,updatedAt:serverTimestamp()},{merge:true});}
      setDot('ok');
    }catch(e){console.error(e);setDot('err');toast('登入檢查失敗，先用本機身份');}
  }
  currentUser=uid;lsSet('currentUser',uid);saveLocalOnly();closeOv('ovS');render();toast('已登入 '+USERS[uid].label);
}

  document.getElementById('switchLogin').onclick=function(){showLogin(otherUser(currentUser));};
  var syncHtml='<div class="sync-div"><div class="sync-title">☁️ 雲端同步</div>';
  if(!IS_CONFIGURED){syncHtml+='<div class="sync-sub" style="color:#D85A30;">Firebase 尚未設定，目前只存在本機。</div>';}
  else{syncHtml+=`<div class="sync-sub">兩人的手機輸入相同同步代碼，再用自己的身份登入。</div><div class="code-box"><div class="code-txt" id="dispCode">${syncCode||'—'}</div><button class="code-btn" id="cpCodeBtn">複製</button></div><div class="sync-title" style="margin-bottom:8px">切換／加入代碼</div><div class="sync-input-row"><input class="sync-inp" id="syncInp" placeholder="同步代碼" maxlength="20" value=""><button class="sync-join-btn" id="syncJoinBtn">加入</button></div><div class="sync-warn" id="syncWarn"></div>`;}
  syncHtml+='</div>';body.insertAdjacentHTML('beforeend',syncHtml);
  if(IS_CONFIGURED){
    document.getElementById('cpCodeBtn').onclick=function(){copyText(syncCode);toast('✓ 已複製代碼 '+syncCode);};
    document.getElementById('syncJoinBtn').onclick=function(){var v=normalizeCode(document.getElementById('syncInp').value);if(v.length<2){document.getElementById('syncWarn').textContent='代碼至少 2 位';return;}applySyncCode(v);closeOv('ovS');toast('✓ 已切換到代碼 '+v);};
  }
  document.getElementById('ovS').className='ov on';
};
document.getElementById('csS').onclick=function(){closeOv('ovS');};
document.getElementById('ovS').onclick=function(e){if(e.target===this)closeOv('ovS');};

function copyText(m){try{navigator.clipboard.writeText(m);}catch(e){var ta=document.createElement('textarea');ta.value=m;ta.style.cssText='position:fixed;opacity:0;';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');}catch(ex){}document.body.removeChild(ta);}}

function showSyncSetup(){
  var box=document.getElementById('frBox'), newCode=genCode();
  document.getElementById('frOv').style.display='flex';
  if(!IS_CONFIGURED){
    box.innerHTML=`<div class="fr-icon">☁️</div><div class="fr-t">先用本機班表</div><div class="fr-s">Firebase 沒有設定時，仍可在這台手機使用雙人班表；之後補上設定就能同步。</div><button class="fr-btn" id="localGo">開始使用</button>`;
    document.getElementById('localGo').onclick=function(){syncCode='LOCAL';lsSet('syncCode','LOCAL');document.getElementById('frOv').style.display='none';showLogin('syue');};
    return;
  }
  box.innerHTML=`<div class="fr-icon">☁️</div><div class="fr-t">設定同步代碼</div><div class="fr-s">你和老婆的手機輸入同一組代碼，就會看到同一份雙人班表。</div><input class="fr-inp" id="frInp" maxlength="20" placeholder="例如 SYUEHOME" autocomplete="off"><button class="fr-btn" id="frUseCustom">使用這組代碼</button><button class="fr-btn2" id="frUseRandom">用隨機代碼（${newCode}）</button>`;
  document.getElementById('frUseCustom').onclick=function(){var v=normalizeCode(document.getElementById('frInp').value);if(v.length<2){toast('代碼至少 2 個字');return;}applySyncCode(v);document.getElementById('frOv').style.display='none';showLogin('syue');};
  document.getElementById('frUseRandom').onclick=function(){applySyncCode(newCode);document.getElementById('frOv').style.display='none';showLogin('syue');};
  document.getElementById('frInp').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('frUseCustom').click();});
  setTimeout(()=>document.getElementById('frInp').focus(),60);
}

(function init(){
  try{var rd=lsGet('scheduleDataV2');if(rd)scheduleData=JSON.parse(rd);}catch(e){}
  try{var rs=lsGet('shiftSetsV2');if(rs)shiftSets=JSON.parse(rs);}catch(e){}
  try{var rp=lsGet('profilePinsV2');if(rp)profilePins=JSON.parse(rp);}catch(e){}
  try{var old=lsGet('xd7');if(old&&!Object.keys(scheduleData.syue||{}).length)scheduleData.syue=JSON.parse(old);}catch(e){}
  try{var oldS=lsGet('xd7s');if(oldS){var os=JSON.parse(oldS);if(os&&os.length)shiftSets.syue=os.map(s=>Object.assign({off:(s.name||'').includes('休')&&!(s.name||'').includes('加班')},s));}}catch(e){}
  if(!scheduleData.syue)scheduleData.syue={};
  if(!scheduleData.ling)scheduleData.ling={};
  if(!shiftSets.syue)shiftSets.syue=JSON.parse(JSON.stringify(DEF_SHIFTS.syue));
  if(!shiftSets.ling)shiftSets.ling=JSON.parse(JSON.stringify(DEF_SHIFTS.ling));
  if(!scheduleData.syue['2026_05']||Object.keys(scheduleData.syue['2026_05']).length===0){
    scheduleData.syue['2026_05']={4:1,9:1,10:2,16:1,17:1,21:1,24:1,25:1,29:1};
  }
  currentUser=lsGet('currentUser')||'';
  syncCode=lsGet('syncCode')||'';
  saveLocalOnly();render();
  if(syncCode&&syncCode!=='LOCAL'&&IS_CONFIGURED){startListener(syncCode);document.getElementById('frOv').style.display=currentUser?'none':'none';if(!currentUser)showLogin('syue');}
  else if(syncCode==='LOCAL'){document.getElementById('frOv').style.display=currentUser?'none':'none';if(!currentUser)showLogin('syue');}
  else{showSyncSetup();}
})();
</script>
</body>
</html>
