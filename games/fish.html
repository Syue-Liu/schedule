<style>
html,body{overflow:hidden;}
body{background:#2D6F9A;touch-action:none;}
/* 場景用 1080×1920 的座標：上面是雪湖風景，700 以下是湖裡 */
.world{position:fixed;left:50%;bottom:0;width:1080px;height:1920px;transform-origin:50% 100%;background:url(../assets/games/fish/bg-winter.svg) 0 0/1080px 1920px no-repeat;overflow:hidden;}
.under{position:absolute;left:0;top:700px;width:1080px;height:1220px;background:url(../assets/games/fish/underwater.svg) 0 0/100% 100% no-repeat;}
.surface{position:absolute;left:0;top:672px;width:1080px;height:60px;pointer-events:none;overflow:visible;}
.surface path{animation:wave 3s ease-in-out infinite alternate;}
@keyframes wave{to{transform:translateX(-40px);}}
.ledge{position:absolute;left:790px;top:615px;width:340px;}
.pot{position:absolute;left:860px;top:535px;width:215px;}
.pot.puff{animation:potPuff .35s var(--pop);}
@keyframes potPuff{40%{transform:scale(1.08,.94);}}
.steam{position:absolute;left:900px;top:470px;width:140px;height:100px;display:flex;justify-content:space-around;pointer-events:none;}
.steam i{width:16px;height:70px;border-radius:999px;background:rgba(255,255,255,.8);animation:steam 1.6s ease-out infinite;}
.steam i:nth-child(2){animation-delay:.5s;}.steam i:nth-child(3){animation-delay:1s;}
@keyframes steam{from{transform:translateY(30px) scaleY(.4);opacity:0;}50%{opacity:.9;}to{transform:translateY(-40px);opacity:0;}}
.pet{position:absolute;}
.pet img{width:100%;display:block;}
.pet.flip img{transform:scaleX(-1);}
.pet .g-say{font-size:30px;padding:6px 16px;border-width:4px;border-radius:24px;}
.pet.cheer{animation:petHop .5s var(--pop);}
@keyframes petHop{40%{transform:translateY(-26px);}}
/* 雪球和浮冰一起左右移動 */
.angler{position:absolute;left:0;top:0;width:320px;height:200px;will-change:transform;}
.angler .floe{position:absolute;left:0;top:140px;width:320px;}
.angler .pet{left:60px;bottom:52px;width:150px;}
.line{position:absolute;left:0;top:0;width:1080px;height:1920px;pointer-events:none;overflow:visible;}
.hook{position:absolute;left:0;top:0;width:56px;height:56px;margin:-28px 0 0 -28px;will-change:transform;}
.hook.stuck{animation:shake .12s linear infinite alternate;}
@keyframes shake{to{translate:6px 0;}}
.fish{position:absolute;left:0;top:0;will-change:transform;}
.fish img{width:100%;height:100%;display:block;}
.fish.r img{transform:scaleX(-1);}
.fish.gold img{filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.08) drop-shadow(0 0 10px #FFE08A);}
.fish.oct{animation:octBob 1.2s ease-in-out infinite alternate;}
@keyframes octBob{to{scale:1 .9;}}
.ink{position:absolute;width:220px;height:220px;margin:-110px 0 0 -110px;border-radius:50%;background:radial-gradient(#3E3A39cc,#3E3A3900 70%);pointer-events:none;animation:ink 1.2s ease-out forwards;}
@keyframes ink{from{transform:scale(.3);opacity:1;}to{transform:scale(1.6);opacity:0;}}
.fly{position:absolute;left:0;top:0;pointer-events:none;z-index:3;}
.fly.gold{filter:sepia(1) saturate(4) hue-rotate(-12deg) brightness(1.08);}
/* 上面：肚子餓計量表 */
.hud{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 70px);z-index:21;display:flex;align-items:center;gap:8px;max-width:560px;margin:auto;pointer-events:none;}
.hud b{font-weight:400;font-size:14px;white-space:nowrap;padding:3px 10px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);}
.gauge{position:relative;flex:1;height:22px;border:var(--lw2) solid var(--ink);border-radius:999px;background:#5A463C;overflow:hidden;}
.gauge i{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(90deg,#E2675A,#F28C5B 45%,#F6D27A);transition:width .15s linear;}
.gauge span{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:13px;color:#FFFCF6;text-shadow:0 1px 0 #3E3A39;}
.gauge.low{animation:low .5s ease-in-out infinite alternate;}
@keyframes low{to{box-shadow:0 0 0 4px #F2A49799;}}
.combo{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 104px);z-index:21;transform:translateX(-50%);padding:3px 12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--yellow);font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;}
.combo.on{opacity:1;}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 18px);z-index:21;padding:6px 14px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:14px;white-space:nowrap;pointer-events:none;}
.tap{position:fixed;inset:0;z-index:10;}
</style>

<body data-game="fish">
<div class="world" id="world">
  <div class="under"></div>
  <img class="ledge" id="ledge" alt="">
  <div class="steam"><i></i><i></i><i></i></div>
  <div class="pet flip" id="pDg" style="left:925px;top:455px;width:175px"><img alt=""><div class="g-say"></div></div>
  <img class="pot" id="pot" alt="">
  <div class="pet" id="pCat" style="left:770px;top:520px;width:150px"><img alt=""><div class="g-say"></div></div>
  <svg class="surface" viewBox="0 0 1080 60"><path d="M-40 28 Q 30 14 100 28 T 240 28 T 380 28 T 520 28 T 660 28 T 800 28 T 940 28 T 1080 28 T 1220 28" fill="none" stroke="#FFFFFF" stroke-width="5" opacity=".85"/></svg>
  <div id="fishes"></div>
  <svg class="line" viewBox="0 0 1080 1920"><path id="line" d="" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="14 10"/><path id="rod" d="" fill="none" stroke="#8C6A55" stroke-width="10" stroke-linecap="round"/></svg>
  <div class="angler" id="angler"><img class="floe" id="floe" alt=""><div class="pet" id="pPg"><img alt=""><div class="g-say"></div></div></div>
  <svg class="hook" id="hook" viewBox="0 0 56 56"><circle cx="28" cy="18" r="13" fill="#FFFFFF" stroke="#594C43" stroke-width="4"/><path d="M28 31v10a7 7 0 0 1-14 0" fill="none" stroke="#C9C2BB" stroke-width="5" stroke-linecap="round"/></svg>
</div>
<div class="tap" id="tap"></div>
<div class="g-bar"><button class="g-back" onclick="location.href='./'">‹ 大廳</button><div class="g-title">湖邊釣魚</div><div class="g-pill hot" id="score">0 分</div></div>
<div class="hud"><b>🍲 肚子</b><div class="gauge" id="gauge"><i id="gfill"></i><span id="gnum">100</span></div></div>
<div class="combo" id="combo"></div>
<div class="tip" id="tip">按住放線、放開收線，手指左右移動</div>
<script src="sound.js?v=tower-20261029"></script>
<script src="game.js?v=tower-20261029"></script>
<script>
// 美術：之後換成畫好的圖，只要改這裡的檔名（黃金鮭魚先借大魚的圖染金色）
var A='../assets/games/fish/',ART={bg:A+'bg-winter.svg',under:A+'underwater.svg',floe:A+'floe.svg',ledge:A+'ledge.svg',pot:A+'hotpot.svg',oct:A+'octopus.svg',
  fish:A+'catch-fish.svg',squid:A+'catch-squid.svg',big:A+'catch-big.svg',king:A+'catch-big.svg',boot:A+'catch-boot.svg',chest:A+'catch-chest.svg'};
// 水面在 700，鉤子最深到 1790；雪球的鉤子左右可以到 180～750（右邊是放火鍋的雪堆）
var SURF=700,DEEP=1790,HX0=180,HX1=750,ROD=300;
// 湖裡的東西：分數、讓肚子飽多少、大小、游多快、在多深、出現的機率、拉上來的速度
var TYPES={
  fish:{name:'小魚',pts:10,food:7,w:250,h:250,rx:85,ry:52,sp:[150,220],y:[700,1250],wt:40,reel:620},
  squid:{name:'透抽',pts:20,food:9,w:210,h:210,rx:70,ry:88,sp:[220,290],y:[780,1400],wt:18,reel:600,bob:28},
  big:{name:'大魚',pts:30,food:14,w:320,h:320,rx:112,ry:70,sp:[110,160],y:[1050,1560],wt:14,reel:440},
  king:{name:'黃金鮭魚',pts:80,food:25,w:290,h:290,rx:100,ry:62,sp:[300,360],y:[1300,1580],wt:3,reel:420,gold:1},
  chest:{name:'寶箱',pts:50,food:0,w:210,h:210,rx:75,ry:75,sp:[40,60],y:[1600,1610],wt:3,reel:380},
  boot:{name:'舊靴子',pts:0,food:-8,w:200,h:200,rx:70,ry:72,sp:[70,110],y:[740,1580],wt:9,reel:560},
  oct:{name:'章魚',w:250,h:195,rx:105,ry:82,sp:[60,95],y:[880,1460],bob:18}
};
var $=function(id){return document.getElementById(id);};
// haul：鉤子上掛的魚（一竿最多 5 隻）
var MAXHAUL=5,state='idle',t=0,food=100,score=0,ax=200,tx=480,holding=false,hy=SURF+20,haul=[],stuck=0,fishes=[],raf=0,last=0,clickAt=0,talk=0,caught=0;
// 星星：2000 分三顆、1000 分兩顆
function stars(s){return s>=2000?3:s>=1000?2:1;}

function fit(){var s=Math.min(Math.max(Math.min(innerWidth,600)/1080,innerHeight/1920),innerHeight/1300);$('world').style.transform='translateX(-50%) scale('+s+')';}
fit();addEventListener('resize',fit);
$('floe').src=ART.floe;$('ledge').src=ART.ledge;$('pot').src=ART.pot;
$('pPg').querySelector('img').src=G.petImg('pg','idle');$('pCat').querySelector('img').src=G.petImg('cat','idle');$('pDg').querySelector('img').src=G.petImg('dg','idle');

function say(id,text,ms){var p=$(id),s=p.querySelector('.g-say');s.textContent=text;s.classList.add('on');p.classList.remove('cheer');void p.offsetWidth;p.classList.add('cheer');clearTimeout(p._t);p._t=setTimeout(function(){s.classList.remove('on');},ms||1300);}
function tip(x){$('tip').textContent=x;}
function rnd(a){return a[0]+Math.random()*(a[1]-a[0]);}
// 螢幕座標→場景座標（手指在哪，鉤子就跟到哪個 x）
function toWorld(cx){var r=$('world').getBoundingClientRect();return (cx-r.left)/r.width*1080;}
function pick(){
  var list=['fish','squid','big','king','chest','boot'].filter(function(k){return k!=='chest'||!fishes.some(function(f){return f.k==='chest';});});
  var sum=list.reduce(function(a,k){return a+TYPES[k].wt;},0),x=Math.random()*sum;
  for(var i=0;i<list.length;i++){x-=TYPES[list[i]].wt;if(x<=0)return list[i];}return 'fish';
}
function spawn(k,side){
  var T=TYPES[k],dir=side||(Math.random()<.5?1:-1),el=document.createElement('div');
  el.className='fish'+(dir>0?' r':'')+(T.gold?' gold':'')+(k==='oct'?' oct':'');el.style.width=T.w+'px';el.style.height=T.h+'px';
  el.innerHTML='<img src="'+ART[k]+'" alt="">';$('fishes').appendChild(el);
  // 越後面游得越快
  var f={k:k,T:T,el:el,w:T.w,h:T.h,dir:dir,x:dir>0?-T.w-20:1100,y0:rnd(T.y),ph:Math.random()*6,v:rnd(T.sp)*(1+Math.min(.6,t/150)),cd:0};
  f.y=f.y0;fishes.push(f);return f;
}
function school(){var dir=Math.random()<.5?1:-1,y=rnd([720,1150]);for(var i=0;i<4;i++){var f=spawn('fish',dir);f.x-=dir*i*190;f.y0=y+(i%2)*70;f.v=200;}}
function hit(f,x,y,sc){var dx=(x-(f.x+f.w/2))/(f.T.rx*(sc||1)),dy=(y-(f.y+f.h/2))/(f.T.ry*(sc||1));return dx*dx+dy*dy<=1;}
function showHaul(){var n=haul.length,c=$('combo');c.textContent='鉤上 '+n+' 隻'+(n>=MAXHAUL?'（滿了）':'！');c.classList.toggle('on',n>=2);}
// 拉上岸：鉤子上的魚一條一條飛進火鍋；一竿釣到好幾隻（不算靴子）每多一隻 +10
function deliverHaul(list){
  var good=list.filter(function(f){return f.T.pts>0;}).length,bonus=good>=2?(good-1)*10:0;
  list.forEach(function(f,i){fishes.splice(fishes.indexOf(f),1);setTimeout(function(){deliver(f,i===list.length-1?bonus:0,good);},i*140);});
}
function deliver(f,bonus,good){
  var T=f.T,k=f.k,x0=f.x,y0=f.y,x1=965-f.w/2,y1=600-f.h/2,t0=performance.now(),fl=document.createElement('img');
  fl.className='fly'+(T.gold?' gold':'');fl.src=ART[k];fl.style.width=f.w+'px';$('world').appendChild(fl);f.el.remove();
  (function arc(){var p=Math.min(1,(performance.now()-t0)/550),x=x0+(x1-x0)*p,y=y0+(y1-y0)*p-260*Math.sin(Math.PI*p);fl.style.transform='translate('+x+'px,'+y+'px) rotate('+p*360+'deg) scale('+(1-p*.4)+')';if(p<1)requestAnimationFrame(arc);else land();})();
  function land(){
    fl.remove();var pot=$('pot');pot.classList.remove('puff');void pot.offsetWidth;pot.classList.add('puff');
    var r=pot.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top;
    if(k==='boot'){food=Math.max(0,food-8);SND.sfx('boot');G.float(cx,cy,'舊靴子 −8 🍲','bad');say('pCat','這不能吃啦！');tip('是舊靴子…肚子更餓了');}
    else{
      score+=T.pts;caught++;food=Math.min(100,food+T.food);
      SND.sfx(k==='chest'?'treasure':k==='king'?'fishup':'catch');
      G.float(cx,cy,'+'+T.pts,'gold');
      if(T.food)setTimeout(function(){G.float(cx-60,cy+30,'🍲 +'+T.food,'');},180);
      if(k==='king'){say('pDg','黃金鮭魚！！',1500);say('pCat','發財了！',1500);}
      else if(k==='chest'){say('pDg','寶箱耶！',1200);}
      else if(Math.random()<.35)say(Math.random()<.5?'pCat':'pDg',['好吃！','火鍋加料～','雪球好厲害'][Math.floor(Math.random()*3)]);
    }
    if(bonus){score+=bonus;SND.sfx('fishup');setTimeout(function(){G.float(cx-20,cy-50,'一竿 '+good+' 隻！+'+bonus,'gold');},250);say('pDg','一次 '+good+' 隻！',1400);tip('一竿釣到 '+good+' 隻！');}
    else if(k!=='boot')tip(T.name+'下鍋了！');
    $('score').textContent=score+' 分';
  }
}
function tick(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(state==='play'){
    t+=dt;
    // 肚子越來越餓，掉得越來越快
    food-=(3.5+t*.075)*dt;
    if(food<=0){food=0;draw();return end();}
    // 湖裡的數量慢慢變多，章魚 8 秒後出現，45 秒後變兩隻
    var want=8+Math.min(4,Math.floor(t/20)),octs=fishes.filter(function(f){return f.k==='oct';}).length;
    if(fishes.length-octs<want){if(Math.random()<.12)school();else spawn(pick());}
    if(octs<(t>45?2:t>8?1:0)&&Math.random()<.02)spawn('oct');
    // 雪球跟著手指左右移動（有最快速度）
    var ta=Math.max(HX0,Math.min(HX1,tx))-ROD,d=ta-ax,mv=1100*dt;ax+=Math.abs(d)<mv?d:mv*Math.sign(d);
    var hx=ax+ROD;
    // 鉤子：被章魚纏住就動不了；按住往下、放開往上拉。掛越多魚，上下都越慢
    var n=haul.length,reel=n?Math.max(300,Math.min.apply(null,haul.map(function(f){return f.T.reel;}))-25*(n-1)):900;
    if(stuck>0){stuck-=dt;if(stuck<=0)$('hook').classList.remove('stuck');}
    else if(holding)hy=Math.min(DEEP,hy+(560-45*n)*dt);
    else hy=Math.max(SURF+20,hy-reel*dt);
    if(!holding&&hy>SURF+30&&now>clickAt){clickAt=now+(n?60:90);SND.sfx('click');}
    fishes.forEach(function(f){
      if(f.on)return;
      f.x+=f.dir*f.v*dt;f.y=f.y0+Math.sin(t*2+f.ph)*(f.T.bob||8);if(f.cd>0)f.cd-=dt;
      if(state!=='play'||stuck>0||f.cd>0||hy<SURF+40)return;
      if(f.k==='oct'){
        // 章魚：碰到鉤子或掛著的魚，會搶走最後釣到的那隻；空鉤子會被纏住、肚子 −10
        var touch=hit(f,hx,hy)||haul.some(function(h){return hit(f,h.x+h.w/2,h.y+h.h/2,1.15);});
        if(!touch)return;
        f.cd=3;ink(f);
        if(haul.length){var lost=haul.pop();lost.on=0;lost.dir=-f.dir||1;lost.v=380;lost.el.classList.toggle('r',lost.dir>0);lost.cd=2;lost.y0=lost.y;stuck=.5;$('hook').classList.add('stuck');SND.sfx('escape');say('pPg','被章魚搶走一隻！');tip('章魚搶走了'+lost.T.name+'…拉的時候閃開牠');showHaul();}
        else{stuck=1.2;food=Math.max(0,food-10);$('hook').classList.add('stuck');SND.sfx('ouch');say('pPg','被章魚纏住了！');tip('被章魚纏住了，肚子 −10');}
      }else if(haul.length<MAXHAUL&&hit(f,hx,hy)){
        f.on=1;haul.push(f);SND.sfx('bite');showHaul();$('pPg').querySelector('img').src=G.petImg('pg','happy');
        tip(haul.length===1?'釣到'+f.T.name+'！繼續按住可以再釣，放開拉上來':'又釣到'+f.T.name+'！');
      }
    });
    // 掛在鉤子上的魚一隻接一隻往下排；拉到水面就全部丟進火鍋
    var yy=hy;
    haul.forEach(function(f,i){f.x=hx-f.w/2+(i%2?18:-18);f.y=yy-f.h/2+f.T.ry*.6;yy+=f.T.ry*1.1;});
    if(haul.length&&hy<=SURF+20){var list=haul;haul=[];showHaul();deliverHaul(list);$('pPg').querySelector('img').src=G.petImg('pg','idle');}
    fishes=fishes.filter(function(f){if(f.x<-f.w-60||f.x>1140){f.el.remove();return false;}return true;});
    if(food<25&&t>talk){talk=t+4;say(Math.random()<.5?'pCat':'pDg','肚子好餓…',1200);}
    draw();
  }
  raf=requestAnimationFrame(tick);
}
function ink(f){var e=document.createElement('div');e.className='ink';e.style.left=(f.x+f.w/2)+'px';e.style.top=(f.y+f.h/2)+'px';$('world').appendChild(e);setTimeout(function(){e.remove();},1200);}
function draw(){
  var hx=ax+ROD;
  $('angler').style.transform='translate('+ax+'px,'+(SURF-190)+'px)';
  $('rod').setAttribute('d','M'+(ax+190)+' '+(SURF-70)+'L'+hx+' '+(SURF-150));
  $('line').setAttribute('d','M'+hx+' '+(SURF-150)+'L'+hx+' '+hy);
  $('hook').style.transform='translate('+hx+'px,'+hy+'px)';
  fishes.forEach(function(f){f.el.style.transform='translate('+f.x+'px,'+f.y+'px)';});
  $('gfill').style.width=food+'%';$('gnum').textContent=Math.ceil(food);$('gauge').classList.toggle('low',food<25);
}
function start(){
  fishes.forEach(function(f){f.el.remove();});fishes=[];haul=[];stuck=0;$('hook').classList.remove('stuck');
  state='play';t=0;food=100;score=0;caught=0;showHaul();hy=SURF+20;holding=false;talk=0;
  $('score').textContent='0 分';tip('按住放線、放開收線，手指左右移動');
  for(var i=0;i<7;i++){var f=spawn(pick());f.x=100+Math.random()*880;}
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
function end(){
  state='done';holding=false;
  ['pCat','pDg'].forEach(function(id){$(id).querySelector('img').src=G.petImg(id==='pCat'?'cat':'dg','happy');});
  say('pDg',score>=2000?'吃得好飽！':'火鍋好好吃～',1600);tip('肚子餓扁了…今天的火鍋收工');
  setTimeout(function(){G.finish({game:'fish',score:score,unit:'分',stars:stars(score),note:'釣了 '+caught+' 隻；一竿好幾隻有加分<br>2000 分三顆星、1000 分兩顆星',again:function(){G.countdown(start);}});},900);
}
// 操作：按住放線、放開收線，手指左右移動
var tap=$('tap');
tap.addEventListener('pointerdown',function(e){e.preventDefault();if(state!=='play')return;holding=true;tx=toWorld(e.clientX);if(hy<=SURF+25)SND.sfx('plop');try{tap.setPointerCapture(e.pointerId);}catch(_){}});
tap.addEventListener('pointermove',function(e){if(state==='play'&&(holding||e.pointerType==='mouse'))tx=toWorld(e.clientX);});
['pointerup','pointercancel'].forEach(function(ev){tap.addEventListener(ev,function(){holding=false;});});
draw();

});
