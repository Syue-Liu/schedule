/* 賺點數：改班表、改行程、傳通知（親密度兩隻都加） */
function petGain(kind,key){
  var me=petWho();if(!me)return;
  var r=petDay(me),d=r.d,p=0,a=0;
  if(kind==='chg'){if(d.chg.indexOf(key)>-1)return;d.chg.push(key);if(d.chg.length>60)d.chg.shift();p=1;a=1;}
  else if(kind==='ev'){if(d.ev<PET_DAY_EV){d.ev++;p=3;a=2;}}
  else if(kind==='ntf'){if(!d.ntf){d.ntf=1;p=2;a=2;}}
  p=Math.max(0,Math.min(p,PET_DAY_PTS-d.pts));
  d.pts+=p;r.pts+=p;PET_KEYS.forEach(function(k){ps(r,k).aff+=a;});
  petQuest(kind,1);
  petSave();
  var sp=petShown()[0];
  if(p&&sp)petFloat(sp,'+'+p+' ⭐');
  petCheckLevel();
}
function petQuest(k,n){
  var me=petWho();if(!me)return;
  var r=petDay(me),q=r.d.q,def=q&&petQuestDef(q.id);
  if(!def||q.done||def.k!==k)return;
  q.p+=n;
  if(q.p>=def.n){
    q.done=true;q.seen=true;
    Object.keys(def.r).forEach(function(f){r[f]+=def.r[f];});
    r.tix+=1;
    setTimeout(function(){
      var sp=petShown()[0];
      if(sp){petSay(sp,'支線完成！',2200);petFloat(sp,'+ '+petRewardTxt(def.r)+'、轉盤券');}
      toast('🎁 今日支線完成：獲得 '+petRewardTxt(def.r)+'、轉盤券 ×1');
    },500);
  }
  petUpdMark();
}
function petBusy(){
  petBusyUntil=Date.now()+20000;
  petList().forEach(function(p){
    if(p.act||p.menu||p.pet)return;
    if(p.el.classList.contains('sleep'))petWake(p);
    petNext(p,400+Math.random()*400);
  });
}
function petCheckLevel(){
  if(!petSynced)return;
  var lv=petLevel(petPts()),seen=+lsGet('catLvSeen')||0;
  if(!seen){lsSet('catLvSeen',lv);return;}
  if(lv<=seen)return;
  lsSet('catLvSeen',lv);
  var learn=PET_KEYS.map(function(k){var sk=PET_SKILLS[k].filter(function(s){return s.lv===lv;})[0];return sk?{k:k,sk:sk}:null;}).filter(Boolean);
  // 晚一點再跳，免得被「已新增」之類的提示蓋掉
  setTimeout(function(){toast('🎉 升到 Lv'+lv+(learn.length?'！'+learn.map(function(x){return petName(x.k)+'學會「'+x.sk.name+'」';}).join('、'):''));},900);
  petShown().forEach(function(p,i){
    petSay(p,'升到 Lv'+lv+'！',2600);petBurst(p,ART.star,8);
    var x=learn.filter(function(l){return l.k===p.k;})[0];
    if(x)setTimeout(function(){petDo(p,x.sk.id,false,true);},1400+i*700);
  });
}
function petUpdMark(){
  var me=petWho(),r=me&&petData[me],q=r&&r.d&&r.d.day===catToday()&&r.d.q,on=!!(q&&!q.seen&&!q.done);
  petList().forEach(function(p){p.el.classList.toggle('has-q',on);});
}
function petGreet(){
  var sh=petShown();if(!sh.length)return;
  var me=petWho();
  if(petGift&&me){
    petGift=false;
    petSay(sh[0],'今天也來看我們了！送你點心',2600);petFloat(sh[0],'+ 飼料 ×1、小魚 ×1');
    if(sh[1])setTimeout(function(){petSay(sh[1],catPick(sh[1].def.say.fav),1800);},700);
    return;
  }
  sh.forEach(function(p,i){
    setTimeout(function(){
      if(me&&petFav(p.k)===me){petSay(p,catPick(['歡迎回來♥','等你好久了～',catPick(p.def.say.fav)]),2200);petHearts(p,3);}
      else petSay(p,catPick(p.def.say.tap));
    },i*600);
  });
}

/* ── 畫面上的寵物 ── */
function petHidden(p){return lsGet(p.def.hide)==='1';}
function petBounds(p){
  var vw=window.innerWidth,vh=window.innerHeight,hdr=document.querySelector('.hdr').getBoundingClientRect().bottom;
  var bar=document.getElementById('chgBar').classList.contains('show')?100:12;
  var y0=Math.max(hdr+10,10),y1=Math.max(y0,vh-p.def.H-bar);
  return {x0:6,x1:Math.max(6,vw-p.def.W-6),y0:y0,y1:y1};
}
function petPlace(p){
  p.el.style.transform='translate3d('+p.x.toFixed(1)+'px,'+p.y.toFixed(1)+'px,0)';
  p.el.classList.toggle('left',p.dir<0);
}
function petMode(p,m){
  petBookReset(p);
  ['walk','run','sleep','eat','pet','happy'].forEach(function(c){p.el.classList.remove(c);});
  if(m)m.split(' ').forEach(function(c){p.el.classList.add(c);});
}
function petStop(p){cancelAnimationFrame(p.raf);p.raf=0;clearTimeout(p.timer);clearTimeout(p.sleepT);if(p.el.classList.contains('walk'))petMode(p,'');}
function petWalkTo(p,tx,ty,speed,done){
  petStop(p);
  var b=petBounds(p);tx=catClamp(tx,b.x0,b.x1);ty=catClamp(ty,b.y0,b.y1);
  if(Math.abs(tx-p.x)>2)p.dir=tx<p.x?-1:1;
  if(catReduce){p.x=tx;p.y=ty;petPlace(p);if(petTryCombo()&&p.act==='combo')return;if(done)done();return;}
  petMode(p,speed>70?'walk run':'walk');petPlace(p);
  var last=performance.now();
  function step(t){
    var dt=Math.min(.05,(t-last)/1000);last=t;
    var dx=tx-p.x,dy=ty-p.y,dist=Math.hypot(dx,dy),mv=speed*dt;
    if(dist<=mv){p.x=tx;p.y=ty;petPlace(p);petMode(p,'');p.raf=0;if(petTryCombo()&&p.act==='combo')return;if(done)done();return;}
    p.x+=dx/dist*mv;p.y+=dy/dist*mv;petPlace(p);
    if(petTryCombo()&&p.act==='combo')return;
    p.raf=requestAnimationFrame(step);
  }
  p.raf=requestAnimationFrame(step);
}
function petNext(p,ms){clearTimeout(p.timer);p.timer=setTimeout(function(){petThink(p);},ms==null?1800+Math.random()*3500:ms);}
function petIdle(p){return !p.menu&&!p.pet&&!p.act&&!petHidden(p)&&!p.el.classList.contains('sleep');}
function petTouching(a,b){
  var feet=Math.abs(a.y+a.def.H-b.y-b.def.H);
  return feet<Math.min(a.def.H,b.def.H)*.55&&a.x+a.def.W+8>=b.x&&b.x+b.def.W+8>=a.x;
}
var PET_COMBOS={
  'cat+pg':{name:'冰雪愛心陣',kind:'ice',say:{cat:'冰雪愛心陣！',pg:'一起上！'},particles:['❄',ART.heart]},
  'cat+dg':{name:'雲朵擊掌',kind:'cloud',say:{cat:'雲朵擊掌！',dg:'汪！接住！'},particles:['☁','🐾',ART.heart]},
  'dg+pg':{name:'極光雪橇',kind:'aurora',say:{pg:'極光雪橇！',dg:'汪！出發！'},particles:['❄','✦','✨']},
  all:{name:'三重奏・星光大冒險',kind:'all',say:{cat:'一起閃耀！',pg:'嘎！冰晶！',dg:'汪！衝呀！'},particles:['❄','☁',ART.heart,'✦']}
};
function petComboKey(list){return list.length===3?'all':list.map(function(p){return p.k;}).sort().join('+');}
function petConnected(list){
  if(!list.length)return false;
  var seen=[list[0]];
  for(var i=0;i<seen.length;i++)list.forEach(function(p){if(seen.indexOf(p)<0&&petTouching(seen[i],p))seen.push(p);});
  return seen.length===list.length;
}
function petReleaseComboWait(){
  clearTimeout(petCombo.waitT);petCombo.waitT=null;
  var waiting=petCombo.waiting||[];petCombo.waiting=[];petCombo.invite=null;
  waiting.forEach(function(p){if(p.act!=='combo')petNext(p,1000);});
}
function petEndCombo(){
  petReleaseComboWait();
  if(!petCombo.active)return;
  petCombo.active=false;petCombo.timers.forEach(clearTimeout);petCombo.timers=[];
  if(petCombo.fx){petCombo.fx.remove();petCombo.fx=null;}
  (petCombo.members||[]).forEach(function(p){
    if(p.act!=='combo')return;
    petBookReset(p);p.el.querySelector('.cat-say').classList.remove('on','combo-below');
    p.el.classList.remove('sk-combo');p.el.removeAttribute('data-combo-kind');p.act='';petNext(p,2600+Math.random()*1400);
  });
  petCombo.members=[];
}
function petComboBurst(){
  if(!petCombo.active||catReduce)return;
  var list=petCombo.members,def=PET_COMBOS[petCombo.type];
  var x=list.reduce(function(v,p){return v+p.x+p.def.W/2;},0)/list.length,y=Math.min.apply(null,list.map(function(p){return p.y;}))+20;
  var n=def.kind==='all'?24:12;
  for(var i=0;i<n;i++){
    var angle=Math.PI*2*i/n,token=def.particles[i%def.particles.length];
    if(def.kind==='all')catFx(token,'',Math.random()*(window.innerWidth-24),Math.random()*window.innerHeight,Math.cos(angle)*70,-40-Math.random()*100);
    else catFx(token,'',x-9,y,Math.cos(angle)*85,Math.sin(angle)*55-40);
  }
}
// 保留角色對話，依實際泡泡寬度排成一列，避開彼此與最高跳躍位置。
function petComboDialogue(list,def){
  var gap=list.length===3?8:12,vw=window.innerWidth,hdr=document.querySelector('.hdr').getBoundingClientRect().bottom;
  var sorted=list.slice().sort(function(a,b){return a.x+a.def.W/2-b.x-b.def.W/2;});
  var bubbles=sorted.map(function(p){
    var s=p.el.querySelector('.cat-say');clearTimeout(p.sayT);s.textContent=def.say[p.k];
    return {p:p,s:s,w:s.offsetWidth,h:s.offsetHeight};
  });
  var width=bubbles.reduce(function(v,b){return v+b.w;},0)+gap*(bubbles.length-1);
  var mid=sorted.reduce(function(v,p){return v+p.x+p.def.W/2;},0)/sorted.length;
  var x=catClamp(mid-width/2,6,Math.max(6,vw-width-6));
  var high=Math.min.apply(null,list.map(function(p){return p.y;})),ground=Math.max.apply(null,list.map(function(p){return p.y+p.def.H;}));
  var top=high-40-Math.max.apply(null,bubbles.map(function(b){return b.h;}))-14,below=top<hdr+8;
  if(below)top=ground+12;
  bubbles.forEach(function(b){
    b.s.style.setProperty('--sx',(x-(b.p.x+b.p.def.W/2-b.w/2))+'px');
    b.s.style.setProperty('--combo-say-top',(top-b.p.y)+'px');
    b.s.classList.toggle('combo-below',below);b.s.classList.add('on');x+=b.w+gap;
  });
}
function petAdventureMarkup(){
  var stars='';
  for(var i=0;i<12;i++){
    stars+='<i class="adventure-star" style="left:'+((i*37+11)%97)+'%;top:'+((i*19+7)%56)+'%;--delay:-'+(i*.23).toFixed(2)+'s;--size:'+(i%3?3:6)+'px"></i>';
  }
  return '<div class="adventure-sparkles" aria-hidden="true">'+stars+'</div>'+
    '<div class="adventure-heading"><span>一起出發吧！</span><strong>星光大冒險</strong><div>❄　✦　☁　✦　❄</div></div>'+
    '<div class="adventure-stage"><div class="adventure-convoy"><div class="adventure-dialogues"><div class="sled-speech penguin">出發！嘎～</div><div class="sled-speech pillow">坐穩囉～</div><div class="sled-speech samoyed">汪！衝呀！</div></div><div class="adventure-team"><img class="adventure-art" src="assets/pets/starlight-sled.svg" alt="薩摩耶拉著雪橇，載著企鵝和 Pillow 迎向星光" draggable="false"></div><div class="adventure-powder"></div></div></div>'+
    '<button type="button" class="adventure-skip">略過動畫 ✕</button>';
}

function petStartCombo(list){
  petReleaseComboWait();
  var key=petComboKey(list),def=PET_COMBOS[key],ms=key==='all'?9000:4000;
  petCombo.active=true;petCombo.type=key;petCombo.members=list.slice();petCombo.armed[key]=false;
  if(key==='all')petCdStart('all');
  list.forEach(function(a,i){list.slice(i+1).forEach(function(b){petCombo.armed[petComboKey([a,b])]=false;});});
  var pair=list.slice().sort(function(a,b){return a.x+a.def.W/2-b.x-b.def.W/2;});
  var mid=list.reduce(function(v,p){return v+p.x+p.def.W/2;},0)/list.length;
  var ground=Math.max.apply(null,list.map(function(p){return p.y+p.def.H;}));
  var total=key==='all'?Math.max(pets.cat.def.W+pets.pg.def.W+8,pets.dg.def.W):pair[0].def.W+pair[1].def.W+6;
  var start=catClamp(mid-total/2,6,Math.max(6,window.innerWidth-total-6));
  list.forEach(function(p){
    petStop(p);petMode(p,'');p.act='combo';p.el.classList.add('sk-combo');p.el.setAttribute('data-combo-kind',def.kind);
    var bounds=petBounds(p);
    if(key==='all'){
      p.x=p.k==='cat'?start:p.k==='pg'?start+total-p.def.W:start+(total-p.def.W)/2;
      p.y=ground-p.def.H-(p.k==='dg'?70:0);p.dir=p.k==='pg'?-1:1;
    }else{var i=pair.indexOf(p);p.x=start+(i?pair[0].def.W+6:0);p.y=ground-p.def.H;p.dir=i?-1:1;}
    p.x=catClamp(p.x,bounds.x0,bounds.x1);p.y=catClamp(p.y,bounds.y0,bounds.y1);petPlace(p);
    petBookPlay(p,'combo',ms);clearTimeout(p.sayT);p.el.querySelector('.cat-say').classList.remove('on');
  });
  petComboDialogue(list,def);
  var fx=document.createElement('div');fx.className='pet-combo-fx '+def.kind;fx.setAttribute('aria-hidden','true');
  if(key==='all'){
    fx.removeAttribute('aria-hidden');fx.setAttribute('role','region');fx.setAttribute('aria-label','三隻合體：星光大冒險');
    fx.innerHTML=petAdventureMarkup();
    fx.querySelector('.adventure-heading').style.top=(document.querySelector('.hdr').getBoundingClientRect().bottom+12)+'px';
    fx.querySelector('.adventure-skip').onclick=petEndCombo;
  }else{
    fx.style.left=catClamp(start+total/2-90,6,Math.max(6,window.innerWidth-186))+'px';
    fx.style.top=Math.max(document.querySelector('.hdr').getBoundingClientRect().bottom+4,ground-150)+'px';
    var inner=def.kind==='ice'?'<circle cx="60" cy="60" r="48" fill="none" stroke="#A8D3E6" stroke-width="3" stroke-dasharray="8 7"/><path d="M60 15v90M21 37l78 46M21 83l78-46" fill="none" stroke="#A8D3E6" stroke-width="2"/><path d="M60 76C33 59 43 39 60 50C77 39 87 59 60 76Z" fill="#F2A497" stroke="#FFFCF6" stroke-width="3"/>':
      def.kind==='cloud'?'<path d="M25 82C5 82 8 49 29 50C23 21 66 16 73 43C97 26 122 62 99 78Z" fill="#FFFCF6" fill-opacity=".8" stroke="#B9DAA5" stroke-width="3"/><path d="M60 82C35 64 45 45 60 56C75 45 85 64 60 82Z" fill="#F2A497"/>':
      '<path d="M12 70Q38 10 60 55T108 40M12 85Q38 25 60 70T108 55" fill="none" stroke="#B9DAA5" stroke-width="12" opacity=".8"/><path d="M12 87Q38 27 60 72T108 57" fill="none" stroke="#A8D3E6" stroke-width="7"/><path d="M61 18l4 10 11 1-9 7 3 11-9-6-9 6 3-11-9-7 11-1Z" fill="#F6D27A"/>';
    fx.innerHTML='<svg class="combo-ring" viewBox="0 0 120 120">'+inner+'</svg>';
  }
  document.body.appendChild(fx);petCombo.fx=fx;
  if(!catReduce)[650,1700,2900].forEach(function(t){petCombo.timers.push(setTimeout(petComboBurst,t));});
  var endDelay=catReduce?(key==='all'?3500:1500):ms;
  var endTimer=setTimeout(petEndCombo,endDelay);petCombo.timers.push(endTimer);
  if(key==='all'){
    var art=fx.querySelector('.adventure-art'),convoy=fx.querySelector('.adventure-convoy');
    if(!art.complete){
      convoy.style.animationPlayState='paused';
      art.onload=function(){
        if(!petCombo.active||petCombo.fx!==fx)return;
        convoy.style.animationPlayState='running';clearTimeout(endTimer);
        petCombo.timers.push(setTimeout(petEndCombo,endDelay));
      };
    }
    art.onerror=function(){if(petCombo.fx===fx){petEndCombo();toast('雪橇大圖尚未載入，請再試一次');}};
  }
  return true;
}
function petTryCombo(){
  if(document.hidden)return false;
  var all=petList();
  all.forEach(function(a,i){all.slice(i+1).forEach(function(b){if(!petTouching(a,b))petCombo.armed[petComboKey([a,b])]=true;});});
  if(!petConnected(all))petCombo.armed.all=true;
  var ready=all.filter(function(p){return petIdle(p)||p.act==='combo';});
  if(petCombo.active){
    if(petCombo.members.length===2&&ready.length===3&&petConnected(ready)&&!petCdLeft('all')){
      petEndCombo();return petStartCombo(ready);
    }
    return false;
  }
  if(ready.length===3&&petConnected(ready)&&petCombo.armed.all!==false&&!petCdLeft('all'))return petStartCombo(ready);
  // 邀請三隻時先一起集合，避免第一對提早開招而打斷第三隻走過來。
  if(petCombo.invite&&petCombo.invite.length===3)return false;
  for(var i=0;i<ready.length;i++)for(var j=i+1;j<ready.length;j++){
    var pair=[ready[i],ready[j]],key=petComboKey(pair);
    if(petTouching(pair[0],pair[1])&&petCombo.armed[key]!==false)return petStartCombo(pair);
  }
  return false;
}
function petInviteCombo(p,target){
  if(petCombo.active){toast('正在合體表演中～');return;}
  if(target==='all'&&petCdLeft('all')){toast('三隻合體冷卻中，再等 '+petCdLeft('all')+' 秒');return;}
  var others=petShown().filter(function(q){return q!==p;});
  var list=target==='all'?petList():[p,target?pets[target]:others.sort(function(a,b){return Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y);})[0]];
  if(list.some(function(q){return !q||petHidden(q);})){toast(target==='all'?'先把三隻都叫出來吧':'先叫夥伴出來，才能一起合體');return;}
  list.forEach(function(q){if(q.el.classList.contains('sleep'))petWake(q);});
  if(!list.every(petIdle)){toast('等牠們忙完，再一起合體吧');return;}
  petReleaseComboWait();
  list.forEach(function(q){petStop(q);});
  petCombo.armed[petComboKey(list)]=true;petCombo.invite=list.map(function(q){return q.k;});petCombo.waiting=list.slice();
  petCombo.waitT=setTimeout(function checkArrival(){
    if(!petCombo.invite)return;
    if(list.some(function(q){return !!q.raf;})){petCombo.waitT=setTimeout(checkArrival,3000);return;}
    petReleaseComboWait();
  },6500);
  var width=list.length===3?pets.cat.def.W+pets.pg.def.W+6:list[0].def.W+list[1].def.W+6;
  var start=catClamp(window.innerWidth/2-width/2,6,Math.max(6,window.innerWidth-width-6));
  var ground=Math.min.apply(null,list.map(function(q){return petBounds(q).y1+q.def.H;}))-20;
  list.forEach(function(q,i){
    if(petCombo.active&&petCombo.members.indexOf(q)>-1)return;
    var tx,ty=ground-q.def.H;
    if(list.length===3){tx=q.k==='cat'?start:q.k==='pg'?start+width-q.def.W:start+(width-q.def.W)/2;}
    else tx=start+(i?list[0].def.W+6:0);
    var speed=Math.max(90,Math.hypot(tx-q.x,ty-q.y)/4);
    petWalkTo(q,tx,ty,speed,function(){if(!petTryCombo()&&!petCombo.invite)petNext(q,1600);});
  });
  petSay(p,target==='all'?'大家一起來！':'來一起合體！',2200);petTryCombo();
}

// 自己決定下一步要做什麼
function petThink(p){
  if(p.menu||p.pet||p.act||petHidden(p)||document.hidden){petNext(p,3000);return;}
  if(p.el.classList.contains('sleep'))return;
  var b=petBounds(p),r=Math.random(),hr=new Date().getHours(),night=hr>=23||hr<7,full=petFull(p.k),S=p.def.say;
  // 有人在排班：走到下面待著陪，不擋月曆
  if(petBusyUntil>Date.now()){
    if(Math.abs(p.y-b.y1)>6&&!catReduce)petWalkTo(p,p.x+(Math.random()-.5)*100,b.y1,75,function(){petNext(p,4000);});
    else{if(Math.random()<.3)petSay(p,catPick(S.busy));petNext(p,5000);}
    return;
  }
  if(full<20&&r<.25){petSay(p,catPick(S.hungry),2200);petNext(p,4000);return;}
  if((night&&r<.5)||r<.07){petSleep(p,9000+Math.random()*14000);return;}
  // 偶爾去找另一隻玩
  var o=catPick(petShown().filter(function(q){return q!==p;}));
  if(r<.13&&o&&petIdle(o)&&!catReduce){
    var tx=o.x<p.x?o.x+o.def.W-6:o.x-p.def.W+6;
    petWalkTo(p,tx,o.y+o.def.H-p.def.H,60,function(){
      if(petTryCombo()&&p.act==='combo')return;
      p.dir=o.x<p.x?-1:1;petPlace(p);petSay(p,S.meet);

function petDo(p,id,fromUser,force){
  if(p.act||(!force&&(p.menu||p.pet)))return false;
  if(fromUser&&id!==p.def.idle&&petFull(p.k)<15){petSay(p,p.def.say.weak);petMeow(p);return false;}
  var cdKey=p.k+':'+id,left=petCdLeft(cdKey);
  if(fromUser&&id!==p.def.idle&&left){toast('「'+petSkillName(p.k,id)+'」冷卻中，再等 '+left+' 秒');return false;}
  if(!fromUser&&!force&&left)return false;
  petStop(p);petMode(p,'');
  if(fromUser&&id!==p.def.idle)petCdStart(cdKey);
  var ms=PET_SK_MS[p.k][id]||1500;
  p.el.style.setProperty('--skill-time',ms+'ms');
  p.act=id;p.el.classList.add('sk-'+id);petBookPlay(p,id,ms);
  if(PET_SK_SAY[id])petSay(p,PET_SK_SAY[id],2000);
  if(id==='love')p.bookTimers.push(setTimeout(function(){petBurst(p,ART.heart,10);},500));
  if(id==='yarn')catYarn(p);
  if(p.k==='dg'&&['shake','howl','cloud'].indexOf(id)>-1){
    var token=id==='howl'?'♪':id==='cloud'?'☁':'✦';
    [500,1100,1700].forEach(function(t){p.bookTimers.push(setTimeout(function(){if(p.act===id&&!catReduce)petBurst(p,token,id==='cloud'?9:4);},t));});
  }
  if(id==='flip'||id==='jump')p.bookTimers.push(setTimeout(function(){petSay(p,catPick(p.def.say.jump),1200);},100));
  p.skillT=setTimeout(function(){
    petBookReset(p);p.skillT=0;p.el.classList.remove('sk-'+id);p.act='';
    // 毛線球、滑行：整隻衝出去了，把位置留在停下來的地方

    if(go&&!catReduce){var b=petBounds(p);p.x=catClamp(p.x+p.dir*go,b.x0,b.x1);petPlace(p);}
    petNext(p);
  },catReduce?700:ms);
  if(fromUser&&id!==p.def.idle){petQuest('skill',1);petSave();}
  return true;
}

function petFeed(p,food){

  var r=petDay(me),F=FOODS[food],full=petFull(p.k);
  if(!r[food]){petSay(p,'沒有'+F.name+'了…');toast('完成今日支線、撿寵物找到的東西，就有糧食');return false;}
  if(full>=92){petSay(p,p.def.say.full);petMeow(p);return false;}
  if(p.act||p.pet)return false;
  r[food]--;
  var st=ps(r,p.k);st.fedAt=Date.now();st.fedFull=Math.min(100,full+F.full);st.aff+=F.aff;
  petQuest('feed',1);petSave();
  petStop(p);clearTimeout(p.sleepT);

  p.dir=p.x+p.def.W/2>window.innerWidth/2?-1:1;petPlace(p);
  p.act='eat';petMode(p,'eat happy');petSay(p,F.eat);
  var bowl=null;

    bowl=document.createElement('div');bowl.className='cat-bowl';bowl.innerHTML=CAT_ART.bowl;

  }else{

    bowl.style.left=(p.dir>0?p.x+p.def.W*.72:p.x+p.def.W*.28-24)+'px';bowl.style.top=(p.y+p.def.H*.5)+'px';
  }

    if(bowl)bowl.remove();
    petMode(p,'');p.act='';
    petSay(p,F.done,2000);petHearts(p,F.aff>=6?5:2);
    petNext(p,2500);

    '改一天班表 +1⭐・新增／修改行程 +3⭐・傳變更通知 +2⭐<br>（每人每天最多 '+PET_DAY_PTS+'⭐，同一天改來改去只算一次）<br>'+
    '每天第一次來送飼料和小魚・完成今日支線拿糧食<br>飼料、罐頭給貓咪和薩摩耶，小魚、透抽給企鵝<br>畫面上偶爾會冒出糧食，看到記得點一下撿起來</div></div>';
  h+='<div class="cs-sec"><div class="cs-seg">'+(me?'這支手機是 <button data-me="syue"'+(me==='syue'?' class="on"':'')+'>學</button><button data-me="ling"'+(me==='ling'?' class="on"':'')+'>綾</button>':'')+
    '<button id="csHide">'+(petHidden(p)?'叫'+safeHtml(name)+'出來':'讓'+safeHtml(name)+'去休息（隱藏）')+'</button></div></div>';
  h+='</div>';
  openPopupCard(h);petCdPaint();
  var card=document.getElementById('popupCard');
  card.querySelectorAll('[data-pk]').forEach(function(b){b.onclick=function(){petOpenSheet(b.getAttribute('data-pk'));};});
  document.getElementById('csAcc').onclick=function(){accOpenWardrobe(k);};
  card.querySelectorAll('[data-me]').forEach(function(b){b.onclick=function(){
    lsSet('catMe',b.getAttribute('data-me'));petDay(petWho());petSave();if(cloudOn())petFlush();petUpdMark();petOpenSheet(k);
  };});
  card.querySelectorAll('[data-feed]').forEach(function(b){b.onclick=function(){
    if(petHidden(p)){toast('先叫'+name+'出來才能餵喔');return;}
    var f=b.getAttribute('data-feed');
    if(!petData[petWho()][f]){toast('完成今日支線、撿寵物找到的東西，就有糧食');return;}
    closePopup();setTimeout(function(){petFeed(p,f);},350);
  };});
  card.querySelectorAll('[data-sk]').forEach(function(b){b.onclick=function(){
    if(petHidden(p)){toast('先叫'+name+'出來才能表演喔');return;}
    var l=petCdLeft(k+':'+b.getAttribute('data-sk'));
    if(l){toast('「'+petSkillName(k,b.getAttribute('data-sk'))+'」冷卻中，再等 '+l+' 秒');return;}
    closePopup();var id=b.getAttribute('data-sk');setTimeout(function(){petDo(p,id,true);},350);
  };});
  document.getElementById('csHide').onclick=function(){
    petSetResting(p,!petHidden(p));
    closePopup();
  };
  document.getElementById('csName').onclick=function(){
    if(!petWho()){toast('先選你是誰');return;}
    var v=prompt('幫'+PET_DEF[k].species+'取名字（8 個字以內）',name);
    if(v==null)return;v=v.trim().slice(0,8);if(!v)return;
    var st=ps(petRec(petWho()),k);st.name=v;st.nameAt=Date.now();petSave();petOpenSheet(k);
  };
}
// 點寵物選單或狀態卡都使用同一個休息開關，重新整理後也保留。
function petSetResting(p,hide){
  petEndCombo();
  petCloseMenu();petStop(p);clearTimeout(p.sleepT);clearTimeout(p.sayT);
  clearTimeout(p.skillT);p.skillT=0;
  if(p.act&&p.act!=='eat'){p.el.classList.remove('sk-'+p.act);p.act='';}
  if(p.yarnEl){p.yarnEl.remove();p.yarnEl=null;}
  p.el.querySelector('.cat-say').classList.remove('on');
  lsSet(p.def.hide,hide?'1':'');
  p.el.classList.toggle('hide',hide);petMode(p,'');petUpdHome();
  if(!hide){
    var b=petBounds(p);p.x=catClamp(p.x,b.x0,b.x1);p.y=b.y1;
    petPlace(p);petNext(p,800);petSay(p,p.def.say.back);
  }else toast(petName(p.k)+'回去睡覺了，點頁尾的牠就能叫醒');
}
// 頁尾設施：寵物去休息時，貓睡在跳台上、企鵝在冰屋門口打瞌睡
function petUpdHome(){
  var sc=document.getElementById('scene');
  sc.classList.toggle('cat-away',petHidden(pets.cat));
  sc.classList.toggle('pg-away',petHidden(pets.pg));
  sc.classList.toggle('dg-away',petHidden(pets.dg));
}

function petMake(k){
  var d=PET_DEF[k],p={k:k,def:d,el:null,x:0,y:0,dir:1,raf:0,timer:null,sayT:null,act:'',menu:false,pet:false,pd:null,lpT:null,tapT:null,sleepT:null};
  var el=document.createElement('div');el.className='cat'+(k==='cat'?'':' '+k);
  el.setAttribute('role','button');el.setAttribute('aria-label',d.species);el.setAttribute('tabindex','0');
  el.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();petTap(p);}});
  el.innerHTML='<div class="cat-face"><div class="cat-sk"><div class="cat-bob">'+CAT_ART[k]+'</div></div></div><div class="cat-say"></div><div class="cat-mark">!</div>';
  document.body.appendChild(el);p.el=el;
  if(petHidden(p))el.classList.add('hide');
  // 手指在寵物身上滑＝摸摸；點一下＝選單；長按也算摸摸
  el.addEventListener('pointerdown',function(e){
    e.preventDefault();
    p.pd={x:e.clientX,y:e.clientY,t:Date.now(),dist:0,acc:0};
    try{el.setPointerCapture(e.pointerId);}catch(_){}
    clearTimeout(p.lpT);p.lpT=setTimeout(function(){if(p.pd)petPetStart(p);},450);
  });
  el.addEventListener('pointermove',function(e){
    var q=p.pd;if(!q)return;
    var dd=Math.hypot(e.clientX-q.x,e.clientY-q.y);q.x=e.clientX;q.y=e.clientY;q.dist+=dd;q.acc+=dd;
    if(q.dist>22)petPetStart(p);
    if(p.pet&&q.acc>90){q.acc=0;petHearts(p,1);}
  });
  // 點一下要等 click 才開選單：iPhone 手指放開後還會補一個 click，先開的話會點到選單外面又關掉
  function up(tap){
    clearTimeout(p.lpT);
    var q=p.pd;p.pd=null;if(!q)return;
    if(p.pet){petPetEnd(p);return;}
    if(tap&&q.dist<12){clearTimeout(p.tapT);p.tapT=setTimeout(function(){p.tapT=null;petTap(p);},450);}
  }
  el.addEventListener('pointerup',function(){up(true);});
  el.addEventListener('pointercancel',function(){up(false);});
  el.addEventListener('click',function(){if(p.tapT){clearTimeout(p.tapT);p.tapT=null;petTap(p);}});
  el.addEventListener('contextmenu',function(e){e.preventDefault();});
  return p;
}
// 每次進頁面從不同位置出現；避開頁首，並盡量讓兩隻不要重疊。
function petSpawn(p,placed){
  var b=petBounds(p),y0=Math.max(b.y0,b.y1-180),best=null,bestScore=-1;
  for(var i=0;i<28;i++){
    var x=i<24?b.x0+Math.random()*(b.x1-b.x0):(i%2?b.x1:b.x0);
    var y=i<24?y0+Math.random()*(b.y1-y0):(i<26?y0:b.y1);
    var clear=true,score=Infinity;
    placed.forEach(function(q){
      if(x<q.x+q.def.W+14&&x+p.def.W+14>q.x&&y<q.y+q.def.H+14&&y+p.def.H+14>q.y)clear=false;
      score=Math.min(score,Math.hypot(x+p.def.W/2-q.x-q.def.W/2,y+p.def.H/2-q.y-q.def.H/2));
    });
    if(score>bestScore){best={x:x,y:y};bestScore=score;}
    if(clear){best={x:x,y:y};break;}
  }
  p.x=best.x;p.y=best.y;p.dir=p.x+p.def.W/2<window.innerWidth/2?1:-1;petPlace(p);
}
function petInit(){
  try{var s=JSON.parse(lsGet('catV1')||'null');if(s){petData.syue=s.syue?petClean(s.syue):null;petData.ling=s.ling?petClean(s.ling):null;}}catch(e){}
  PET_KEYS.forEach(function(k){pets[k]=petMake(k);});
  accApply();
  var placed=[];petList().forEach(function(p){petSpawn(p,placed);placed.push(p);});
  petUpdHome();
  // 最黏你的那隻：偶爾跑到你點的地方
  document.addEventListener('pointerdown',function(e){
    if(catReduce||petBusyUntil>Date.now())return;
    if(e.target.closest('.cw,.popup-ov,.ov,.frov,.cat,.cat-menu,.cat-drop,.chg-bar,.hdr,.smenu'))return;
    var me=petWho();if(!me||Math.random()>.3)return;
    var c=petShown().filter(function(p){return petIdle(p)&&petFav(p.k)===me;});
    if(!c.length)return;
    var p=catPick(c),x=e.clientX,y=e.clientY;
    setTimeout(function(){if(petIdle(p))petWalkTo(p,x-p.def.W/2+(x>p.x?-30:30),y-p.def.H+10,95,function(){petSay(p,'♥');petNext(p);});},250);
  },{passive:true});
  window.addEventListener('resize',function(){petEndCombo();petList().forEach(function(p){var b=petBounds(p);p.x=catClamp(p.x,b.x0,b.x1);p.y=catClamp(p.y,b.y0,b.y1);petPlace(p);});});
  document.addEventListener('visibilitychange',function(){if(document.hidden){petEndCombo();petFlush();}});
  window.addEventListener('pagehide',petFlush);
  // 停留時間：畫面開著每滿一分鐘，兩隻的親密度各 +1
  setInterval(function(){
    if(document.hidden||!petSynced)return;
    petSecs+=15;if(petSecs<60)return;petSecs=0;
    var me=petWho();if(!me)return;
    var r=petDay(me);r.d.min++;if(r.d.min<=PET_DAY_MIN){PET_KEYS.forEach(function(k){ps(r,k).aff+=1;});}
    petQuest('min',1);petSave();
    if(petGift)petGreet();
  },15000);
  // 點頁尾：左邊貓跳台開貓咪、中間狗屋開薩摩耶、右邊冰屋開企鵝
  document.getElementById('scene').addEventListener('click',function(e){
    var home=e.target.closest('.home-cat,.home-pg,.home-dg');
    if(home){petSetResting(home.classList.contains('home-cat')?pets.cat:home.classList.contains('home-dg')?pets.dg:pets.pg,false);return;}
    var b=this.getBoundingClientRect(),fx=(e.clientX-b.left)/b.width;petOpenSheet(fx<.36?'cat':fx<.68?'dg':'pg');
  });
  petSynced=!(syncCode&&syncCode!=='LOCAL');
  if(petSynced)petReady();
  petList().forEach(function(p,i){petNext(p,2500+i*700);});petScheduleDrop();
  setInterval(petTryCombo,350);
}

(function init(){
  try{var rd=lsGet('scheduleDataV2');if(rd)scheduleData=JSON.parse(rd);}catch(e){}
  try{var rs=lsGet('shiftSetsV2');if(rs)shiftSets=JSON.parse(rs);}catch(e){}
  try{var rp=lsGet('profilePinsV2');if(rp)profilePins=JSON.parse(rp);}catch(e){}
  try{var re=lsGet('eventsV1');if(re)calEvents=cleanEvents(JSON.parse(re));}catch(e){}
  try{var old=lsGet('xd7');if(old&&!Object.keys(scheduleData.syue||{}).length)scheduleData.syue=JSON.parse(old);}catch(e){}
  try{var oldS=lsGet('xd7s');if(oldS){var os=JSON.parse(oldS);if(os&&os.length)shiftSets.syue=os.map(s=>Object.assign({off:(s.name||'').includes('休')&&!(s.name||'').includes('加班')},s));}}catch(e){}
  if(!scheduleData.syue)scheduleData.syue={};
  if(!scheduleData.ling)scheduleData.ling={};
  if(!shiftSets.syue)shiftSets.syue=JSON.parse(JSON.stringify(DEF_SHIFTS.syue));
  if(!shiftSets.ling)shiftSets.ling=JSON.parse(JSON.stringify(DEF_SHIFTS.ling));
  ensureShiftSlots('syue');ensureShiftSlots('ling');
  var migratedLingDefaults=false;
  if((shiftSets.ling[1]&&shiftSets.ling[1].name==='綾早班')||(shiftSets.ling[2]&&shiftSets.ling[2].name==='綾晚班')){
    migratedLingDefaults=true;
    var oldLing=shiftSets.ling;
    shiftSets.ling=[
      oldLing[0]||JSON.parse(JSON.stringify(DEF_SHIFTS.ling[0])),
      oldLing[2]||JSON.parse(JSON.stringify(DEF_SHIFTS.ling[1])),
      Object.assign({},oldLing[1]||DEF_SHIFTS.ling[2],{name:'',emoji:'',off:false}),
      Object.assign({},oldLing[3]||DEF_SHIFTS.ling[3],{name:'',emoji:'',off:false})
    ];
  }
  if(migratedLingDefaults){
    Object.keys(scheduleData.ling).forEach(function(monthKey){
      var monthData=scheduleData.ling[monthKey]||{};
      Object.keys(monthData).forEach(function(dayKey){
        if(monthData[dayKey]===3)monthData[dayKey]=2;
        else if(monthData[dayKey]===2||monthData[dayKey]===4)delete monthData[dayKey];
      });
    });
  }
  currentUser=lsGet('currentUser')||'';
  calMode=!currentUser&&lsGet('calMode')==='1';
  syncCode=lsGet('syncCode')||'';
  // 加入連結 ?code=XXX：還沒連上雲端的手機直接用這組（主畫面圖示也會記住這個網址）
  var urlCode='';try{urlCode=normalizeCode(new URLSearchParams(location.search).get('code'));}catch(e){}
  if(urlCode.length>=2&&(!syncCode||syncCode==='LOCAL')){syncCode=urlCode;lsSet('syncCode',urlCode);}
  loadChanges();
  saveLocalOnly();render();renderChgBar();
  buildFlags();renderPhoto();
  if(!syncCode){syncCode='LOCAL';lsSet('syncCode','LOCAL');}
  document.getElementById('frOv').style.display='none';
  petInit();
  // 一律載入 Firebase：本機模式的新手機也能在設定裡輸入同步代碼加入
  initFirebase().then(function(){
    if(cloudOn()){startListener(syncCode);return;}
    setDot('');
    // 連不上雲端：寵物先用這支手機的資料
    if(!petSynced){petSynced=true;petReady();}
    if(FIREBASE_READY&&lsGet('skipJoin')!=='1')showJoinPrompt();
  });
})();
</script>
