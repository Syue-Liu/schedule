<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#A8D3E6">
<title>摩托車冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<link rel="stylesheet" href="game.css">
<style>
html,body{overflow:hidden;}
body{background:#A9C98F;touch-action:none;}
/* 場景用 1080×1920 的座標擺，再依螢幕縮放；遠山、樹、路面各自用不同速度往左捲 */
.world{position:fixed;left:50%;bottom:0;width:1080px;height:1920px;transform-origin:50% 100%;background:url(../assets/games/moto/bg-painted.svg) 0 0/100% 100% no-repeat;overflow:hidden;}
.layer{position:absolute;left:0;width:1080px;background-repeat:repeat-x;}
.hills{top:880px;height:500px;background-image:url(../assets/games/moto/hills.svg);background-size:1080px 500px;}
.trees{top:1000px;height:360px;background-image:url(../assets/games/moto/trees.svg);background-size:1080px 360px;}
.road{top:1340px;height:580px;background-image:url(../assets/games/moto/road.svg);background-size:540px 580px;}
.obj{position:absolute;left:0;top:0;will-change:transform;}
.obj.knock{transition:transform .6s ease-out,opacity .6s;opacity:0;}
.obj.got{transition:transform .35s ease-out,opacity .35s;opacity:0;}
/* 小鳥：翅膀一上一下（用 scale，位置還是用 transform 移） */
.obj.bird{animation:flap .28s ease-in-out infinite alternate;}
@keyframes flap{to{scale:1 .82;}}
/* 三隻擠一台車 */
.rider{position:absolute;left:0;top:0;width:420px;height:380px;will-change:transform;}
.rider .sc{position:absolute;left:0;top:140px;width:420px;height:240px;}
.rider .wh{position:absolute;top:280px;width:100px;height:100px;animation:spin .4s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.rider .p{position:absolute;}
.rider .bk{position:absolute;left:326px;top:196px;width:100px;}
.rider .p img{width:100%;display:block;}
.rider .p .g-say{font-size:30px;padding:6px 16px;border-width:4px;border-radius:24px;}
.rider .bob{position:absolute;inset:0;animation:bob .32s ease-in-out infinite alternate;}
@keyframes bob{to{transform:translateY(5px);}}
.rider.air .bob{animation:none;transform:rotate(-6deg);transform-origin:30% 90%;}
.rider.hurt{animation:blink .15s steps(2) 8;}
@keyframes blink{50%{opacity:.35;}}
.rider.crash .bob{transition:transform .8s ease-in;transform:rotate(24deg) translateY(30px);}
.dust{position:absolute;width:60px;height:36px;border-radius:50%;background:rgba(255,252,246,.85);border:4px solid var(--ink);pointer-events:none;animation:dust .5s ease-out forwards;}
@keyframes dust{to{transform:translate(-80px,-20px) scale(1.6);opacity:0;}}
.tap{position:fixed;inset:0;z-index:10;}
/* 上面的路程條：小摩托車往終點旗子跑 */
.route{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top) + 74px);z-index:21;height:12px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);pointer-events:none;}
.route i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--wakatake);}
.route b{position:absolute;top:50%;left:0;transform:translate(-50%,-55%);font-size:20px;font-weight:400;}
.route u{position:absolute;right:-6px;top:50%;transform:translateY(-60%);font-size:20px;text-decoration:none;}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 22px);z-index:21;padding:6px 14px;border:var(--lw2) solid var(--ink);border-radius:999px;background:var(--paper);font-size:15px;white-space:nowrap;pointer-events:none;}
#hearts{letter-spacing:-2px;}
</style>
<link rel="stylesheet" href="polish.css?v=storybook-20261026">
</head>
<body data-game="moto">
<div class="world" id="world">
  <div class="layer hills" id="hills"></div>
  <div class="layer trees" id="trees"></div>
  <div class="layer road" id="road"></div>
  <div id="objs"></div>
  <div class="rider" id="rider"><div class="bob">
    <img class="sc" id="sc" alt="">
    <div class="p" id="pDg" style="left:18px;width:196px;bottom:150px"><img alt=""><div class="g-say"></div></div>
    <div class="p" id="pCat" style="left:118px;width:200px;bottom:156px"><img alt=""><div class="g-say"></div></div>
    <div class="p" id="pPg" style="left:318px;width:118px;bottom:128px"><img alt=""><div class="g-say"></div></div>
    <img class="bk" id="bk" alt="">
    <img class="wh" id="wh1" alt="" style="left:45px"><img class="wh" id="wh2" alt="" style="left:310px">
  </div></div>
</div>
<div class="tap" id="tap"></div>
<div class="g-bar"><button class="g-back" onclick="location.href='./'">‹ 大廳</button><div class="g-title">摩托車冒險</div><div class="g-pill" id="hearts">❤️❤️❤️</div><div class="g-pill hot" id="score">0 分</div></div>
<div class="route"><i id="rFill"></i><b id="rBike">🛵</b><u>🏁</u></div>
<div class="tip" id="tip">點一下畫面就會跳</div>
<script src="sound.js?v=sound-20261026"></script>
<script src="game.js?v=dive-20261029"></script>
<script>
// 美術：之後換成畫好的圖，只要改這裡的檔名
var A='../assets/games/moto/',ART={sky:A+'bg-painted.svg',hills:A+'hills.svg',trees:A+'trees.svg',road:A+'road.svg',scooter:A+'scooter.svg',wheel:A+'wheel.svg',basket:A+'basket.svg',cone:A+'cone.svg',bird:A+'bird.svg',rock:A+'rock.svg',barrier:A+'barrier.svg',kib:'../assets/games/ui/kib.svg',fish:'../assets/games/ui/fish.svg'};
// 跑 40 秒到終點；速度從 650 慢慢加到 1000；跳起來最高大約 340
var TIME=40,GROUND=1470,RX=150,JUMP=1600,GRAV=3800,HEARTS=3;
// 障礙物大小（寬、高）；道具：飼料 +1、魚 +3
// 小鳥飛在頭上 430 的高度、往這邊飛：待在地上就不會撞到，跳起來會撞
var OBS={cone:{w:90,h:105},rock:{w:130,h:92},barrier:{w:104,h:142},bird:{w:130,h:92,fly:430,vx:220}},ITEM={kib:{pts:1,s:84},fish:{pts:3,s:96}};
var $=function(id){return document.getElementById(id);};
var state='idle',t0=0,left=TIME,off=0,speed=600,jy=0,vy=0,buf=0,hearts=HEARTS,inv=0,score=0,objs=[],nextAt=0,raf=0,last=0,talk=0,combo=0;
// 星星：90 分三顆、55 分兩顆
function stars(s){return s>=90?3:s>=55?2:1;}

function fit(){var s=Math.min(Math.max(Math.min(innerWidth,600)/1080,innerHeight/1920),innerHeight/1300);$('world').style.transform='translateX(-50%) scale('+s+')';}
fit();addEventListener('resize',fit);
$('sc').src=ART.scooter;$('bk').src=ART.basket;$('wh1').src=ART.wheel;$('wh2').src=ART.wheel;
$('pDg').querySelector('img').src=G.petImg('dg','happy');$('pCat').querySelector('img').src=G.petImg('cat','happy');$('pPg').querySelector('img').src=G.petImg('pg','idle');

function say(id,text,ms){var p=$(id),s=p.querySelector('.g-say');s.textContent=text;s.classList.add('on');clearTimeout(p._t);p._t=setTimeout(function(){s.classList.remove('on');},ms||1000);}
function anyPet(){return ['pDg','pCat','pPg'][Math.floor(Math.random()*3)];}
function tip(t){$('tip').textContent=t;}
function drawHearts(){var h='';for(var i=0;i<HEARTS;i++)h+=i<hearts?'❤️':'🤍';$('hearts').textContent=h;}
// 放東西：wx 是路上的絕對位置，畫的時候減掉已經跑的距離
function add(kind,wx,hy){
  var o={kind:kind,wx:wx},im=document.createElement('img');im.className='obj';
  if(OBS[kind]){o.w=OBS[kind].w;o.h=OBS[kind].h;o.y=GROUND-o.h-(OBS[kind].fly||0);o.vx=OBS[kind].vx||0;if(o.vx)im.classList.add('bird');im.src=ART[kind];im.style.width=o.w+'px';im.style.height=o.h+'px';}
  else{o.item=1;o.w=ITEM[kind].s;o.h=o.w;o.y=GROUND-hy-o.h/2;im.src=ART[kind];im.style.width=o.w+'px';im.style.height=o.h+'px';}
  o.el=im;$('objs').appendChild(im);objs.push(o);return o;
}
// 一段路：障礙物上面排一道弧形的飼料，跳過去剛好吃到
function arc(cx){add('kib',cx-170-42,370);add('kib',cx-42,430);add('kib',cx+170-42,370);}
function segment(wx,el){
  var pool=['cone','cone','rock','rock','line','line','line','high'];
  if(el>8)pool.push('barrier','barrier');
  if(el>12)pool.push('double','double','barrier');
  if(el>7)pool.push('bird','bird','conebird');
  var p=pool[Math.floor(Math.random()*pool.length)],len=0;
  if(p==='cone'||p==='rock'){var o=add(p,wx,0);arc(wx+o.w/2);len=o.w+200;}
  else if(p==='barrier'){add('barrier',wx,0);add('fish',wx+52-48,450);len=304;}
  else if(p==='line'){for(var i=0;i<4;i++)add('kib',wx+i*130,110);len=520;}
  else if(p==='high'){add('fish',wx,520);len=200;}
  // 小鳥：下面排一排飼料，待在地上就吃得到；三角錐後面接一隻鳥，跳完要忍住別再跳
  else if(p==='bird'){add('bird',wx+300,0);for(var j=0;j<3;j++)add('kib',wx+j*130,110);len=520;}
  else if(p==='conebird'){add('cone',wx,0);add('kib',wx+3,430);add('bird',wx+1100,0);len=700;}
  else if(p==='double'){add('cone',wx,0);add('kib',wx+3,430);add('rock',wx+780,0);add('kib',wx+780+23,430);len=920;}
  return len;
}
function jump(){
  if(state!=='play')return;
  if(jy<=0){vy=JUMP;jy=.01;$('rider').classList.add('air');SND.sfx('jump');}
  else buf=.14; // 快落地時先按也算，落地馬上跳
}
function hurt(o){
  hearts--;inv=1.3;combo=0;drawHearts();SND.sfx(hearts?'bump':'crash');
  o.el.classList.add('knock');o.el.style.transform='translate('+(o.wx-off+160)+'px,'+(o.y-120)+'px) rotate(80deg)';o.dead=1;
  var r=$('rider');r.classList.remove('hurt');void r.offsetWidth;r.classList.add('hurt');
  say(anyPet(),hearts?'哎呀！':'哇啊啊！',900);tip(hearts?'撞到了！還剩 '+hearts+' 顆愛心':'摔車了…');
  if(navigator.vibrate)navigator.vibrate(120);
  if(!hearts)crash();
}
function collect(o){
  SND.sfx(o.kind==='fish'?'fishup':'coin');var k=ITEM[o.kind];score+=k.pts;combo++;$('score').textContent=score+' 分';o.dead=1;
  o.el.classList.add('got');o.el.style.transform='translate('+(o.wx-off-40)+'px,'+(o.y-140)+'px) scale(1.4)';
  var r=o.el.getBoundingClientRect();G.float(r.left+r.width/2,r.top,'+'+k.pts,'gold');
  if(o.kind==='fish')say('pCat','魚！',800);
  else if(combo%8===0)say(anyPet(),['衝呀～','好多飼料！','騎得好！'][combo/8%3|0],900);
}
function tick(t){
  var dt=Math.min(.05,(t-last)/1000);last=t;
  if(state==='play'||state==='crash'){
    var el=TIME-left;
    // 車子越快，配樂也跟著快一點
    if(state==='play'){left-=dt;speed=650+350*Math.min(1,el/TIME);SND.tempo(speed/650);}
    else speed=Math.max(0,speed-900*dt);
    off+=speed*dt;
    // 跳：重力往下拉，落地時有按過就再跳
    if(jy>0){vy-=GRAV*dt;jy+=vy*dt;if(jy<=0){jy=0;vy=0;$('rider').classList.remove('air');dust();SND.sfx('land');if(buf>0&&state==='play'){buf=0;jump();}}}
    if(buf>0)buf-=dt;if(inv>0)inv-=dt;
    // 前面快沒路了就再鋪一段
    while(state==='play'&&nextAt<off+1500&&left>1.2){nextAt+=segment(nextAt,el)+440+Math.random()*380;}
    var by=GROUND-jy;
    objs.forEach(function(o){
      if(o.dead)return;
      if(o.vx&&state==='play')o.wx-=o.vx*dt;
      var x=o.wx-off;o.el.style.transform='translate('+x+'px,'+o.y+'px)';
      if(o.vx&&!o.warned&&x<1080){o.warned=1;tip('小鳥飛過來了，先不要跳！');say(anyPet(),'低頭！',800);}
      if(state!=='play')return;
      if(o.item){
        // 吃道具：整台車連三隻的範圍
        if(x<RX+400&&x+o.w>RX+40&&o.y+o.h>by-340&&o.y<by)collect(o);
      }else if(o.vx){if(inv<=0&&x<RX+380&&x+o.w>RX+60&&by-340<o.y+o.h-10)hurt(o);}
      else if(inv<=0&&x<RX+320&&x+o.w>RX+110&&by>o.y+10)hurt(o);
    });
    objs=objs.filter(function(o){if(o.wx-off<-300){o.el.remove();return false;}if(o.dead&&!o.el.isConnected)return false;return true;});
    $('rider').style.transform='translate('+RX+'px,'+(by-380)+'px)';
    $('hills').style.backgroundPosition=(-off*.12)+'px 0';$('trees').style.backgroundPosition=(-off*.4)+'px 0';$('road').style.backgroundPosition=(-off)+'px 0';
    var p=Math.min(1,el/TIME);$('rFill').style.width=p*100+'%';$('rBike').style.left=p*100+'%';
    if(state==='play'&&left<=0){finish(true);return;}
  }
  raf=requestAnimationFrame(tick);
}
function dust(){var d=document.createElement('div');d.className='dust';d.style.left=(RX+30)+'px';d.style.top=(GROUND-30)+'px';$('world').appendChild(d);setTimeout(function(){d.remove();},520);}
function crash(){state='crash';$('rider').classList.add('crash');setTimeout(function(){finish(false);},1300);}
// 到終點：剩下的愛心每顆 +2
function finish(ok){
  var bonus=ok?hearts*2:0;state='done';score+=bonus;$('score').textContent=score+' 分';
  if(ok){$('rider').classList.remove('air');tip('抵達終點！'+(bonus?'剩下的愛心 +'+bonus:''));say('pDg','到了！',1500);say('pPg','好好玩！',1500);}
  setTimeout(function(){G.finish({game:'moto',score:score,unit:'分',stars:stars(score),note:'飼料 +1、魚 +3、到終點時每顆愛心 +2<br>90 分三顆星、55 分兩顆星',again:function(){G.countdown(start);}});},ok?1200:300);
}
function start(){
  objs.forEach(function(o){o.el.remove();});objs=[];
  SND.tempo(1);state='play';left=TIME;off=0;speed=650;jy=0;vy=0;buf=0;hearts=HEARTS;inv=0;score=0;combo=0;nextAt=1300;
  var r=$('rider');r.classList.remove('crash','hurt','air');
  drawHearts();$('score').textContent='0 分';tip('點一下畫面就會跳');
  last=performance.now();cancelAnimationFrame(raf);raf=requestAnimationFrame(tick);
}
$('tap').addEventListener('pointerdown',function(e){e.preventDefault();jump();});
addEventListener('keydown',function(e){if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();jump();}});
$('rider').style.transform='translate('+RX+'px,'+(GROUND-380)+'px)';drawHearts();
G.preload(Object.keys(ART).map(function(k){return ART[k];}),function(){
  G.intro({game:'moto',title:'摩托車冒險',desc:'三隻擠一台車去兜風！<br>點畫面跳過三角錐、石頭和柵欄<br>小鳥飛過來時不要跳，待在地上讓牠飛過去<br>撞到會少一顆愛心，沿路吃飼料和魚',start:start});
});
document.addEventListener('visibilitychange',function(){last=performance.now();});
</script>
</body>
</html>
